/* Import du planning annuel d'astreinte. Format attendu (celui du service) : une ligne de dates, des sections en colonne A
   (« Encadrement astreinte technique AEP », « Agent Exploitation Eau »), le nom en colonne B, une initiale sur la semaine.
   Accepte aussi un CSV simple : date;encadrant;agent */
const XLSX_URL='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const isoUTC=d=>{const x=new Date(Math.round(d.getTime()/864e5)*864e5);return x.getUTCFullYear()+'-'+String(x.getUTCMonth()+1).padStart(2,'0')+'-'+String(x.getUTCDate()).padStart(2,'0');};
function lireDate(v){if(v instanceof Date)return isoUTC(v);const s=String(v||'').trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):null;}
function lireOds(buf,nomFeuille){
  const z=XLSX.CFB.read(new Uint8Array(buf),{type:'array'}),f=XLSX.CFB.find(z,'content.xml');
  if(!f)throw new Error('fichier .ods illisible');
  const doc=new DOMParser().parseFromString(new TextDecoder().decode(f.content),'application/xml');
  const tabs=[...doc.getElementsByTagName('table:table')],tab=tabs.find(t=>nomFeuille&&nomFeuille.test(t.getAttribute('table:name')||''))||tabs[0],rows=[];
  rows.feuille=tab.getAttribute('table:name')||'';
  for(const tr of tab.getElementsByTagName('table:table-row')){
    const rr=Math.min(+(tr.getAttribute('table:number-rows-repeated')||1),5),row=[];
    for(const c of tr.children){
      if(c.tagName!=='table:table-cell'&&c.tagName!=='table:covered-table-cell')continue;
      const n=Math.min(+(c.getAttribute('table:number-columns-repeated')||1),800),dv=c.getAttribute('office:date-value');
      let v=null;
      if(dv){const [y,m,d]=dv.slice(0,10).split('-').map(Number);v=new Date(Date.UTC(y,m-1,d));}
      else{const t=[...c.getElementsByTagName('text:p')].map(x=>x.textContent).join(' ').trim();v=t||null;}
      for(let k=0;k<n&&row.length<1200;k++)row.push(v);
    }
    for(let k=0;k<rr&&rows.length<3000;k++)rows.push(row);
  }
  return rows;
}
async function importerAstreintes(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  let rows;
  try{
    if(/\.(csv|txt)$/i.test(f.name)){rows=(await f.text()).split(/\r?\n/).map(l=>l.split(/[;\t]/).map(x=>x.trim()||null));rows.feuille='listing';}
    else{
      if(!window.XLSX)await script(XLSX_URL);
      const buf=await f.arrayBuffer();
      if(/\.ods$/i.test(f.name))rows=lireOds(buf,/listing/i);   // lecture directe : les cellules fusionnées ne décalent pas les colonnes
      else{const wb=XLSX.read(buf,{type:'array',cellDates:true}),nf=wb.SheetNames.find(n=>/listing/i.test(n))||wb.SheetNames[0];
        rows=XLSX.utils.sheet_to_json(wb.Sheets[nf],{header:1,raw:true,defval:null});rows.feuille=nf;}
    }
  }catch(e){alert('Lecture impossible : '+e.message);return;}
  // Liste : une ligne d'en-tête avec « Date … », puis une ligne par semaine
  const hr=rows.slice(0,15).findIndex(r=>(r||[]).some(v=>typeof v==='string'&&/date/i.test(v)));
  if(hr>=0&&/listing/i.test(rows.feuille||'')||hr>=0&&rows.length<120)return choixColonnes(rows,hr);
  importGrille(rows);
}
function choixColonnes(rows,hr){
  const H=rows[hr].map(v=>v==null?'':String(v)),corps=rows.slice(hr+1).filter(r=>r&&r.some(v=>v!=null));
  const nc=Math.max(...rows.slice(hr,hr+60).map(r=>(r||[]).length));
  const lib=c=>`${String.fromCharCode(65+c)} — ${H[c]&&H[c]!=='0'?H[c]:(corps.map(r=>r[c]).find(v=>v!=null&&String(v).trim()!=='')||'')}`.slice(0,60);
  const cd=Math.max(0,H.findIndex(x=>/d[ée]but/i.test(x)));
  const prenoms=new Set(AGP.map(a=>norm(a.nom)));
  const score=c=>corps.filter(r=>String(r[c]??'').split(',').some(n=>prenoms.has(norm(n).split(' ')[0]))).length;
  const ce=H.findIndex(x=>/encadrement astreinte technique/i.test(norm(x))&&/aep/i.test(norm(x)));
  let ca=-1,best=0;for(let c=0;c<nc;c++){if(c===cd||c===ce)continue;const s=score(c);if(s>best){best=s;ca=c;}}
  const sel=(id,cur)=>`<select class="sel" id="${id}"><option value="-1">— aucune —</option>${[...Array(nc).keys()].map(c=>`<option value="${c}" ${c===cur?'selected':''}>${esc(lib(c))}</option>`).join('')}</select>`;
  window.__LST={rows,hr};
  ouvrir(`<h2>Import des astreintes</h2><p class="sub2">Feuille « ${esc(rows.feuille||'')} » : ${corps.length} lignes. Vérifie les colonnes (les titres « 0 » sont remplacés par la première valeur trouvée).</p><div class="frm">
   <label class="l">Date de début de semaine</label>${sel('ic-d',cd)}
   <label class="l">Encadrant d'astreinte</label>${sel('ic-e',ce)}
   <label class="l">Agent terrain (exploitation eau)</label>${sel('ic-a',ca)}</div>
   <div class="acts"><button class="btn-l" onclick="fermer()">Annuler</button><button class="btn-p" onclick="lireListe()">Continuer</button></div>`);
}
function lireListe(){
  const {rows,hr}=window.__LST,cd=+$('ic-d').value,ce=+$('ic-e').value,ca=+$('ic-a').value,S={};
  if(cd<0||(ce<0&&ca<0)){alert('Choisis la colonne des dates et au moins une colonne de noms.');return;}
  for(const r of rows.slice(hr+1)){
    const d=lireDate(r&&r[cd]);if(!d)continue;const s=iso(vendrediAvant(dt(d)));
    for(const [c,role] of [[ce,'encadrant'],[ca,'agent']]){if(c<0||r[c]==null)continue;
      for(const n of String(r[c]).split(',').map(x=>x.trim()).filter(Boolean)){S[s]??={encadrant:[],agent:[]};if(!S[s][role].includes(n))S[s][role].push(n);}}
  }
  apercuImport(S);
}
function importGrille(rows){
  const S={},add=(day,role,nom)=>{const s=iso(vendrediAvant(dt(day)));S[s]??={encadrant:[],agent:[]};if(!S[s][role].includes(nom))S[s][role].push(nom);};
  let dr=-1,best=0;rows.forEach((r,i)=>{const n=(r||[]).filter(v=>v instanceof Date).length;if(n>best){best=n;dr=i;}});
  if(dr<0){alert('Ni liste ni grille d\'astreinte reconnue dans ce fichier.');return;}
  let role=null;
  for(let i=dr+1;i<rows.length;i++){
    const r=rows[i]||[],lab=norm(r[0]);
    if(lab)role=lab.startsWith('encadrement astreinte technique')&&lab.includes('aep')?'encadrant':lab.startsWith('agent exploitation eau')?'agent':null;
    if(!role||!r[1])continue;
    for(let c=2;c<r.length;c++){const v=r[c],d=rows[dr][c];if(v==null||!(d instanceof Date))continue;if(/^[A-Za-zÀ-ÿ]{1,3}$/.test(String(v).trim()))add(isoUTC(d),role,String(r[1]).trim());}
  }
  apercuImport(S);
}
function apercuImport(S){
  const sem=Object.keys(S).sort();if(!sem.length){alert('Aucune astreinte trouvée.');return;}
  const noms=[...new Set(sem.flatMap(s=>[...S[s].encadrant,...S[s].agent]))];
  const trouve=n=>{const k=norm(n),p=k.split(' ')[0];return INT.find(i=>i.type==='agent'&&(norm(i.nom)===k||norm(i.nom)===p))||INT.find(i=>{const j=norm(i.nom);return i.type==='agent'&&j.length>2&&p.length>2&&(j.startsWith(p)||p.startsWith(j));});};
  const anom=sem.filter(s=>S[s].encadrant.length!==1||S[s].agent.length!==1);
  window.__IMP={S,sem};
  ouvrir(`<h2>Import des astreintes</h2><p class="sub2">${sem.length} semaines, du ven. ${dt(sem[0]).toLocaleDateString('fr-FR')} au ven. ${dt(sem[sem.length-1]).toLocaleDateString('fr-FR')}. Les semaines déjà saisies sur cette période seront remplacées.</p>
   ${anom.length?`<div class="banner">À vérifier : ${anom.map(s=>dt(s).toLocaleDateString('fr-FR')+' ('+[...S[s].encadrant,...S[s].agent].join(', ')+')').join(' · ')}</div>`:''}
   <div class="tw"><table><thead><tr><th>Nom dans le fichier</th><th>Dans AquaPilot</th></tr></thead><tbody>
   ${noms.map(n=>{const t=trouve(n);return `<tr><td>${esc(n)}</td><td><select class="sel imp-n" data-nom="${esc(n)}"><option value="nom" ${t?'':'selected'}>Nom seul, sans rôle dans l'appli</option><option value="skip">Ignorer</option>${INT.filter(i=>i.type==='agent').map(i=>`<option value="${i.id}" ${t&&t.id===i.id?'selected':''}>${esc(i.nom)}</option>`).join('')}</select></td></tr>`;}).join('')}
   </tbody></table></div>
   <div class="acts"><button class="btn-l" onclick="fermer()">Annuler</button><button class="btn-p" id="imp-ok" onclick="validerImport()">Importer</button></div>`);
}
async function validerImport(){
  const {S,sem}=window.__IMP,map={};$('imp-ok').disabled=true;
  for(const s of dlg.querySelectorAll('.imp-n'))map[s.dataset.nom]=s.value;
  const prenom=n=>{const w=n.trim().split(/\s+/);return w.length>1&&w.slice(1).every(x=>x===x.toUpperCase())?w[0]:n.trim();};   // « Patrice ALMEIDA » → « Patrice »
  const rows=sem.flatMap(s=>['encadrant','agent'].flatMap(role=>S[s][role].filter(n=>map[n]!=='skip').map(n=>map[n]==='nom'?{semaine:s,role,nom:prenom(n)}:{semaine:s,role,intervenant_id:+map[n]})));
  let {error}=await db.from('planning_astreintes').delete().gte('semaine',sem[0]).lte('semaine',sem[sem.length-1]);
  if(!error)({error}=await db.from('planning_astreintes').insert(rows));
  if(error){alert(msgErr(error));$('imp-ok').disabled=false;return;}
  fermer();await apresReglage(rows.length+' lignes d\'astreinte importées');
}
async function apresReglage(msg){await chargerTout();vueReglages();if(msg)toast(msg);}
async function renommer(id,el){
  const v=el.value.trim();if(!v||v===INTM[id].nom){el.value=INTM[id].nom;return;}
  const {error}=await db.from('intervenants').update({nom:v}).eq('id',id);
  if(error){alert(error.code==='23505'?'Ce nom existe déjà.':msgErr(error));el.value=INTM[id].nom;return;}
  INTM[id].nom=v;toast('Nom corrigé');
}
async function majInt(id,k,v){
  const {error}=await db.from('intervenants').update({[k]:v}).eq('id',id);
  if(error){alert(msgErr(error));vueReglages();return;}
  INTM[id][k]=v;indexer();toast('Enregistré');
}
async function majActif(id,el){
  const a=INTM[id];
  if(!el.checked){
    let n=0;try{const {data}=await db.from('planning_missions').select('id').eq('agent_id',id).eq('statut','prevu').gte('jour',iso(new Date()));n=(data||[]).length;}catch(e){}
    const rou=ROU.filter(r=>r.agents.includes(id)).map(r=>r.titre);
    if(!confirm(`Désactiver ${a.nom} ?\n\nIl quitte la grille et les listes ; son nom reste sur ses tâches passées.`+(n?`\n⚠ ${n} mission(s) à venir lui sont encore attribuées : pense à les déplacer.`:'')+(rou.length?`\n⚠ Il figure dans : ${rou.join(', ')}. Pense à modifier ces routines.`:''))){el.checked=true;return;}
  }
  const {error}=await db.from('intervenants').update({actif:el.checked}).eq('id',id);
  if(error){alert(msgErr(error));el.checked=!el.checked;return;}
  await apresReglage(el.checked?a.nom+' réactivé':a.nom+' désactivé');
}
async function ajouterAgent(){
  const nom=$('n-ag').value.trim();if(!nom)return;
  const {error}=await db.from('intervenants').insert({nom,type:'agent',actif:true,en_planning:true});
  if(error){alert(error.code==='23505'?'Ce nom existe déjà (un ancien agent ? réactive-le, ou ajoute l\'initiale du nom).':msgErr(error));return;}
  await apresReglage(nom+' ajouté — pense à son ATT et à relier son compte');
}
async function lierCompte(id,uid){
  const {error}=await db.from('intervenants').update({user_id:uid||null}).eq('id',id);
  if(error){alert(error.code==='23505'?'Ce compte est déjà relié à un autre agent.':msgErr(error));vueReglages();return;}
  INTM[id].user_id=uid||null;indexer();toast('Enregistré');
}
async function majRegle(id,f,v){
  const val=f==='jour_semaine'?+v:v;
  const {error}=await db.from('planning_att_regles').update({[f]:val}).eq('id',id);
  if(error){alert(msgErr(error));return;}
  ATTR.find(r=>r.id===id)[f]=val;sauverCache();vueReglages();toast('ATT enregistré');
}
async function ajouterRegle(){
  const {error}=await db.from('planning_att_regles').insert({agent_id:+$('n-att').value,jour_semaine:1,semaines:'toutes',creneau:'journee',actif:false});
  if(error){alert(msgErr(error));return;}
  await apresReglage('ATT ajouté, inactif : règle le jour, les semaines et le créneau, puis coche « Active »');
}
async function supprRegle(id){
  if(!confirm('Supprimer cette règle d\'ATT ?'))return;
  const {error}=await db.from('planning_att_regles').delete().eq('id',id);
  if(error){alert(msgErr(error));return;}
  await apresReglage('ATT supprimé');
}
function formRou(id){
  const r=ROU.find(x=>x.id===id)||{titre:'',agents:[],jours:[],creneau:'journee',semaines:'toutes',mois:'tous',debut:'',fin:'',actif:true};
  ouvrir(`<h2>${id?'Modifier la mission récurrente':'Nouvelle mission récurrente'}</h2><div class="frm">
   <label class="l">Intitulé</label><input class="inp" id="o-t" value="${esc(r.titre)}" placeholder="Ex. TOURNÉES TRAITEMENT">
   <label class="l">Agents</label><div class="chk" id="o-a">${AGP.concat(INT.filter(i=>r.agents.includes(i.id)&&!AGP.includes(i))).map(a=>`<label><input type="checkbox" value="${a.id}" ${r.agents.includes(a.id)?'checked':''}>${esc(a.nom)}</label>`).join('')}</div>
   <label class="l">Jours</label><div class="chk" id="o-j">${OPT_J.map(([v,l])=>`<label><input type="checkbox" value="${v}" ${r.jours.includes(v)?'checked':''}>${l}</label>`).join('')}</div>
   <div class="two-c"><div><label class="l">Créneau</label><select class="sel" id="o-c">${opts(OPT_C,r.creneau)}</select></div><div><label class="l">Semaines</label><select class="sel" id="o-s">${opts(OPT_S,r.semaines)}</select></div></div>
   <label class="l">Dans le mois</label><select class="sel" id="o-m">${opts(OPT_M,r.mois)}</select>
   <div class="two-c"><div><label class="l">À partir du (facultatif)</label><input class="inp" type="date" id="o-d" value="${r.debut||''}"></div><div><label class="l">Jusqu'au (facultatif)</label><input class="inp" type="date" id="o-f" value="${r.fin||''}"></div></div>
   <div class="two-c"><div><label class="l">Si le jour est férié</label><select class="sel" id="o-sf">${opts([['supprimer','Elle n\'a pas lieu'],['decaler','Elle est décalée au…']],r.si_ferie||'supprimer')}</select></div>
   <div><label class="l">Jour de décalage</label><select class="sel" id="o-dj"><option value="">—</option>${opts(OPT_J,r.decale_jour||'')}</select></div></div>
   <label class="l"><input type="checkbox" id="o-x" ${r.actif?'checked':''}> Active (décocher pour la mettre en pause)</label></div>
   <p class="note">« Dernière semaine du mois » = la dernière semaine complète, du lundi au vendredi, dans le mois.</p>
   <div class="acts"><button class="btn-l" onclick="fermer()">Annuler</button><button class="btn-p" onclick="saveRou(${id})">Enregistrer</button></div>`);
}
async function saveRou(id){
  const v=k=>[...dlg.querySelectorAll('#'+k+' input:checked')].map(x=>+x.value);
  const row={titre:$('o-t').value.trim(),agents:v('o-a'),jours:v('o-j'),creneau:$('o-c').value,semaines:$('o-s').value,mois:$('o-m').value,debut:$('o-d').value||null,fin:$('o-f').value||null,actif:$('o-x').checked,si_ferie:$('o-sf').value,decale_jour:$('o-dj').value?+$('o-dj').value:null};
  if(row.si_ferie==='decaler'&&!row.decale_jour){alert('Choisis le jour de décalage.');return;}
  if(!row.titre||!row.agents.length||!row.jours.length){alert('Intitulé, au moins un agent et au moins un jour sont nécessaires.');return;}
  const {error}=id?await db.from('planning_routines').update(row).eq('id',id):await db.from('planning_routines').insert(row);
  if(error){alert(msgErr(error));return;}
  fermer();await apresReglage('Mission récurrente enregistrée');
}
async function supprRou(id){
  if(!confirm('Supprimer cette mission récurrente ? (Pour une pause, utilise plutôt « Modifier » › Active.)'))return;
  const {error}=await db.from('planning_routines').delete().eq('id',id);
  if(error){alert(msgErr(error));return;}
  await apresReglage('Mission récurrente supprimée');
}
async function retablir(id,day){
  const {error}=await db.from('planning_routine_exceptions').delete().eq('routine_id',id).eq('jour',day);
  if(error){alert(msgErr(error));return;}
  ROU.find(r=>r.id===id).ex.delete(day);sauverCache();vueReglages();toast('Occurrence rétablie');
}
start();
</script>
