<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EC">
<title>Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="profil.js"></script>
<script src="menu.js"></script>
<style>
:root{
  --bg:#F4F1EC; --card:#FFFFFF; --line:#E7E1D8; --ink:#26221E; --mute:#7A7068;
  --acc:#B84712; --acc-soft:#FBE9DC;
  --ok:#2F7D4F; --ok-soft:#E3F1E8; --warn:#B7791F; --warn-soft:#FCF1DC; --bad:#B42318; --bad-soft:#FDE7E4; --blue:#2F6F9F; --blue-soft:#E3EEF7;
  --font:'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;min-height:100%}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* Charpente (identique aux autres pages) */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center}
.brand b{font-size:1rem;display:block}.brand small{font-size:.7rem;color:var(--mute)}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;font-size:.93rem}
.nav a:hover{background:#F7F3EE}
.nav a.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.nav svg{width:28px;height:28px;margin:-4px;flex:none}
.ic{fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.side .who{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;font-size:.82rem;color:var(--mute)}
.side .who button{background:none;border:none;color:var(--acc);font-weight:600;padding:0;margin-top:4px}
main{padding:28px 32px 60px;min-width:0;max-width:1180px}
.crumb{font-size:.82rem;color:var(--mute);margin-bottom:6px}
.crumb a{color:var(--mute);text-decoration:none}
h1{font-size:1.75rem;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:.9rem;margin-top:4px}
.head{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.head-l{display:flex;gap:14px;align-items:center}
.hico{width:56px;height:56px;border-radius:14px;flex:none}
.bnav{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search,.sel,.inp{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit;color:var(--ink)}
.search{flex:1;min-width:180px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:.85rem;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip small{opacity:.65;font-weight:600;margin-left:3px}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{border:none;background:none;padding:10px 16px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.btn-l{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.88rem}
.btn-p{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-weight:600}
.btn-p:disabled{opacity:.5}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}.b-mute{background:#EFEBE5;color:var(--mute)}.b-blue{background:var(--blue-soft);color:var(--blue)}
.note{font-size:.8rem;color:var(--mute);margin-top:12px}
.loading{padding:60px;text-align:center;color:var(--mute)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:.86rem;font-weight:500;margin-bottom:14px}

/* Indicateurs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{padding:14px 18px}
.kpi .l{font-size:.78rem;color:var(--mute);font-weight:500}
.kpi .v{font-size:1.5rem;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.78rem;color:var(--mute)}

/* Liste */
.gh{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;background:#F7F3EE;font-size:.78rem;font-weight:700;color:var(--mute);border-bottom:1px solid var(--line)}
.trow{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.trow:last-child{border-bottom:none}
.trow:hover{background:#FBF8F4}
.trow.clos{opacity:.72}
.tt{font-weight:600;white-space:pre-line;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ts{font-size:.8rem;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.pcol{padding-top:1px}

/* Fenêtres */
dialog{border:none;border-radius:16px;padding:22px;max-width:560px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.25);margin:auto;color:var(--ink);font-family:var(--font);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(38,34,30,.45)}
dialog h2{font-size:1.1rem;margin-bottom:12px}
dialog .f{margin-bottom:12px}dialog .f>label,.lab{display:block;font-size:.78rem;font-weight:600;margin-bottom:4px}
dialog .f .inp,dialog .f .sel{width:100%}
textarea.inp{resize:vertical;min-height:84px}
dialog .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn-d{background:var(--bad-soft);color:var(--bad);border:none;border-radius:10px;padding:10px 14px;font-weight:600;margin-right:auto}
.two-c{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px}
.seg label{position:relative;flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px 6px;font-weight:600;font-size:.85rem;cursor:pointer;margin:0!important}
.seg input,.ck input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink)}
.seg label:has(input:focus-visible),.ck:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:2px}
.cks{display:flex;flex-wrap:wrap;gap:6px}
.ck{position:relative;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.84rem;cursor:pointer}
.ck:has(input:checked){background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:600}
.grp-t{font-size:.72rem;font-weight:700;color:var(--mute);margin:8px 0 4px}
.more{border:none;background:none;color:var(--acc);font-weight:600;padding:0;margin:2px 0 10px}
.etat{background:#FBF9F6;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.etat .inp{padding:7px 10px}

/* Réglages */
.tw{overflow:auto}
table{width:100%;border-collapse:collapse}
th{font-size:.74rem;font-weight:600;color:var(--mute);text-align:left;padding:10px;border-bottom:1px solid var(--line);background:#FBF9F6}
td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:.86rem;vertical-align:middle}
tr:last-child td{border-bottom:none}
.exp{padding:18px;margin-bottom:16px}
.exp h2{font-size:1.02rem;margin-bottom:10px}

/* Connexion */
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.login.off{display:none}
.login .card{width:100%;max-width:360px;padding:28px}
.login h2{margin-bottom:4px}.login p{color:var(--mute);font-size:.88rem;margin-bottom:16px}
.login label{display:block;font-size:.8rem;font-weight:600;margin:10px 0 4px}
.login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:600;width:100%;margin-top:16px}
.err{color:var(--bad);font-size:.85rem;margin-top:10px;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0));transform:translate(-50%,40px);opacity:0;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:.88rem;font-weight:500;transition:.2s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.fab[hidden]{display:none!important}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom,0));z-index:15;border:none;background:var(--acc);color:#fff;border-radius:999px;padding:14px 20px;font-weight:700;box-shadow:0 6px 20px rgba(184,71,18,.4);display:none}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}.side{display:none}
  main{padding:calc(16px + env(safe-area-inset-top,0)) 14px calc(90px + env(safe-area-inset-bottom,0))}
  h1{font-size:1.4rem}.hico{width:46px;height:46px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:10px 14px}.kpi .v{font-size:1.25rem}
  .head .btn-p{display:none}.fab{display:block}
  .two-c{grid-template-columns:1fr}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0));z-index:20}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--mute);text-decoration:none;font-weight:500}
  .bnav a.on{color:var(--acc)}.bnav svg{width:32px;height:32px;margin:-4px}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.toast{transition:none}}

/* ═══ Planning ═══ */
main{max-width:none}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.bar .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vseg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.vseg button{border:none;background:none;padding:8px 14px;font-weight:600;font-size:.88rem;color:var(--mute)}
.vseg button.on{background:var(--ink);color:#fff}
.wk{display:flex;gap:6px;align-items:center}.wk b{min-width:170px;text-align:center;font-size:.92rem}
.layout{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
.layout.sans-liste{grid-template-columns:1fr}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px}
.pl{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column}
.pl h2{font-size:1rem;padding:12px 14px 4px}
.pl .hint{font-size:.78rem;color:var(--mute);padding:0 14px 8px}
.pl .fl{display:flex;gap:6px;padding:0 14px 10px}
.pl .fl .inp{flex:1;min-width:0;padding:7px 10px}.pl .fl .sel{padding:6px}
.list{overflow:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:6px}
.t{border:1px solid var(--line);border-left:5px solid var(--mute);border-radius:10px;padding:7px 10px;background:#fff;cursor:grab;font-size:.82rem}
.t.p1{border-left-color:#C62828}.t.p2{border-left-color:#E6B800}.t.p3{border-left-color:#9BB0A2}
.t.choisi{outline:2px solid var(--acc);background:var(--acc-soft)}
.t b{display:block;font-size:.8rem}
.t .tx{color:var(--mute);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.t .tg{margin-top:3px;display:flex;gap:5px;flex-wrap:wrap}
.gridw{overflow:auto}
.pg{border-collapse:separate;border-spacing:0;width:100%;min-width:700px}
.pg th,.pg td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center}
.pg th{background:#FAF7F3;font-size:.8rem;padding:6px;position:sticky;top:0;color:var(--ink)}
.pg th.today{background:var(--acc-soft);color:var(--acc)}
.pg th small{display:block;font-weight:500;color:var(--mute)}
.pg td.ag{font-weight:700;padding:8px 10px;background:#FAF7F3;position:sticky;left:0;min-width:92px;font-size:.9rem;text-align:left;z-index:1}
.pg td.c{height:64px;width:9%;vertical-align:top;padding:3px;min-width:64px;text-align:left}
.pg td.c.am{border-right:1px dashed var(--line)}
.pg td.c.drop{background:var(--acc-soft);box-shadow:inset 0 0 0 2px var(--acc)}
.pg td.c.target{background:#FFF8F2;cursor:pointer}
.pg tr:last-child td{border-bottom:1px solid var(--line)}
.m{border-radius:8px;padding:3px 6px;font-size:.74rem;line-height:1.25;cursor:pointer;background:var(--blue-soft);border-left:4px solid var(--blue);overflow:hidden;margin-bottom:2px}
.m.p1{background:#FDE7E4;border-left-color:#C62828}.m.p2{background:#FFF7C7;border-left-color:#E6B800}
.pp{display:inline-block;font-size:.62rem;font-weight:800;line-height:1;padding:2px 4px;border-radius:4px;margin-right:4px;vertical-align:1px;color:#fff;background:#2F6F9F}
.pp.p1{background:#C62828}.pp.p2{background:#FFD600;color:#4A3C00}
.legend .pp{margin-right:2px}
.m.fait{background:var(--ok-soft);border-left-color:var(--ok);opacity:.85}.m.fait .mt{text-decoration:line-through}
.m b{display:block}.m i{display:block;font-style:normal;color:var(--mute)}
.ev{border-radius:6px;background:#EFE8F7;border-left:4px solid #7A4FB0;padding:1px 5px;font-size:.7rem;margin-bottom:2px;cursor:pointer;line-height:1.25}
.ev b{color:#5B3A8A}
.abs{border-radius:8px;padding:6px;font-size:.74rem;font-weight:700;text-align:center;background:repeating-linear-gradient(45deg,#EEE9E2,#EEE9E2 6px,#F6F2EC 6px,#F6F2EC 12px);color:var(--mute);cursor:pointer;margin-bottom:2px}
.abs.att{background:repeating-linear-gradient(45deg,#fff,#fff 6px,#F6F2EC 6px,#F6F2EC 12px);border:1px dashed #B9AFA2}
.abs small{display:block;font-weight:500;font-size:.66rem}
.m.rou{background:#E8EEF2;border-left-color:#5B7A8C}
.m.rou.conflit{box-shadow:inset 0 0 0 2px var(--bad)}
.m .cf{color:var(--bad);font-weight:600}
.rl{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
.rl b{font-size:.95rem}.rl .d{font-size:.82rem;color:var(--mute);margin-top:2px}.rl .acts{margin-top:8px;justify-content:flex-start}
.rl .xs{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:.78rem;margin:4px 4px 0 0}
.rl .xs button{border:none;background:none;color:var(--acc);font-weight:700;padding:0 6px}
tr.inactif td{opacity:.55}
.pg th.fer{background:#EEE9E2;color:var(--mute)}
.pg td.c.fer{background:repeating-linear-gradient(45deg,#F4F0EA,#F4F0EA 6px,#FAF8F4 6px,#FAF8F4 12px);cursor:default}
.pg td.c.fer span{display:block;text-align:center;color:var(--mute);font-size:.72rem;font-weight:600;padding-top:6px}
.astr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#FFF;border:1px solid var(--line);border-left:4px solid #B84712;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:.86rem}
.astr b{font-weight:700}.astr .sep{color:var(--mute)}.astr.click{cursor:pointer}
.ag .tel{display:inline-block;margin-left:5px;font-size:.66rem;font-weight:700;color:#fff;background:#B84712;border-radius:5px;padding:1px 5px;vertical-align:2px}
.ag .tel.enc{background:#7A7068}
.m .cr{color:var(--ok);font-weight:600}
.ph-th{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.ph-th img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.rap{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 10px;background:#FBF9F6;font-size:.86rem}
.rap small{color:var(--mute);display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--mute);margin:10px 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* fenêtres du planning */
dialog .sub2{color:var(--mute);font-size:.85rem;margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;font-weight:600;text-align:left}
.opts button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opts button.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
.opts button.dis{opacity:.5}.opts button.dis small{display:block;font-weight:500;color:var(--bad);margin-top:2px}
.opts .row{display:flex;gap:6px}.opts .row button{flex:1;text-align:center}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:flex;gap:5px;align-items:center;margin:0;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.84rem}
.chk label.dis{opacity:.5}
.frm label.l{display:block;font-size:.78rem;font-weight:600;margin:10px 0 3px}
.frm input.inp,.frm select.sel{width:100%}
/* Ma semaine */
.ms{max-width:640px;margin:0 auto}
.day{margin-bottom:14px}.day h3{font-size:.9rem;padding:4px 2px;color:var(--mute);text-transform:capitalize}.day.today h3{color:var(--acc)}
.slot{display:flex;gap:10px;margin-bottom:6px}
.slot>em{font-style:normal;font-size:.72rem;font-weight:700;color:var(--mute);width:48px;padding-top:10px;flex:none}
.slot .sc{flex:1;min-width:0}
.slot .m{padding:10px 12px;font-size:.88rem}
.slot .ev{padding:8px 10px;font-size:.84rem;margin-bottom:4px}
.slot .abs{padding:12px}
.slot .empty{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--mute);font-size:.82rem}
.sum{display:flex;gap:10px;margin-bottom:14px}
.sum div{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sum b{font-size:1.4rem;display:block}.sum small{color:var(--mute)}
.pdfcap{position:fixed;left:-20000px;top:0;background:#fff;padding:22px;font-family:var(--font);color:var(--ink)}
.pdfcap .pdft{font-size:22px;font-weight:700;margin-bottom:14px}
.pdfcap .box{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pdfcap .pg{min-width:0}.pdfcap .pg th,.pdfcap .pg td.ag{position:static}
.pdfcap .pg td.c{height:60px}.pdfcap .pg td.c.target{background:none}
.pdfcap.me h2{display:none}
.pdfcap .legend{margin:12px 2px 0;font-size:13px}
.pdfcap .abs{background:#ECE6DE}.pdfcap .pg td.c.fer{background:#F3EFE9}.pdfcap .abs.att{background:#F7F3EE}
.ph{display:none}
@media print{
 .side,.bnav,.fab,.crumb,.head,.bar,.pl,.tabs,#bandeaux,.legend,.toast,dialog,.login{display:none!important}
 body{background:#fff}
 .shell{display:block}
 main{padding:0}
 .ph{display:block;font-size:12pt;font-weight:700;margin-bottom:8px}
 .layout{display:block!important}.gridw{overflow:visible;border:1px solid #ccc;zoom:.78}
 .pg{min-width:0;font-size:7pt}
 .pg td.c{height:auto;min-width:0}
 .pg th,.pg td.ag{position:static}
 .m,.ev,.abs,.pg th.today{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .ms{max-width:none}.day{break-inside:avoid}
}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}.pl{position:static;max-height:340px}
  .wk b{min-width:120px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

const CRN=['matin','aprem'];
const TCOLS='id,priorite,statut,site_nom,site_type,famille,travaux,duree_estimee,reportee_nb,echeance';

/* ── Dates (midi local : pas de décalage de fuseau) ── */
const dt=s=>new Date(s+'T12:00:00');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const lundi=d=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
function semNum(d){const t=new Date(d);t.setHours(12,0,0,0);t.setDate(t.getDate()+3-((t.getDay()+6)%7));const w=new Date(t.getFullYear(),0,4);w.setHours(12,0,0,0);return 1+Math.round(((t-w)/864e5-3+((w.getDay()+6)%7))/7);}
const diffJ=(a,b)=>Math.round((dt(a)-dt(b))/864e5);
const dfr=s=>dt(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const fh=h=>h.replace(':','h');
const durTxt=m=>m<60?m+' min':(m%60?Math.floor(m/60)+'h'+String(m%60).padStart(2,'0'):m/60+' h');
const cap=s=>s?s.charAt(0)+s.slice(1).toLowerCase():'';
const cle=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16);});
const $=id=>document.getElementById(id);

/* ── État ── */
let user=null,INT=[],INTM={},AGP=[],TA={},EQ={},M=[],ABS=[],ATTR=[],ATTEX=new Set(),RDV=[],ROU=[],FER={},AST=[],RAP={};
let wk=lundi(new Date()),vue=innerWidth<700?'M':'G',me=null,MOI=null,sel=null,hors=false,onglet='planning',fQ='',fP='';
const P=()=>niv('planning');
const dayOf=i=>addDays(wk,i);
const peutPlanifier=ag=>P()>=3||(P()>=2&&MOI!=null&&ag===MOI);
const peutAbs=ag=>P()>=3||(P()>=2&&MOI!=null&&ag===MOI);
const peutMarquer=lot=>P()>=3||(MOI!=null&&M.some(x=>x.lot===lot&&x.agent_id===MOI));
const peutRdv=r=>P()>=3||(P()>=2&&r.created_by===user.id);
const horsReseau=e=>!navigator.onLine||/fetch|network|load failed/i.test((e&&e.message)||'');
const msgErr=e=>horsReseau(e)?'Hors connexion : cette action demande le réseau.':refusDroits(e)?'Action refusée par tes droits.':(e&&e.message)||'Erreur';

/* ── Connexion ── */

}
async function login(){er.textContent='';bl.disabled=true;const {error}=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});bl.disabled=false;if(error){er.textContent='Email ou mot de passe incorrect.';return;}start();}
async function logout(){await db.auth.signOut();location.reload();}
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3200);}

/* ── Chargement ── */
const cleCache=()=>'plan-cache-'+user.id;
async function chargerTaches(){
  const {data,error}=await db.from('taches').select(TCOLS).in('statut',['a_faire','planifie']).order('priorite').order('id');
  if(error)throw error;
  const ex={};for(const k in TA)if(!['a_faire','planifie'].includes(TA[k].statut))ex[k]=TA[k];   // tâches faites déjà connues (missions passées)
  TA=ex;for(const x of data)TA[x.id]=x;
  const ids=data.map(x=>x.id);EQ={};
  for(let i=0;i<ids.length;i+=100){
    const {data:e,error:e2}=await db.from('tache_equipiers').select('tache_id,intervenant_id').in('tache_id',ids.slice(i,i+100));
    if(e2)throw e2;for(const r of e)(EQ[r.tache_id]??=[]).push(r.intervenant_id);
  }
}
async function chargerSemaine(){
  const d0=iso(addDays(wk,-7)),d1=iso(addDays(wk,21));
  const [m,a,x]=await Promise.all([
    db.from('planning_missions').select('*').gte('jour',d0).lte('jour',d1).neq('statut','reporte').order('jour'),
    db.from('planning_absences').select('*').gte('jour',d0).lte('jour',d1),
    db.from('planning_att_exceptions').select('agent_id,jour').gte('jour',d0).lte('jour',d1)]);
  for(const r of [m,a,x])if(r.error)throw r.error;
  M=m.data;ABS=a.data;ATTEX=new Set(x.data.map(r=>r.agent_id+'|'+r.jour));
  const manq=[...new Set(M.map(r=>r.tache_id).filter(i=>i&&!TA[i]))];
  if(manq.length){const {data,error}=await db.from('taches').select(TCOLS).in('id',manq);if(error)throw error;for(const t of data)TA[t.id]=t;}
  const lots=[...new Set(M.map(r=>r.lot))];RAP={};
  for(let i=0;i<lots.length;i+=60){const {data,error}=await db.from('planning_rapports').select('*').in('lot',lots.slice(i,i+60)).order('created_at');if(error)throw error;for(const r of data)(RAP[r.lot]??=[]).push(r);}
}
async function chargerTout(){
  try{
    const r=await Promise.all([db.from('intervenants').select('*').order('id'),db.from('planning_att_regles').select('*').order('id'),
      db.from('planning_rdv').select('*').order('id'),db.from('planning_rdv_agents').select('rdv_id,agent_id'),db.from('planning_rdv_exceptions').select('rdv_id,jour'),
      db.from('planning_routines').select('*').order('id'),db.from('planning_routine_exceptions').select('routine_id,jour'),
      db.from('planning_feries').select('*'),db.from('planning_astreintes').select('*').order('semaine')]);
    for(const x of r)if(x.error)throw x.error;
    INT=r[0].data;ATTR=r[1].data;
    const rx={};for(const e of r[6].data)(rx[e.routine_id]??=[]).push(e.jour);
    ROU=r[5].data.map(x=>({...x,ex:new Set(rx[x.id]||[])}));
    FER=Object.fromEntries(r[7].data.map(f=>[f.jour,f]));AST=r[8].data;
    const ag={},ex={};for(const a of r[3].data)(ag[a.rdv_id]??=[]).push(a.agent_id);for(const e of r[4].data)(ex[e.rdv_id]??=[]).push(e.jour);
    RDV=r[2].data.map(x=>({...x,heure:(x.heure||'09:00').slice(0,5),agents:ag[x.id]||[],ex:new Set(ex[x.id]||[])}));
    await chargerTaches();await chargerSemaine();hors=false;sauverCache();
  }catch(e){
    if(!lireCache()){view.innerHTML=`<div class="card loading">Impossible de charger le planning : ${esc(e.message)}</div>`;throw e;}
    hors=true;
  }
  indexer();
}
function indexer(){
  INTM=Object.fromEntries(INT.map(i=>[i.id,i]));
  AGP=INT.filter(i=>i.type==='agent'&&i.actif&&i.en_planning);
  MOI=(INT.find(i=>i.user_id===user.id)||{}).id||null;
  if(me==null||!INTM[me])me=MOI||(AGP[0]&&AGP[0].id)||null;
}
function sauverCache(){try{localStorage.setItem(cleCache(),JSON.stringify({INT,ATTR,TA,EQ,M,ABS,ATTEX:[...ATTEX],FER,AST,RAP,wk:iso(wk),RDV:RDV.map(r=>({...r,ex:[...r.ex]})),ROU:ROU.map(r=>({...r,ex:[...r.ex]}))}));}catch(e){}}
function lireCache(){
  try{const c=JSON.parse(localStorage.getItem(cleCache()));if(!c)return false;
    INT=c.INT;ATTR=c.ATTR;TA=c.TA;EQ=c.EQ;M=c.M;ABS=c.ABS;ATTEX=new Set(c.ATTEX);RDV=c.RDV.map(r=>({...r,ex:new Set(r.ex)}));ROU=(c.ROU||[]).map(r=>({...r,ex:new Set(r.ex)}));FER=c.FER||{};AST=c.AST||[];RAP=c.RAP||{};wk=dt(c.wk);return true;}catch(e){return false;}
}
async function rafraichir(){
  try{await chargerTaches();await chargerSemaine();hors=false;sauverCache();}catch(e){hors=true;}
  rendu();
}

/* ── Routage ── */
window.addEventListener('hashchange',route);
function route(){onglet=location.hash==='#reglages'&&P()>=3?'reglages':'planning';page();}

  return `<div class="crumb"><a href="index.html">Accueil</a> › Planning</div>
  <div class="head"><div class="head-l"><svg class="hico" viewBox="0 0 96 96"><rect width="96" height="96" rx="24" fill="url(#tile)"/><use href="#i-pln" style="color:var(--acc)"/></svg>
  <div><h1>Planning</h1><div class="sub">Équipe, ATT, rendez-vous et « Ma semaine »</div></div></div></div>`;
}
function onglets(){return P()>=3?`<div class="tabs"><button class="${onglet==='planning'?'on':''}" onclick="location.hash=''">Planning</button><button class="${onglet==='reglages'?'on':''}" onclick="location.hash='reglages'">Réglages</button></div>`:'';}
function page(){
  view.innerHTML=entete()+'<div id="bandeaux"></div>'+onglets()+'<div id="corps"></div><div class="ph" id="ph"></div>';
  if(onglet==='reglages')vueReglages();else vuePlanning();
}

/* ═══ PLANNING ═══ */
function vuePlanning(){
  const liste=P()>=2;
  corps.innerHTML=`<div class="bar"><div class="grp">
    <div class="vseg"><button id="vG">Grille équipe</button><button id="vM">Ma semaine</button></div>
    <select class="sel" id="who-me" aria-label="Agent"></select>
    <div class="wk"><button class="btn-l" id="wk-p" aria-label="Semaine précédente">←</button><b id="wl"></b><button class="btn-l" id="wk-n" aria-label="Semaine suivante">→</button><button class="btn-l" id="wk-t">Aujourd'hui</button></div></div>
   <div class="grp"><button class="btn-l" id="b-att">ATT et routines</button>${P()>=2?'<button class="btn-p" id="b-rdv">+ Rendez-vous</button><button class="btn-l" id="b-lib">+ Mission libre</button><button class="btn-l" id="b-cg">Congés</button>':''}<button class="btn-l" id="b-pdf">PDF</button><button class="btn-l" id="b-mail">Envoyer (PDF)</button></div></div>
  <div id="astr"></div>
  <div id="vgrid" class="layout ${liste?'':'sans-liste'}">
   ${liste?`<aside class="box pl"><h2>À planifier <span id="cnt" style="color:var(--mute);font-weight:500"></span></h2><div class="hint">Glisse une tâche dans la grille, ou touche-la puis touche une case.</div>
     <div class="fl"><input class="inp" id="q" placeholder="Site, mot-clé…" value="${esc(fQ)}"><select class="sel" id="fp"><option value="">Toutes prio</option><option value="1">Prio 1</option><option value="2">Prio 2</option><option value="3">Prio 3</option></select></div>
     <div class="list" id="list"></div></aside>`:''}
   <section><div class="box gridw"><table class="pg" id="tb"></table></div>
   ${legende()}</section></div>
  <div id="vme" class="ms"></div>`;
  $('vG').onclick=()=>{vue='G';rendu()};$('vM').onclick=()=>{vue='M';rendu()};
  $('who-me').innerHTML=INT.filter(i=>i.type==='agent'&&i.actif).map(a=>`<option value="${a.id}" ${a.id===me?'selected':''}>${esc(a.nom)}</option>`).join('');
  $('who-me').onchange=e=>{me=+e.target.value;rendu()};
  $('wk-p').onclick=()=>changerSemaine(-7);$('wk-n').onclick=()=>changerSemaine(7);$('wk-t').onclick=()=>{wk=lundi(new Date());changerSemaine(0)};
  $('b-att').onclick=reglesATT;$('b-pdf').onclick=telechargerPdf;$('b-mail').onclick=envoyerPdf;
  if(navigator.onLine)setTimeout(()=>chargerPdfLib().catch(()=>{}),2500);   // prêt avant le clic : le partage exige un geste récent
  if($('b-cg'))$('b-cg').onclick=()=>formConges();
  if($('b-rdv')){$('b-rdv').onclick=()=>formRdv({jour:iso(wk),ags:MOI?[MOI]:[]});$('b-lib').onclick=()=>formLibre({});}
  if($('fp')){$('fp').value=fP;$('fp').onchange=e=>{fP=e.target.value;renderListe()};$('q').oninput=e=>{fQ=e.target.value;renderListe()};}
  rendu();
}
async function changerSemaine(n){
  wk=addDays(wk,n);
  try{await chargerSemaine();hors=false;sauverCache();}catch(e){hors=true;}
  rendu();
}
function rendu(){
  if(!$('vgrid'))return;
  $('vG').classList.toggle('on',vue==='G');$('vM').classList.toggle('on',vue==='M');
  $('vgrid').style.display=vue==='G'?'':'none';$('vme').style.display=vue==='M'?'block':'none';
  $('who-me').style.display=vue==='M'?'':'none';
  const ds=[0,1,2,3,4].map(dayOf);
  $('wl').textContent='Sem. '+semNum(wk)+' · '+ds[0].getDate()+' – '+ds[4].getDate()+' '+ds[4].toLocaleDateString('fr-FR',{month:'short'});
  bandeaux();$('astr').innerHTML=astreinteHTML();renderListe();renderGrille();renderMe();
}
function bandeaux(){
  const att=lireFile().length;let h='';
  if(hors)h+='<div class="banner">Hors connexion : dernières données connues. Tu peux encore marquer tes missions « faites » ou « reportées » ; le reste demande le réseau.</div>';
  if(att)h+=`<div class="banner">${att} action${att>1?'s':''} en attente d'envoi (gardée${att>1?'s':''} sur ce téléphone).</div>`;
  if(MOI==null&&P()<3)h+='<div class="banner">Ton compte n\'est pas encore relié à un agent : tu vois le planning, mais tu ne peux pas marquer de missions. La gestion peut le faire dans Planning › Réglages.</div>';
  $('bandeaux').innerHTML=h;
}

/* ── Calculs : missions, absences, ATT, rendez-vous ── */
const couvre=(m,sl)=>m.creneau==='journee'||m.creneau===CRN[sl];
const mAt=(ag,day,sl)=>M.find(m=>m.agent_id===ag&&m.jour===day&&m.statut!=='reporte'&&couvre(m,sl));
const slotsRegle=r=>r.creneau==='journee'?[0,1]:[r.creneau==='matin'?0:1];
function attOn(r,day){const d=dt(day);return d.getDay()===r.jour_semaine&&(r.semaines==='toutes'||(semNum(d)%2===0)===(r.semaines==='paires'));}
/* Jours fériés légaux calculés (Pâques, Ascension, Pentecôte…) + ajouts de la table (ponts) */
function paques(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114;return new Date(y,Math.floor(n/31)-1,n%31+1,12);}
const FCACHE={};
function feriesAn(y){
  if(FCACHE[y])return FCACHE[y];
  const p=paques(y),o={},s=(d,l)=>o[iso(d)]=l,j=(m,d)=>new Date(y,m-1,d,12);
  s(j(1,1),'Jour de l\'an');s(addDays(p,1),'Lundi de Pâques');s(j(5,1),'Fête du travail');s(j(5,8),'8 mai 1945');s(addDays(p,39),'Ascension');s(addDays(p,50),'Lundi de Pentecôte');
  s(j(7,14),'Fête nationale');s(j(8,15),'Assomption');s(j(11,1),'Toussaint');s(j(11,11),'Armistice');s(j(12,25),'Noël');
  return FCACHE[y]=o;
}
function ferie(day){const x=FER[day];if(x)return x.travaille?null:x.libelle;return feriesAn(+day.slice(0,4))[day]||null;}
const attAt=(ag,day,sl)=>!ferie(day)&&ATTR.some(r=>r.actif&&r.agent_id===ag&&slotsRegle(r).includes(sl)&&attOn(r,day))&&!ATTEX.has(ag+'|'+day);   // ATT un jour férié : perdu
function aAt(ag,day,sl){const a=ABS.find(x=>x.agent_id===ag&&x.jour===day&&x.creneau===CRN[sl]);return a||(attAt(ag,day,sl)?{type:'ATT',auto:1}:undefined);}
/* Routines : « dernière semaine du mois » = dernière semaine complète (lundi → vendredi) dans le mois */
function derniereSemaine(day){const mo=lundi(dt(day));if(addDays(mo,4).getMonth()!==mo.getMonth())return false;return addDays(mo,11).getMonth()!==mo.getMonth();}
function rouOn(r,day){
  if(ferie(day))return false;
  if(rouBase(r,day))return true;
  // férié : la routine est décalée à un autre jour de la même semaine (ex. tournée du lundi → mercredi)
  if(r.si_ferie==='decaler'&&r.decale_jour===dt(day).getDay()&&r.actif&&!r.ex.has(day)){const mo=lundi(dt(day));return r.jours.some(j=>{const x=iso(addDays(mo,j-1));return ferie(x)&&rouBase(r,x);});}
  return false;
}
function rouBase(r,day){
  const d=dt(day);
  if(!r.actif||!r.jours.includes(d.getDay())||r.ex.has(day)||(r.debut&&day<r.debut)||(r.fin&&day>r.fin))return false;
  if(r.semaines!=='toutes'&&(semNum(d)%2===0)!==(r.semaines==='paires'))return false;
  if(r.mois==='derniere')return derniereSemaine(day);
  if(r.mois==='sauf_derniere')return !derniereSemaine(day);
  return true;
}
const rouAt=(ag,day,sl)=>ROU.find(r=>r.agents.includes(ag)&&slotsRegle(r).includes(sl)&&rouOn(r,day));
const JC=['','lun','mar','mer','jeu','ven'];
function decrire(r){
  return r.jours.slice().sort().map(j=>JC[j]).join(' + ')+' · '+({journee:'journée',matin:'matin',aprem:'après-midi'})[r.creneau]+
    ({toutes:'',paires:' · semaines paires',impaires:' · semaines impaires'})[r.semaines]+({tous:'',derniere:' · dernière semaine du mois',sauf_derniere:' · sauf la dernière semaine du mois'})[r.mois||'tous']+(r.si_ferie==='decaler'&&r.decale_jour?' · si férié : décalée au '+JC[r.decale_jour]:'');
}
function prochains(f,n=4){const o=[];let d=new Date();for(let k=0;k<200&&o.length<n;k++){const s=iso(d);if(d.getDay()%6&&f(s))o.push(d.getDate()+'/'+(d.getMonth()+1));d=addDays(d,1);}return o.join(' · ')||'—';}
const occupe=(ag,day,sl)=>!!ferie(day)||!!mAt(ag,day,sl)||!!aAt(ag,day,sl)||!!rouAt(ag,day,sl);
const slotRdv=e=>(+e.heure.slice(0,2)*60+ +e.heure.slice(3,5))<750?0:1;
function occurs(e,day){
  if(!e.recurrence)return e.jour===day;
  const d=dt(day),a=dt(e.jour);
  if(d<a||d.getDay()!==a.getDay()||e.ex.has(day)||(e.fin_serie&&day>e.fin_serie))return false;
  const n=diffJ(day,e.jour);
  if(e.recurrence==='w1')return true;
  if(e.recurrence==='w2')return n%14===0;
  if(e.recurrence==='w4')return n%28===0;
  if(e.recurrence==='m')return Math.ceil(d.getDate()/7)===Math.ceil(a.getDate()/7);
  return false;
}
const evOn=(day,ag,sl)=>RDV.filter(e=>e.agents.includes(ag)&&slotRdv(e)===sl&&occurs(e,day));
function info(m){const t=m.tache_id?TA[m.tache_id]:null;return {site:t?cap(t.site_nom||'(sans site)'):m.titre,trav:t?t.travaux:'',prio:t?t.priorite:2};}
function avec(m){const o=[...new Set(M.filter(x=>x.lot===m.lot&&x.jour===m.jour&&x.agent_id!==m.agent_id&&x.statut!=='reporte').map(x=>x.agent_id))];
  return o.length?`<i>+ ${o.map(i=>esc((INTM[i]||{}).nom||'?')).join(', ')}</i>`:'';}
const tuile=(m,compact)=>{const i=info(m);return `<div class="m p${i.prio}${m.statut==='fait'?' fait':''}" data-m="${m.id}" draggable="${P()>=2}"><b>${m.tache_id?`<span class="pp p${i.prio}">P${i.prio}</span>`:''}${esc(i.site)}${m.nb_jours>1?` · j${m.rang}/${m.nb_jours}`:''}</b><span class="mt">${esc(compact?i.trav.slice(0,50):i.trav)}</span>${avec(m)}${RAP[m.lot]?'<i class="cr">✎ compte rendu</i>':''}</div>`;};
/* Astreinte d'exploitation : du vendredi 16h30 au vendredi suivant 16h30 */
const vendrediAvant=d=>{const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+2)%7));return x;};   // vendredi ≤ d
const astLignes=(sem,role)=>AST.filter(a=>a.semaine===sem&&a.role===role);
const astSem=(sem,role)=>astLignes(sem,role).map(a=>a.intervenant_id).filter(Boolean);
const astNoms=(sem,role)=>astLignes(sem,role).map(a=>a.intervenant_id?(INTM[a.intervenant_id]||{}).nom||'?':a.nom).join(' / ')||'—';
function astreinteHTML(){
  const s1=iso(vendrediAvant(wk)),s2=iso(addDays(wk,4));
  if(!AST.some(a=>a.semaine===s1||a.semaine===s2))return P()>=3?'<div class="astr click" onclick="formAstreinte()">☎ Astreinte : rien de saisi pour cette semaine — <b>importer ou saisir</b></div>':'';
  const f=s=>`encadrant <b>${esc(astNoms(s,'encadrant'))}</b> · terrain <b>${esc(astNoms(s,'agent'))}</b>`;
  const d2=dt(s2);
  return `<div class="astr${P()>=3?' click':''}" ${P()>=3?'onclick="formAstreinte()"':''}>☎ <span>Astreinte jusqu'au ven. ${d2.getDate()}/${d2.getMonth()+1} 16h30 : ${f(s1)}</span><span class="sep">→</span><span>puis ${f(s2)}</span></div>`;
}
function telAgent(ag){
  const s1=iso(vendrediAvant(wk));
  if(astSem(s1,'agent').includes(ag))return '<span class="tel" title="Agent d\'astreinte (jusqu\'à vendredi 16h30)">☎</span>';
  if(astSem(s1,'encadrant').includes(ag))return '<span class="tel enc" title="Encadrant d\'astreinte (jusqu\'à vendredi 16h30)">☎ enc.</span>';
  return '';
}
function formAstreinte(){
  const ss=[iso(vendrediAvant(wk)),iso(addDays(wk,4))];
  const inp=(s,role)=>{const v=astNoms(s,role);return `<input class="inp" list="dl-ast" id="as-${s}-${role}" value="${v==='—'?'':esc(v)}">`;};
  ouvrir(`<h2>Astreinte</h2><p class="sub2">Du vendredi 16h30 au vendredi suivant 16h30. Pour un remplacement (arrêt, échange), change le nom. Un nom qui n'est pas un agent de l'appli est gardé tel quel, pour l'affichage.</p>
   <datalist id="dl-ast">${INT.filter(i=>i.type==='agent'&&i.actif).map(a=>`<option value="${esc(a.nom)}">`).join('')}</datalist><div class="frm">
   ${ss.map(s=>{const d=dt(s),e=addDays(d,7);return `<label class="l">Du ven. ${d.getDate()}/${d.getMonth()+1} au ven. ${e.getDate()}/${e.getMonth()+1}</label><div class="two-c"><div><small>Encadrant</small>${inp(s,'encadrant')}</div><div><small>Agent terrain</small>${inp(s,'agent')}</div></div>`;}).join('')}</div>
   <div class="acts"><button class="btn-l" onclick="fermer();location.hash='reglages'">Import / toute l'année</button><button class="btn-l" onclick="fermer()">Annuler</button><button class="btn-p" onclick="saveAstreinte(['${ss[0]}','${ss[1]}'])">Enregistrer</button></div>`);
}
const agentDeNom=n=>{const k=norm(n);return INT.find(i=>i.type==='agent'&&norm(i.nom)===k);};
function ligneAst(semaine,role,n){const a=agentDeNom(n);return a?{semaine,role,intervenant_id:a.id}:{semaine,role,nom:n};}
async function saveAstreinte(ss){
  for(const s of ss)for(const role of ['encadrant','agent']){
    const v=$('as-'+s+'-'+role).value.trim();
    if(v===(astNoms(s,role)==='—'?'':astNoms(s,role)))continue;
    let {error}=await db.from('planning_astreintes').delete().eq('semaine',s).eq('role',role);
    const rows=v.split(/\s*[\/,]\s*/).filter(Boolean).map(n=>ligneAst(s,role,n));
    if(!error&&rows.length)({error}=await db.from('planning_astreintes').insert(rows));
    if(error){alert(msgErr(error));return;}
  }
  fermer();await chargerAstreintes();rendu();toast('Astreinte enregistrée');
}
async function chargerAstreintes(){const {data,error}=await db.from('planning_astreintes').select('*').order('semaine');if(!error){AST=data;sauverCache();}}
const legende=()=>`<div class="legend"><span><span class="pp p1">P1</span>urgente</span><span><span class="pp p2">P2</span>normale</span><span><span class="pp p3">P3</span>peu urgente</span><span><i style="background:var(--ok)"></i>Fait</span><span><i style="background:#5B7A8C"></i>↻ Mission récurrente</span><span><i style="background:#7A4FB0"></i>Rendez-vous</span><span><i style="background:#ECE6DE;border:1px solid #B9AFA2"></i>Absence · ATT prévu en pointillé</span></div>`;
const chipRdv=e=>`<div class="ev" data-e="${e.id}"><b>${e.recurrence?'↻ ':''}${fh(e.heure)} · ${durTxt(e.duree_min)}</b> ${esc(e.titre)}</div>`;
const tuileRou=(r,ag,day,ab)=>{const o=r.agents.filter(i=>i!==ag&&INTM[i]);return `<div class="m rou${ab?' conflit':''}" data-r="${r.id}"><b>↻ ${esc(r.titre)}</b>${o.length?`<i>+ ${o.map(i=>esc(INTM[i].nom)).join(', ')}</i>`:''}${ab?`<i class="cf">⚠ ${esc(ab.type)} ce jour-là</i>`:''}</div>`;};
const chipAbs=(a,ag,day,sl)=>`<div class="abs${a.auto?' att':''}" data-a="${ag}|${day}|${sl}">${esc(a.type)}${a.auto?'<small>prévu</small>':''}</div>`;

/* ── À planifier ── */
function renderListe(){
  const box=$('list');if(!box)return;
  const q=fQ.toLowerCase();
  const tous=Object.values(TA).filter(t=>t.statut==='a_faire');
  $('cnt').textContent='('+tous.length+')';
  const l=tous.filter(t=>(!fP||String(t.priorite)===fP)&&(!q||((t.site_nom||'')+' '+t.travaux+' '+(t.famille||'')).toLowerCase().includes(q))).sort((a,b)=>a.priorite-b.priorite||a.id-b.id);
  box.innerHTML=l.map(t=>{
    const retard=t.echeance&&t.echeance<iso(new Date());
    return `<div class="t p${t.priorite}${sel===t.id?' choisi':''}" draggable="true" data-id="${t.id}"><b><span class="pp p${t.priorite}">P${t.priorite}</span>${esc(cap(t.site_nom||'(sans site)'))}</b><span class="tx">${esc(t.travaux)}</span>
      <div class="tg">${t.reportee_nb?`<span class="badge b-bad">reportée ${t.reportee_nb}×</span>`:''}${retard?'<span class="badge b-bad">échéance dépassée</span>':''}${t.duree_estimee?`<span class="badge b-mute">${{demi:'½ j',jour:'1 j',plus:'plusieurs j'}[t.duree_estimee]}</span>`:''}</div></div>`;}).join('')||'<div style="padding:12px;color:var(--mute)">Rien à planifier.</div>';
  box.querySelectorAll('.t').forEach(e=>{
    e.onclick=()=>{sel=sel===+e.dataset.id?null:+e.dataset.id;renderListe();renderGrille();};
    e.ondragstart=ev=>{ev.dataTransfer.setData('text','t:'+e.dataset.id);sel=+e.dataset.id;};

}

/* ── Grille équipe ── */
function renderGrille(){
  const tb=$('tb');if(!tb)return;
  const ds=[0,1,2,3,4].map(dayOf),auj=iso(new Date());
  let h='<tr><th></th>'+ds.map((d,i)=>{const f=ferie(iso(d));return `<th colspan="2" class="${iso(d)===auj?'today':''}${f?' fer':''}">${JOURS[i]}<small>${d.getDate()}/${d.getMonth()+1}${f?' · '+esc(f):''}</small></th>`;}).join('')+'</tr>';
  for(const [ri,a] of AGP.entries()){
    h+=`<tr><td class="ag">${esc(a.nom)}${telAgent(a.id)}</td>`;
    for(const d of ds){
      const day=iso(d),fe=ferie(day);
      if(fe){h+=`<td class="c fer" colspan="2" data-ag="${a.id}" data-day="${day}" data-sl="0">${ri===0?'<span>Férié</span>':''}</td>`;continue;}
      const cont=sl=>{const m=mAt(a.id,day,sl),ab=aAt(a.id,day,sl),ro=rouAt(a.id,day,sl),evs=evOn(day,a.id,sl);
        return {m,ab,ro,evs,key:(m?'m'+m.id:'')+(ro?'r'+ro.id:'')+(ab?'a'+ab.type+(ab.auto?'*':''):''),
          html:evs.map(chipRdv).join('')+(m?tuile(m,true):'')+(ro?tuileRou(ro,a.id,day,ab):'')+(ab?chipAbs(ab,a.id,day,sl):'')};};
      const c=[cont(0),cont(1)];
      const fus=c[0].key&&c[0].key===c[1].key&&!c[1].evs.length;
      for(const sl of fus?[0]:[0,1]){
        const x=c[sl],libre=!x.m&&!x.ab&&!x.ro;
        h+=`<td class="c ${sl===0&&!fus?'am':''}${sel&&libre&&peutPlanifier(a.id)?' target':''}" ${fus?'colspan="2"':''} data-ag="${a.id}" data-day="${day}" data-sl="${sl}">${x.html}</td>`;
      }
    }
    h+='</tr>';
  }
  tb.innerHTML=h;
  tb.querySelectorAll('.m[data-m]').forEach(el=>el.ondragstart=ev=>{ev.dataTransfer.setData('text','m:'+el.dataset.m);sel=null;});
  tb.querySelectorAll('td.c').forEach(td=>{
    const ag=+td.dataset.ag,day=td.dataset.day,sl=+td.dataset.sl;
    td.ondragover=e=>{e.preventDefault();td.classList.add('drop');};
    td.ondragleave=()=>td.classList.remove('drop');
    td.ondrop=e=>{e.preventDefault();td.classList.remove('drop');if(ferie(day))return toast('Jour férié : '+ferie(day));const d=e.dataTransfer.getData('text')||'';if(d.startsWith('m:'))dropMission(+d.slice(2),ag,day,sl);else if(d.startsWith('t:')){sel=+d.slice(2);poserOuAtt(ag,day,sl);}};
    td.onclick=e=>{
      if(ferie(day))return toast('Jour férié : '+ferie(day));
      const ee=e.target.closest('[data-e]');if(ee)return ficheRdv(+ee.dataset.e,day);
      const mm=e.target.closest('[data-m]');if(mm)return ficheMission(+mm.dataset.m);
      const rr=e.target.closest('[data-r]');if(rr&&!sel)return ficheRou(+rr.dataset.r,ag,day);
      if(rr&&sel)return poserOuAtt(ag,day,sl);
      const ab=e.target.closest('[data-a]');
      if(ab&&sel&&(aAt(ag,day,sl)||{}).auto)return poserOuAtt(ag,day,sl);
      if(ab)return ficheAbs(ag,day,sl);
      if(sel)return poserOuAtt(ag,day,sl);
      menuCase(ag,day,sl);
    };
  });
}

/* ── Ma semaine ── */
function renderMe(){
  const box=$('vme');if(!box||vue!=='M')return;
  const a=INTM[me];if(!a){box.innerHTML='<div class="card loading">Aucun agent.</div>';return;}
  const ds=[0,1,2,3,4].map(dayOf),auj=iso(new Date());
  const mine=M.filter(m=>m.agent_id===me&&m.statut!=='reporte'&&ds.some(d=>iso(d)===m.jour));
  const faits=mine.filter(m=>m.statut==='fait').length;
  let h=`<div class="sum"><div><b>${mine.length-faits}</b><small>à faire</small></div><div><b>${faits}</b><small>faites</small></div><div><b>${Object.values(TA).filter(t=>t.statut==='a_faire'&&t.priorite===1).length}</b><small>prio 1 à planifier (équipe)</small></div></div>`;
  ds.forEach((d,i)=>{
    const day=iso(d);
    const fe=ferie(day);
    h+=`<div class="day ${day===auj?'today':''}" data-day="${day}"><h3>${JOURS[i]} ${d.getDate()}${day===auj?' · aujourd\'hui':''}${fe?' · férié ('+esc(fe)+')':''}</h3>`;
    if(fe){h+='<div class="slot"><em></em><div class="sc"><div class="empty">Jour férié</div></div></div></div>';return;}
    [0,1].forEach(sl=>{
      const m=mAt(me,day,sl),ab=aAt(me,day,sl),ro=rouAt(me,day,sl),evs=evOn(day,me,sl).map(chipRdv).join('');
      let c;
      if(m){c=(m.creneau==='journee'&&sl===1)?'<div class="empty">↑ suite de la journée</div>':tuile(m,false);}
      else if(ro)c=(ro.creneau==='journee'&&sl===1&&!ab)?'<div class="empty">↑ suite de la journée</div>':tuileRou(ro,me,day,ab)+(ab?chipAbs(ab,me,day,sl):'');
      else if(ab)c=chipAbs(ab,me,day,sl);
      else c='<div class="empty">Libre</div>';
      h+=`<div class="slot"><em>${sl?'APRÈM':'MATIN'}</em><div class="sc">${evs}${c}</div></div>`;
    });
    h+='</div>';
  });
  const s1=iso(vendrediAvant(wk)),s2=iso(addDays(wk,4)),moiAst=[s1,s2].filter(s=>astSem(s,'agent').includes(me)||astSem(s,'encadrant').includes(me));
  const astTxt=moiAst.map(s=>{const d=dt(s),e=addDays(d,7);return `☎ ${astSem(s,'encadrant').includes(me)?'Encadrant':'Agent'} d'astreinte du ven. ${d.getDate()}/${d.getMonth()+1} 16h30 au ven. ${e.getDate()}/${e.getMonth()+1} 16h30`;}).join('<br>');
  box.innerHTML=`<h2 style="margin-bottom:12px">Ma semaine — ${esc(a.nom)}</h2>`+(astTxt?`<div class="astr">${astTxt}</div>`:'')+h;
  box.querySelectorAll('[data-m]').forEach(e=>e.onclick=()=>ficheMission(+e.dataset.m));
  box.querySelectorAll('[data-r]').forEach(e=>e.onclick=()=>ficheRou(+e.dataset.r,me,e.closest('.day').dataset.day));
  box.querySelectorAll('[data-e]').forEach(e=>e.onclick=()=>ficheRdv(+e.dataset.e,e.closest('.day').dataset.day));
  box.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>{const [ag,day,sl]=e.dataset.a.split('|');ficheAbs(+ag,day,+sl);});
}

/* ═══ Fenêtres ═══ */
const ouvrir=html=>{dlg.innerHTML=html;if(!dlg.open)dlg.showModal();};
const fermer=()=>{if(dlg.open)dlg.close();};
const annuler='<button onclick="fermer()">Annuler</button>';

/* ── Poser une tâche ── */
function poserOuAtt(ag,day,sl){
  const ro=rouAt(ag,day,sl);
  if(ro&&peutPlanifier(ag)&&sel)return ouvrir(`<h2>${esc(ro.titre)}</h2><p class="sub2">Prévue ce jour-là pour ${esc(ro.agents.map(i=>(INTM[i]||{}).nom).filter(Boolean).join(', '))}. Annuler cette occurrence pour poser la tâche ? Les autres jours ne bougent pas.</p><div class="opts"><button class="acc" onclick="rouEtPoser(${ro.id},${ag},'${day}',${sl})">Annuler cette occurrence et poser la tâche</button>${annuler}</div>`);
  const x=aAt(ag,day,sl);
  if(x&&x.auto&&peutPlanifier(ag))return ouvrir(`<h2>ATT prévu ce jour</h2><p class="sub2">${esc(INTM[ag].nom)} a un ATT prévu. Le supprimer pour poser la tâche ?</p><div class="opts"><button class="acc" onclick="attEtPoser(${ag},'${day}',${sl})">Supprimer l'ATT et poser la tâche</button>${annuler}</div>`);
  poser(ag,day,sl);
}
async function rouEtPoser(id,ag,day,sl){
  if(!await exceptionRou(id,day))return;
  fermer();rendu();poserOuAtt(ag,day,sl);
}
async function exceptionRou(id,day){
  const {error}=await db.from('planning_routine_exceptions').upsert({routine_id:id,jour:day},{onConflict:'routine_id,jour',ignoreDuplicates:true});
  if(error){alert(msgErr(error));return false;}
  ROU.find(r=>r.id===id).ex.add(day);sauverCache();return true;
}
function ficheRou(id,ag,day){
  const r=ROU.find(x=>x.id===id);if(!r)return;
  const peut=P()>=3||(P()>=2&&r.agents.includes(MOI));
  ouvrir(`<h2>↻ ${esc(r.titre)}</h2><p class="sub2">${dfr(day)}<br><b>${esc(r.agents.map(i=>(INTM[i]||{}).nom).filter(Boolean).join(', '))}</b><br>Routine : ${decrire(r)}<br>Prochaines : ${prochains(s=>rouOn(r,s))}</p><div class="opts">
   ${peut?`<button onclick="annulerOccurrence(${id},'${day}')">Cette occurrence n'a pas lieu (${dt(day).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric'})})</button>`:''}
   ${P()>=3?`<button onclick="fermer();location.hash='reglages'">Modifier la routine (Réglages)</button>`:''}
   <button onclick="fermer()">Fermer</button></div>`);
}
async function annulerOccurrence(id,day){if(await exceptionRou(id,day)){fermer();rendu();toast('Occurrence annulée — la routine continue');}}
async function attEtPoser(ag,day,sl){
  const {error}=await db.from('planning_att_exceptions').upsert({agent_id:ag,jour:day},{onConflict:'agent_id,jour',ignoreDuplicates:true});
  if(error){alert(msgErr(error));return;}
  ATTEX.add(ag+'|'+day);poser(ag,day,sl);
}
function poser(ag,day,sl){
  const id=sel;if(!id)return;const t=TA[id];if(!t)return;
  if(!peutPlanifier(ag)){toast(P()>=2?'Tu ne peux planifier que pour toi':'Planification réservée à la gestion');return;}
  if(occupe(ag,day,sl)){toast('Case déjà occupée');return;}
  const aprLibre=sl===0&&!occupe(ag,day,1);
  const raison=sl===1?'une journée ne peut pas commencer l\'après-midi':'l\'après-midi est déjà occupé';
  const prevus=(EQ[id]||[]).filter(i=>i!==ag);
  const binome=P()>=3?`<div class="lab" style="margin-top:6px">Avec (binôme, facultatif)</div><div class="chk eq" style="margin:4px 0 12px">${AGP.filter(x=>x.id!==ag).map(x=>{const oc=occupe(x.id,day,sl);return `<label class="${oc?'dis':''}"><input type="checkbox" value="${x.id}" ${oc?'disabled':''} ${!oc&&prevus.includes(x.id)?'checked':''}>${esc(x.nom)}${oc?' (occupé)':''}</label>`;}).join('')}</div>`:'';
  ouvrir(`<h2>${esc(cap(t.site_nom||'(sans site)'))}</h2><p class="sub2">${esc(t.travaux)}<br><b>${esc(INTM[ag].nom)}</b> · ${dfr(day)} · ${sl?'après-midi':'matin'}</p>${binome}
   <div class="opts"><button class="acc" onclick="valider(${ag},'${day}',${sl},1,1)">Demi-journée</button>
   ${aprLibre?`<button onclick="valider(${ag},'${day}',${sl},2,1)">Journée entière</button><div class="row">${[2,3,4,5].map(n=>`<button onclick="valider(${ag},'${day}',${sl},2,${n})">${n} jours</button>`).join('')}</div>`
     :`<button class="dis" disabled>Journée entière<small>${raison}</small></button><button class="dis" disabled>Plusieurs jours<small>${raison}</small></button>`}${annuler}</div>`);
}
async function valider(ag,day,sl,n,jours){
  const t=TA[sel];if(!t)return;
  const team=[ag,...[...dlg.querySelectorAll('.eq input:checked')].map(x=>+x.value)];
  const ds=[];let d=dt(day);
  while(ds.length<jours){if(d.getDay()!==0&&d.getDay()!==6)ds.push(iso(d));d=addDays(d,1);}
  for(const a of team)for(const x of ds){
    const need=n===2?[0,1]:[sl];
    if(need.some(s=>occupe(a,x,s))){alert(INTM[a].nom+' est occupé le '+dfr(x)+'.');return;}
  }
  const lot=cle(),rows=[];
  for(const a of team)ds.forEach((x,i)=>rows.push({lot,tache_id:t.id,agent_id:a,jour:x,creneau:n===2?'journee':CRN[sl],rang:i+1,nb_jours:jours,cle_client:cle()}));
  const {error}=await db.from('planning_missions').upsert(rows,{onConflict:'cle_client',ignoreDuplicates:true});
  if(error){alert(msgErr(error));return;}
  sel=null;fermer();await rafraichir();toast('Planifié'+(team.length>1?' pour '+team.length+' agents':'')+' — la tâche a quitté « À planifier »');
}

/* ── Fiche d'une mission ── */
function ficheMission(id){
  const m=M.find(x=>x.id===id);if(!m)return;
  const i=info(m),t=m.tache_id?TA[m.tache_id]:null;
  const lot=M.filter(x=>x.lot===m.lot&&x.statut!=='reporte');
  const noms=[...new Set(lot.map(x=>(INTM[x.agent_id]||{}).nom))].filter(Boolean);
  const solo=noms.length<2,marque=peutMarquer(m.lot),moi=P()>=3||(P()>=2&&m.agent_id===MOI);
  const jours=[...new Set(lot.map(x=>x.jour))].sort();

function compresser(file){return new Promise((ok,ko)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const M=1600,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):ko(new Error('compression')),'image/jpeg',0.75);};
  im.onerror=()=>ko(new Error('image illisible'));im.src=u;});}
async function photosCR(inp){
  const fs=[...inp.files].slice(0,3-CR_PH.length);inp.value='';
  for(const f of fs){try{CR_PH.push(await compresser(f));}catch(e){toast(f.name+' : '+e.message);}}
  $('cr-p').innerHTML=CR_PH.map(b=>`<img src="${URL.createObjectURL(b)}" alt="">`).join('');
}
const blobVersData=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b);});
const dataVersBlob=async d=>(await fetch(d)).blob();
async function validerFait(lot,seul){
  const cr={note:$('cr-n').value.trim(),photos:CR_PH.slice(),cle:cle()};
  if(!cr.note&&!cr.photos.length){if(seul){fermer();return;}return statutLot(lot,'fait');}
  $('cr-ok').disabled=true;
  if(seul){const r=await envoyerRapport(lot,cr);if(r==='attente')await garderRapport(lot,null,cr);fermer();await rafraichir();toast(r==='attente'?'Compte rendu gardé sur le téléphone':'Compte rendu enregistré');return;}
  return statutLot(lot,'fait',cr);
}
async function envoyerRapport(lot,cr){
  const m=M.find(x=>x.lot===lot)||{},chemins=[];
  try{
    for(const [i,b] of cr.photos.entries()){
      const blob=typeof b==='string'?await dataVersBlob(b):b,ch=`planning/${lot}/${cr.cle}_${i}.jpg`;
      const up=await db.storage.from('photos').upload(ch,blob,{contentType:'image/jpeg',upsert:true});if(up.error)throw up.error;chemins.push(ch);
    }
    const {error}=await db.from('planning_rapports').upsert({lot,tache_id:m.tache_id||null,agent_id:MOI||m.agent_id||null,note:cr.note||null,photos:chemins,cle_client:cr.cle},{onConflict:'cle_client',ignoreDuplicates:true});
    if(error)throw error;
    return 'ok';
  }catch(e){if(horsReseau(e))return 'attente';alert('Compte rendu non enregistré : '+msgErr(e));return 'refus';}
}
async function garderRapport(lot,statut,cr){
  const x={lot,statut,cr:{note:cr.note,cle:cr.cle,photos:await Promise.all(cr.photos.map(b=>typeof b==='string'?b:blobVersData(b)))}};
  const a=lireFile().filter(y=>!(y.lot===lot&&y.statut===statut));a.push(x);
  try{localStorage.setItem(cleFile(),JSON.stringify(a));}catch(e){x.cr.photos=[];ecrireFile(a);alert('Plus assez de place sur le téléphone pour garder les photos hors connexion : la note est gardée, les photos non.');}

async function statutLot(lot,s,cr){
  fermer();
  // effet immédiat à l'écran (le serveur confirme ensuite ; hors connexion, l'action attend)
  for(const x of M.filter(r=>r.lot===lot)){if(s==='fait'&&x.statut==='prevu'){x.statut='fait';x.fait_le=new Date().toISOString();}else if(s==='prevu'&&x.statut==='fait'){x.statut='prevu';x.fait_le=null;}else if(s==='reporte'&&x.statut==='prevu')x.statut='reporte';}
  M=M.filter(x=>x.statut!=='reporte');rendu();
  const {error}=await db.rpc('planning_statut',{p_lot:lot,p_statut:s});
  if(error){
    if(horsReseau(error)){
      if(cr)await garderRapport(lot,s,cr);else ecrireFile([...lireFile().filter(a=>a.lot!==lot||a.cr),{lot,statut:s}]);
      sauverCache();bandeaux();toast('Gardé sur le téléphone, envoi dès que le réseau revient');return;}
    alert(msgErr(error));await rafraichir();return;
  }
  if(cr&&(await envoyerRapport(lot,cr))==='attente')await garderRapport(lot,null,cr);
  await rafraichir();
  toast(s==='fait'?'Mission terminée — la tâche est marquée faite':s==='reporte'?'Reportée — la tâche est de retour dans « À planifier »':'Remise à faire');
}

   <label class="l">Participants</label><div class="chk" id="r-a">${INT.filter(i=>i.type==='agent'&&i.actif).map(a=>`<label><input type="checkbox" value="${a.id}" ${v.agents.includes(a.id)?'checked':''}>${esc(a.nom)}</label>`).join('')}</div></div>

async function saveRdv(id){
  const ags=[...dlg.querySelectorAll('#r-a input:checked')].map(x=>+x.value),titre=$('r-t').value.trim();
  if(!titre||!ags.length||!$('r-j').value){alert('Intitulé, jour et au moins un participant sont nécessaires.');return;}
  const row={titre,jour:$('r-j').value,heure:$('r-h').value||'09:00',duree_min:+$('r-u').value,recurrence:$('r-r').value||null,fin_serie:$('r-f').value||null};
  $('r-ok').disabled=true;let rid=id,error;
  if(id){({error}=await db.from('planning_rdv').update(row).eq('id',id));}
  else{const c=cle();let d;({data:d,error}=await db.from('planning_rdv').upsert({...row,cle_client:c},{onConflict:'cle_client',ignoreDuplicates:true}).select('id'));rid=d&&d[0]&&d[0].id;}
  if(!error&&rid){
    if(id)({error}=await db.from('planning_rdv_agents').delete().eq('rdv_id',id));
    if(!error)({error}=await db.from('planning_rdv_agents').insert(ags.map(a=>({rdv_id:rid,agent_id:a}))));
  }
  if(error){$('r-ok').disabled=false;alert(msgErr(error));return;}
  fermer();await chargerBaseRdv();rendu();toast(id?'Rendez-vous modifié':'Rendez-vous ajouté');
}
async function chargerBaseRdv(){
  try{
    const [r,a,x]=await Promise.all([db.from('planning_rdv').select('*').order('id'),db.from('planning_rdv_agents').select('rdv_id,agent_id'),db.from('planning_rdv_exceptions').select('rdv_id,jour')]);
    for(const q of [r,a,x])if(q.error)throw q.error;
    const ag={},ex={};for(const z of a.data)(ag[z.rdv_id]??=[]).push(z.agent_id);for(const z of x.data)(ex[z.rdv_id]??=[]).push(z.jour);
    RDV=r.data.map(z=>({...z,heure:(z.heure||'09:00').slice(0,5),agents:ag[z.id]||[],ex:new Set(ex[z.id]||[])}));sauverCache();
  }catch(e){toast(msgErr(e));}
}
let evJour=null;
function ficheRdv(id,day){
  const e=RDV.find(x=>x.id===id);if(!e)return;evJour=day||e.jour;
  const edit=peutRdv(e);
  ouvrir(`<h2>${esc(e.titre)}</h2><p class="sub2">${dfr(evJour)} · ${fh(e.heure)} · ${durTxt(e.duree_min)}<br>${e.agents.map(i=>esc((INTM[i]||{}).nom||'?')).join(', ')}${e.recurrence?`<br><b>↻ ${RECTXT[e.recurrence]}</b>${e.fin_serie?' jusqu\'au '+dfr(e.fin_serie):''}`:''}</p><div class="opts">

async function exRdv(id){
  const {error}=await db.from('planning_rdv_exceptions').upsert({rdv_id:id,jour:evJour},{onConflict:'rdv_id,jour',ignoreDuplicates:true});
  if(error){alert(msgErr(error));return;}
  fermer();await chargerBaseRdv();rendu();toast('Occurrence supprimée — la série continue');

async function supprRdv(id){
  if(!confirm('Supprimer ce rendez-vous ?'))return;
  const {error}=await db.from('planning_rdv').delete().eq('id',id);
  if(error){alert(msgErr(error));return;}
  fermer();await chargerBaseRdv();rendu();

/* ── File d'attente hors connexion : « fait » / « reporter » posés sur le terrain sans réseau ── */
const cleFile=()=>'plan-attente-'+user.id;
function lireFile(){try{return JSON.parse(localStorage.getItem(cleFile()))||[];}catch(e){return[];}}
function ecrireFile(a){try{localStorage.setItem(cleFile(),JSON.stringify(a));}catch(e){}}
async function envoyerEnAttente(){
  const a=lireFile();if(!a.length||!navigator.onLine)return;
  const reste=[];let n=0;
  for(const x of a){
    if(x.statut){const {error}=await db.rpc('planning_statut',{p_lot:x.lot,p_statut:x.statut});
      if(error){if(horsReseau(error))reste.push(x);continue;}}   // coupure : on réessaiera ; refus : abandonnée
    if(x.cr){const r=await envoyerRapport(x.lot,x.cr);if(r==='attente'){reste.push({...x,statut:null});continue;}}
    n++;
    // refus définitif (mission retirée entre-temps, droits) : abandonnée
  }
  ecrireFile(reste);
  if(n){toast(n+' action'+(n>1?'s':'')+' en attente envoyée'+(n>1?'s':''));try{await chargerTaches();await chargerSemaine();sauverCache();}catch(e){}if($('vgrid'))rendu();}
}
window.addEventListener('online',()=>envoyerEnAttente());

/* ── Export PDF et mail ── */
function titrePage(){return (vue==='G'?'Planning équipe':'Ma semaine — '+(INTM[me]||{}).nom)+' — '+$('wl').textContent;}
/* ── PDF (fabriqué dans le navigateur : rien ne sort de l'appli) et envoi par mail ── */
const JSPDF_URL='https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',H2C_URL='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
function script(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('bibliothèque PDF non chargée (réseau ?)'));document.head.appendChild(s);});}
let pdfLib=null;
function chargerPdfLib(){return pdfLib??=(async()=>{if(!window.jspdf)await script(JSPDF_URL);if(!window.html2canvas)await script(H2C_URL);})().catch(e=>{pdfLib=null;throw e;});}
/* Le PDF reprend exactement l'affichage de l'écran (couleurs, tuiles), photographié en haute définition puis centré sur la page */
async function capturer(){
  const g=vue==='G',box=document.createElement('div');
  box.className='pdfcap'+(g?'':' me');
  box.style.width=(g?1250:760)+'px';
  box.innerHTML=`<div class="pdft">${esc(titrePage())}</div>`+astreinteHTML().replace(/ click|onclick="formAstreinte\(\)"/g,'')+(g?`<div class="box"><table class="pg">${$('tb').innerHTML}</table></div>`:$('vme').innerHTML)+legende();
  document.body.appendChild(box);
  try{await (document.fonts?document.fonts.ready:null);return await html2canvas(box,{scale:2,backgroundColor:'#ffffff',logging:false});}
  finally{box.remove();}
}
async function fairePdf(){
  await chargerPdfLib();
  const cv=await capturer(),{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:vue==='G'?'landscape':'portrait',unit:'mm',format:'a4'});
  const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),mg=10,pied=6;
  const r=Math.min((W-2*mg)/cv.width,(H-2*mg-pied)/cv.height),w=cv.width*r,hh=cv.height*r;
  doc.addImage(cv.toDataURL('image/jpeg',0.95),'JPEG',(W-w)/2,(H-pied-hh)/2,w,hh);
  doc.setFontSize(7);doc.setTextColor(122,112,104);
  doc.text('AquaPilot — édité le '+new Date().toLocaleDateString('fr-FR')+' à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),W/2,H-5,{align:'center'});
  return doc;
}
const nomPdf=()=>('Planning-S'+semNum(wk)+(vue==='M'?'-'+((INTM[me]||{}).nom||''):'')+'.pdf').replace(/\s+/g,'-');
async function telechargerPdf(){
  try{(await fairePdf()).save(nomPdf());}catch(e){alert('Impossible de préparer le PDF : '+e.message);}
}
async function envoyerPdf(){
  let doc;try{doc=await fairePdf();}catch(e){alert('Impossible de préparer le PDF : '+e.message);return;}
  const nom=nomPdf(),file=new File([doc.output('blob')],nom,{type:'application/pdf'});
  // Téléphone (et Windows avec Chrome / Edge) : la feuille de partage propose la messagerie avec le PDF déjà joint
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:titrePage()});return;}catch(e){if(e.name==='AbortError')return;}
  }
  // Sinon : PDF téléchargé + mail préparé, il reste à joindre le fichier
  doc.save(nom);
  location.href='mailto:?subject='+encodeURIComponent(titrePage())+'&body='+encodeURIComponent('Bonjour,\n\nVoici le planning en pièce jointe ('+nom+').\n\n');
  toast('PDF téléchargé : joins-le au mail qui vient de s\'ouvrir');
}
