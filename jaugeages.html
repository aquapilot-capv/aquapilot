<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#F4F1EC; --card:#FFFFFF; --line:#E7E1D8; --ink:#26221E; --mute:#7A7068;
  --acc:#B84712; --acc-2:#C2410C; --acc-soft:#FBE9DC; --acc-soft2:#F3D0B5;
  --ok:#2F7D4F; --ok-soft:#E3F1E8; --warn:#B7791F; --warn-soft:#FCF1DC; --bad:#B42318; --bad-soft:#FDE7E4;
  --font:'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0)}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;min-height:100%}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ── Charpente ── */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center}
.brand b{font-size:1rem;display:block}.brand small{font-size:.7rem;color:var(--mute);letter-spacing:.02em}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;font-size:.93rem}
.nav a:hover{background:#F7F3EE}
.nav a.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.nav svg{width:28px;height:28px;margin:-4px;flex:none}
.ic{fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.side .who{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;font-size:.82rem;color:var(--mute)}
.side .who button{background:none;border:none;color:var(--acc);font-weight:600;padding:0;margin-top:4px}
main{padding:28px 32px 60px;min-width:0}
.crumb{font-size:.82rem;color:var(--mute);margin-bottom:6px}
.crumb a{color:var(--mute);text-decoration:none}
h1{font-size:1.75rem;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:.9rem;margin-top:4px}
.head{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.head-l{display:flex;gap:14px;align-items:center}
.hico{width:56px;height:56px;border-radius:14px;flex:none}
.bnav{display:none}

/* ── Cartes ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:.85rem;font-weight:500;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.unit-sw{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.unit-sw button{border:none;background:none;padding:8px 12px;font-size:.83rem;font-weight:600;color:var(--mute)}
.unit-sw button.on{background:var(--acc);color:#fff}

/* Tableau bureau */
table{width:100%;border-collapse:collapse}
th{font-size:.75rem;font-weight:600;color:var(--mute);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);background:#FBF9F6}
th:first-child{border-top-left-radius:14px}th:last-child{border-top-right-radius:14px}
td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}tbody tr:hover{background:#FBF8F4}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.site-n{font-weight:600}.site-c{font-size:.8rem;color:var(--mute)}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}.b-mute{background:#EFEBE5;color:var(--mute)}
.list-m{display:none}

/* Détail */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi .l{font-size:.78rem;color:var(--mute);font-weight:500}
.kpi .v{font-size:1.6rem;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.8rem;color:var(--mute);margin-top:2px}
.chart-card{padding:18px 18px 10px;margin-bottom:16px}
.chart-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chart-top h2{font-size:1rem}
.pan{display:inline-flex;gap:6px;align-items:center}
.pan button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:32px}
.pan span{font-size:.85rem;font-weight:600;min-width:110px;text-align:center;font-variant-numeric:tabular-nums}
.chart-box{position:relative;height:340px}
.legend-note{font-size:.78rem;color:var(--mute);padding:6px 2px 4px}
.pts td:first-child{font-weight:500}
.back{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.88rem;margin-bottom:14px}
.note{font-size:.8rem;color:var(--mute);margin-top:12px}
.loading{padding:60px;text-align:center;color:var(--mute)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}

/* Connexion */
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.login.off{display:none}
.login .card{width:100%;max-width:360px;padding:28px}
.login h2{margin-bottom:4px}.login p{color:var(--mute);font-size:.88rem;margin-bottom:16px}
.login label{display:block;font-size:.8rem;font-weight:600;margin:10px 0 4px}
.login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:600;width:100%;margin-top:16px}
.err{color:var(--bad);font-size:.85rem;margin-top:10px;min-height:1.2em}

/* ── Mobile ── */
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  main{padding:calc(16px + env(safe-area-inset-top,0)) 16px calc(90px + env(safe-area-inset-bottom,0))}
  h1{font-size:1.4rem}.hico{width:46px;height:46px}
  .table-d{display:none}
  .list-m{display:flex;flex-direction:column;gap:10px}
  .mcard{padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;cursor:pointer}
  .mcard .big{font-size:1.25rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .mcard .meta{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--mute)}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:12px 14px}.kpi .v{font-size:1.25rem}
  .chart-box{height:260px}
  .pts-wrap{overflow-x:auto}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0));z-index:20}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--mute);text-decoration:none;font-weight:500}
  .bnav a.on{color:var(--acc)}
  .bnav svg{width:32px;height:32px;margin:-4px}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>

  const e=em.value.trim(),p=pw.value; er.textContent='';
  bl.disabled=true; const {error}=await db.auth.signInWithPassword({email:e,password:p}); bl.disabled=false;
  if(error){er.textContent='Email ou mot de passe incorrect.';return;} start();
}
async function logout(){await db.auth.signOut();location.reload();}
pw.addEventListener('keydown',e=>{if(e.key==='Enter')login()});

/* ── Chargement (pagination par 1000) ── */
async function toutes(q){
  let out=[],from=0;
  while(true){const {data,error}=await q().range(from,from+999); if(error)throw error; out=out.concat(data); if(data.length<1000)break; from+=1000;}
  return out;
}
async function charger(){
  try{
    const [sites,points]=await Promise.all([
      toutes(()=>db.from('sites').select('*').order('commune')),
      toutes(()=>db.from('points').select('*').eq('famille','jaugeage').order('ordre'))]);
    const ids=points.map(p=>p.id);
    const mes=await toutes(()=>db.from('mesures').select('point_id,date_mesure,valeur,statut').in('point_id',ids).order('date_mesure'));
    construire(sites,points,mes);
  }catch(e){view.innerHTML=`<div class="card loading">Impossible de charger les données : ${e.message}<br><br><button class="chip" onclick="location.reload()">Réessayer</button></div>`;}
}

/* ── Calculs : un total mensuel par site ──
   - plusieurs mesures d'un point dans un mois → moyenne
   - « sec » = 0 ; « plafond » = valeur minimale connue (total « > ») ; autres statuts = pas de valeur
   - total partiel si un point mesuré cette année-là manque ce mois-ci
   - les stats n'utilisent que les totaux complets et non plafonnés            */
function construire(sites,points,mes){
  const P=Object.fromEntries(points.map(p=>[p.id,p]));
  const bySite={};
  for(const p of points){(bySite[p.site_id]??=[]).push(p);}
  const acc={}; // site|ym|point -> {sum,n,plaf}
  for(const m of mes){
    const p=P[m.point_id]; if(!p)continue;
    let v=null,plaf=false;
    if(m.statut==='mesure')v=m.valeur; else if(m.statut==='sec')v=0; else if(m.statut==='plafond'){v=m.valeur;plaf=true;}
    if(v===null||v===undefined)continue;
    const ym=m.date_mesure.slice(0,7), k=p.site_id+'|'+ym+'|'+p.id;
    const a=acc[k]??={sum:0,n:0,plaf:false}; a.sum+=Number(v); a.n++; a.plaf=a.plaf||plaf;
  }
  const S=[];
  for(const s of sites){
    const pts=(bySite[s.id]||[]).filter(p=>p.dans_total);
    if(!pts.length)continue;
    const months={};
    for(const k in acc){const [sid,ym,pid]=k.split('|'); if(+sid!==s.id)continue;
      const a=acc[k]; const mo=months[ym]??={pts:{},plaf:false};
      if(P[pid].dans_total){mo.pts[pid]=a.sum/a.n; mo.plaf=mo.plaf||a.plaf;}}
    // points attendus par année
    const yearPts={};
    for(const ym in months){(yearPts[ym.slice(0,4)]??=new Set());Object.keys(months[ym].pts).forEach(x=>yearPts[ym.slice(0,4)].add(x));}
    const serie=Object.keys(months).sort().map(ym=>{
      const mo=months[ym], vals=Object.values(mo.pts);
      return {ym,t:Date.UTC(+ym.slice(0,4),+ym.slice(5,7)-1,15),total:vals.reduce((a,b)=>a+b,0),
        partiel:vals.length<yearPts[ym.slice(0,4)].size,plaf:mo.plaf,pts:mo.pts};});
    if(!serie.length)continue;
    const ok=serie.filter(x=>!x.partiel&&!x.plaf);
    const parMois=Array.from({length:12},(_,i)=>ok.filter(x=>+x.ym.slice(5,7)===i+1).map(x=>x.total));
    const minE=ok.length?ok.reduce((a,b)=>b.total<a.total?b:a):null;
    const maxE=ok.length?ok.reduce((a,b)=>b.total>a.total?b:a):null;
    const last=serie[serie.length-1];
    const lm=+last.ym.slice(5,7)-1;
    const autres=ok.filter(x=>+x.ym.slice(5,7)===lm+1&&x.ym!==last.ym).map(x=>x.total);
    const normal=autres.length>=3?autres.reduce((a,b)=>a+b,0)/autres.length:null;
    const ecart=(normal&&!last.plaf&&!last.partiel)?(last.total-normal)/normal*100:null;
    S.push({...s,points:(bySite[s.id]||[]),serie,ok,parMois,minE,maxE,last,normal,ecart,
      depuis:serie[0].ym.slice(0,4)});
  }
  SITES=S;
}

/* ── Formatage ── */
const fmt=(lmin,u=unit)=>{if(lmin===null||lmin===undefined||isNaN(lmin))return '–';const U=UNITS[u];
  return (lmin*U.f).toLocaleString('fr-FR',{minimumFractionDigits:U.d,maximumFractionDigits:U.d});};
const mois=ym=>MOIS[+ym.slice(5,7)-1]+' '+ym.slice(0,4);
function badge(s){
  if(s.last.plaf)return '<span class="badge b-mute">Hautes eaux (plafond)</span>';
  if(s.last.partiel)return '<span class="badge b-mute">Relevé partiel</span>';
  if(s.ecart===null)return '<span class="badge b-mute">Pas assez d\'historique</span>';
  const e=Math.round(s.ecart), t=(e>0?'+':'')+e+' %';
  if(s.minE&&s.last.total<=s.minE.total)return `<span class="badge b-bad">Plus bas historique</span>`;
  if(e<=-30)return `<span class="badge b-bad">${t} vs normale</span>`;
  if(e<=-10)return `<span class="badge b-warn">${t} vs normale</span>`;
  return `<span class="badge b-ok">${t} vs normale</span>`;
}
const vtot=s=>(s.last.plaf?'> ':'')+fmt(s.last.total);
const unitSw=()=>`<div class="unit-sw" role="group" aria-label="Unité">${Object.entries(UNITS).map(([k,u])=>`<button class="${k===unit?'on':''}" onclick="setUnit('${k}')">${u.lab}</button>`).join('')}</div>`;
function setUnit(u){unit=u;try{localStorage.setItem('jaug-unit',u)}catch(e){};route();}

/* ── Routage ── */
window.addEventListener('hashchange',route);
function route(){const m=location.hash.match(/site=(\d+)/); m?detail(+m[1]):liste();}

/* ── Vue liste ── */
function liste(){
  const ico=`<svg class="hico" viewBox="0 0 96 96"><rect width="96" height="96" rx="24" fill="url(#tile)"/><use href="#i-jaug" style="color:var(--acc)"/></svg>`;
  let L=SITES.filter(s=>filtre==='tous'||s.actif);
  if(recherche){const r=recherche.toLowerCase();L=L.filter(s=>(s.commune+' '+s.nom).toLowerCase().includes(r));}
  L.sort((a,b)=>a.commune.localeCompare(b.commune)||a.nom.localeCompare(b.nom));
  view.innerHTML=`
  <div class="crumb"><a href="index.html">Accueil</a> › Données › Jaugeages</div>
  <div class="head"><div class="head-l">${ico}<div><h1>Jaugeages</h1>
    <div class="sub">${L.length} captages · dernier relevé de chacun, comparé à la normale du même mois</div></div></div>${unitSw()}</div>
  <div class="tools">
    <input class="search" placeholder="Rechercher un captage ou une commune" value="${recherche}" oninput="recherche=this.value;liste();this.focus();this.setSelectionRange(this.value.length,this.value.length)">
    <button class="chip ${filtre==='actifs'?'on':''}" onclick="filtre='actifs';liste()">Captages suivis</button>
    <button class="chip ${filtre==='tous'?'on':''}" onclick="filtre='tous';liste()">Tous, y compris historiques</button>
  </div>
  <div class="card table-d"><table>
    <thead><tr><th>Captage</th><th>Dernier relevé</th><th class="num">Débit</th><th>Situation</th><th class="num">Normale du mois</th><th class="num">Plus bas connu</th></tr></thead>
    <tbody>${L.map(s=>`<tr onclick="location.hash='site=${s.id}'">
      <td><div class="site-n">${s.nom}</div><div class="site-c">${s.commune}</div></td>
      <td>${mois(s.last.ym)}</td>
      <td class="num"><b>${vtot(s)}</b> ${UNITS[unit].lab}</td>
      <td>${badge(s)}</td>
      <td class="num">${s.normal!==null?fmt(s.normal):'–'}</td>
      <td class="num">${s.minE?fmt(s.minE.total)+' <span class="site-c">('+s.minE.ym.slice(0,4)+')</span>':'–'}</td></tr>`).join('')}</tbody>
  </table></div>
  <div class="list-m">${L.map(s=>`<div class="card mcard" onclick="location.hash='site=${s.id}'">
      <div><div class="site-n">${s.nom}</div><div class="site-c">${s.commune}</div></div>
      <div class="big">${vtot(s)}<div class="site-c">${UNITS[unit].lab}</div></div>
      <div class="meta">${mois(s.last.ym)} ${badge(s)}</div></div>`).join('')}</div>
  <p class="note">Normale = moyenne des relevés complets du même mois sur tout l'historique (au moins 3 années). Les mesures plafonnées (seau plein), partielles ou invalides sont exclues des statistiques ; un captage à sec compte pour 0.</p>`;
}

/* ── Vue détail ── */
function detail(id){
  const s=SITES.find(x=>x.id===id); if(!s){liste();return;}
  const lastY=+s.last.ym.slice(0,4);
  if(win.end===null||win.site!==id){win={span:10,end:lastY+1,site:id};}
  const kp=(l,v,sub)=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`;
  const u=UNITS[unit].lab;
  view.innerHTML=`
  <button class="back" onclick="location.hash=''">‹ Tous les captages</button>
  <div class="crumb">Données › Jaugeages › ${s.commune}</div>
  <div class="head"><div><h1>${s.nom}</h1><div class="sub">${s.commune} · ${s.points.length>1?s.points.length+' points de mesure':'1 point de mesure'} · suivi depuis ${s.depuis}</div></div>${unitSw()}</div>
  <div class="kpis">
    ${kp('Dernier relevé',vtot(s)+' <small style="font-size:.8rem;font-weight:500">'+u+'</small>',mois(s.last.ym)+(s.last.partiel?' · partiel':''))}
    ${kp('Normale de '+MOIS[+s.last.ym.slice(5,7)-1],s.normal!==null?fmt(s.normal)+' <small style="font-size:.8rem;font-weight:500">'+u+'</small>':'–',s.ecart!==null?((s.ecart>0?'+':'')+Math.round(s.ecart)+' % pour ce relevé'):'historique insuffisant')}
    ${kp('Plus bas connu (étiage)',s.minE?fmt(s.minE.total)+' <small style="font-size:.8rem;font-weight:500">'+u+'</small>':'–',s.minE?mois(s.minE.ym):'')}
    ${kp('Plus haut mesuré',s.maxE?fmt(s.maxE.total)+' <small style="font-size:.8rem;font-weight:500">'+u+'</small>':'–',s.maxE?mois(s.maxE.ym)+(s.points.some(p=>p.plafond_lmin)?' · hors plafonds':''):'')}
  </div>
  <div class="card chart-card">
    <div class="chart-top"><h2>Débit total du captage</h2>
      <div class="tools" style="margin:0">
        ${[2,5,10,20,'tout'].map(n=>`<button class="chip ${win.span===n?'on':''}" onclick="setSpan(${typeof n==='number'?n:"'tout'"},${id})">${n==='tout'?'Tout':n+' ans'}</button>`).join('')}
        <div class="pan"><button onclick="pan(-1,${id})" aria-label="Période précédente">‹</button><span id="per"></span><button onclick="pan(1,${id})" aria-label="Période suivante">›</button></div>
      </div></div>
    <div class="chart-box"><canvas id="cv"></canvas></div>
    <div class="legend-note">Pointillés : normale de chaque mois. Points creux : relevé partiel ou plafonné, non pris en compte dans les statistiques.</div>
  </div>
  ${s.points.length>1?`<div class="card pts-wrap"><table class="pts"><thead><tr><th>Point de mesure</th><th class="num">Dernier relevé (${u})</th><th class="num">Plus bas connu</th><th class="num">Moyenne</th></tr></thead><tbody>
    ${s.points.map(p=>{const v=s.serie.map(x=>x.pts[p.id]).filter(x=>x!==undefined);const lv=s.last.pts[p.id];
      return `<tr><td>${p.nom}${p.dans_total?'':' <span class="site-c">(hors total)</span>'}</td><td class="num">${lv!==undefined?fmt(lv):'–'}</td><td class="num">${v.length?fmt(Math.min(...v)):'–'}</td><td class="num">${v.length?fmt(v.reduce((a,b)=>a+b,0)/v.length):'–'}</td></tr>`;}).join('')}
  </tbody></table></div>`:''}`;
  dessiner(s);
}
function setSpan(n,id){win.span=n;detail(id);}
function pan(d,id){if(win.span==='tout')return;win.end+=d*Math.max(1,Math.round(win.span/2));detail(id);}

function dessiner(s){
  if(chart)chart.destroy();
  const f=UNITS[unit].f, years=s.serie.map(x=>+x.ym.slice(0,4));
  let y0,y1; if(win.span==='tout'){y0=Math.min(...years);y1=Math.max(...years)+1;} else {y1=win.end;y0=y1-win.span;}
  document.getElementById('per').textContent=y0+' – '+(y1-1);
  const t0=Date.UTC(y0,0,1),t1=Date.UTC(y1,0,1);
  const vis=s.serie.filter(x=>x.t>=t0&&x.t<t1);
  const normale=[];
  for(let y=y0;y<y1;y++)for(let m=0;m<12;m++){const a=s.parMois[m];if(a.length>=3)normale.push({x:Date.UTC(y,m,15),y:a.reduce((p,q)=>p+q,0)/a.length*f});}
  const css=getComputedStyle(document.documentElement), acc=css.getPropertyValue('--acc').trim();
  chart=new Chart(document.getElementById('cv'),{type:'line',
    data:{datasets:[
      {label:'Débit total',data:vis.map(x=>({x:x.t,y:x.total*f,raw:x})),borderColor:acc,backgroundColor:acc,borderWidth:2,tension:.25,spanGaps:false,
       pointRadius:vis.length>80?1.5:3,pointBackgroundColor:c=>{const r=c.raw&&c.raw.raw;return r&&(r.partiel||r.plaf)?'#fff':acc;}},
      {label:'Normale',data:normale,borderColor:'#9A8F85',borderDash:[5,4],borderWidth:1.3,pointRadius:0,tension:.3},
      ...(s.minE?[{label:'Plus bas connu',data:[{x:t0,y:s.minE.total*f},{x:t1,y:s.minE.total*f}],borderColor:'#B42318',borderWidth:1,borderDash:[2,3],pointRadius:0}]:[])
    ]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'nearest',intersect:false},
      scales:{x:{type:'linear',min:t0,max:t1,grid:{color:'#EFEAE3'},
                 afterBuildTicks:ax=>{const pas=(y1-y0)>12?5:1,t=[];for(let y=y0;y<=y1;y++)if((y-y0)%pas===0||y===y1)t.push({value:Date.UTC(y,0,1)});ax.ticks=t;},
                 ticks:{callback:v=>new Date(v).getUTCFullYear()}},
              y:{beginAtZero:true,title:{display:true,text:UNITS[unit].lab},grid:{color:'#EFEAE3'}}},
      plugins:{legend:{position:'bottom',labels:{boxWidth:14,font:{family:'Public Sans'}}},
        tooltip:{callbacks:{title:it=>{const d=new Date(it[0].parsed.x);return MOIS[d.getUTCMonth()]+' '+d.getUTCFullYear();},
          label:c=>{const r=c.raw.raw;return c.dataset.label+' : '+(r&&r.plaf?'> ':'')+c.parsed.y.toLocaleString('fr-FR',{maximumFractionDigits:UNITS[unit].d})+' '+UNITS[unit].lab+(r&&r.partiel?' (partiel)':'');}}}}}});
}

start();
</script>
