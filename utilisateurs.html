<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EC">
<title>Utilisateurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="profil.js"></script>
<script src="menu.js"></script>
<style>
:root{
  --bg:#F4F1EC; --card:#FFFFFF; --line:#E7E1D8; --ink:#26221E; --mute:#7A7068;
  --acc:#B84712; --acc-2:#C2410C; --acc-soft:#FBE9DC; --acc-soft2:#F3D0B5;
  --ok:#2F7D4F; --ok-soft:#E3F1E8; --warn:#B7791F; --warn-soft:#FCF1DC; --bad:#B42318; --bad-soft:#FDE7E4;
  --font:'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0)}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;min-height:100%}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ── Charpente ── */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center}
.brand b{font-size:1rem;display:block}.brand small{font-size:.7rem;color:var(--mute);letter-spacing:.02em}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;font-size:.93rem}
.nav a:hover{background:#F7F3EE}
.nav a.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.nav svg{width:28px;height:28px;margin:-4px;flex:none}
.ic{fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.side .who{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;font-size:.82rem;color:var(--mute)}
.side .who button{background:none;border:none;color:var(--acc);font-weight:600;padding:0;margin-top:4px}
main{padding:28px 32px 60px;min-width:0}
.crumb{font-size:.82rem;color:var(--mute);margin-bottom:6px}
.crumb a{color:var(--mute);text-decoration:none}
h1{font-size:1.75rem;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:.9rem;margin-top:4px}
.head{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.head-l{display:flex;gap:14px;align-items:center}
.hico{width:56px;height:56px;border-radius:14px;flex:none}
.bnav{display:none}

/* ── Éléments communs ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.loading{padding:60px;text-align:center;color:var(--mute)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.74rem;font-weight:600;white-space:nowrap}
.b-super{background:#EEE6FD;color:#5B21B6}
.b-chef{background:var(--warn-soft);color:var(--warn)}
.b-agent{background:var(--ok-soft);color:var(--ok)}
.b-consult{background:#EFEBE5;color:var(--mute)}
.b-off{background:var(--bad-soft);color:var(--bad)}
select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:.84rem;background:#fff;color:var(--ink)}

/* ── Info ajout ── */
.sec{padding:18px 20px;margin-bottom:20px}
.sec p{font-size:.85rem;color:var(--mute);margin-top:6px;line-height:1.55}

/* ── Grille de cartes ── */
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}

/* ── Carte utilisateur ── */
.ucard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ucard-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);background:#FDFBF8}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--acc-soft);color:var(--acc);font-size:1rem;font-weight:700;display:grid;place-items:center;flex:none;letter-spacing:-.02em}
.avatar.off{background:#EFEAE3;color:var(--mute)}
.uinfo{min-width:0;flex:1}
.uname{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uemail{font-size:.79rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urole{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}

/* ── Modules dans la carte ── */
.mods{padding:10px 18px;flex:1}
.mrow{display:grid;grid-template-columns:1fr auto;align-items:center;padding:6px 0;border-bottom:1px solid #F3EDE5;gap:8px}
.mrow:last-child{border-bottom:none}
.mlab{font-size:.84rem;font-weight:500}
.msel{padding:5px 8px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:.81rem;background:#fff;min-width:128px}
.msel.def{color:var(--mute);font-style:italic}

/* ── Pied de carte ── */
.ucard-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#FDFBF8;border-top:1px solid var(--line);gap:8px;flex-wrap:wrap}
.actif-wrap{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mute);cursor:pointer}
.actif-wrap input{width:17px;height:17px;accent-color:var(--acc);cursor:pointer}
.btn-save{background:var(--acc);color:#fff;border:none;border-radius:9px;padding:8px 18px;font-weight:600;font-size:.86rem}
.btn-save:hover{background:#a03d0e}
.btn-save:disabled{opacity:.5;cursor:not-allowed}

/* Carte désactivée */
.ucard.inactive .ucard-head{opacity:.55}
.ucard.inactive .mods{opacity:.4;pointer-events:none}

/* ── Connexion ── */
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.login.off{display:none}
.login .card{width:100%;max-width:360px;padding:28px}
.login h2{margin-bottom:4px}.login p{color:var(--mute);font-size:.88rem;margin-bottom:16px}
.login label{display:block;font-size:.8rem;font-weight:600;margin:10px 0 4px}
.login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:600;width:100%;margin-top:16px}
.err{color:var(--bad);font-size:.85rem;margin-top:10px;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:.9rem;font-weight:500;transition:.2s;z-index:80;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}

/* ── Mobile ── */
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  main{padding:calc(16px + env(safe-area-inset-top,0)) 16px calc(90px + env(safe-area-inset-bottom,0))}
  h1{font-size:1.4rem}.hico{width:46px;height:46px}
  .ugrid{grid-template-columns:1fr}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0));z-index:20}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--mute);text-decoration:none;font-weight:500}
  .bnav a.on{color:var(--acc)}
  .bnav svg{width:32px;height:32px;margin:-4px}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media print{.side,.bnav,.head button{display:none!important}.shell{display:block}main{padding:0}.ucard{break-inside:avoid;border-color:#ccc}body{background:#fff}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <linearGradient id="tile" x1="0" y1="0" x2="96" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF1E5"/><stop offset="1" stop-color="#F3D0B5"/></linearGradient>
  <symbol id="ic-utilisateurs" viewBox="0 0 96 96"><path d="M50 38a10 10 0 1 1-20 0a10 10 0 1 1 20 0zM20 74c0-12 9-19 20-19s20 7 20 19zM58 29a9 9 0 1 1 4 17M66 55c8 2 12 8 12 17"/></symbol>
</svg>

<div class="login off" id="login">
  <div class="card">
    <h2>Connexion</h2><p>Accès réservé aux agents du service.</p>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username">
    <label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn" id="bl" onclick="login()">Se connecter</button>
    <div class="err" id="er"></div>
  </div>
</div>

<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 3s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z" fill="none" stroke="#fff" stroke-width="1.8"/></svg></div>
      <div><b>AquaPilot</b><small>Eau potable</small></div>
    </div>
    <nav class="nav" id="sidenav"></nav>
    <div class="who"><span id="who"></span><br><a href="compte.html" style="color:var(--acc);font-weight:600;text-decoration:none">Mon compte</a> · <button onclick="logout()">Se déconnecter</button></div>
  </aside>

  <main>
    <div id="view"><div class="loading"><div class="spin"></div>Chargement des utilisateurs…</div></div>
  </main>
</div>

<div class="toast" id="toast"></div>
<nav class="bnav" id="bnav"></nav>

<script>
const db=supabase.createClient('https://xvdryqptuejenspbypvy.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2ZHJ5cXB0dWVqZW5zcGJ5cHZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NDU0ODEsImV4cCI6MjEwNjUyMTQ4MX0.PuHAhD1ipYXQeXDFsJfoxIu1AhciTk5qwU0WU5wKIhs');
let user=null,U=[];
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600);}

const BADGE_CLS={super_admin:'b-super',chef_equipe:'b-chef',agent:'b-agent',consultant:'b-consult'};

function initiales(nom,email){
  const n=nom&&nom.trim()?nom.trim():prenomDepuisEmail(email);
  if(n){const p=n.split(/[\s-]+/);return(p[0][0]+(p[1]?.[0]||'')).toUpperCase();}
  return (email||'?')[0].toUpperCase();
}

function renderCard(u){
  const moi=u.user_id===user.id;
  const inits=esc(initiales(u.nom,u.email));
  const defNiv=niveauParDefaut(u.role,'jaugeages'); // pour tous modules chef/super=3 agent=2 consult=1
  const badgeCls=u.actif?(BADGE_CLS[u.role]||'b-consult'):'b-off';
  const badgeTxt=u.actif?(ROLES[u.role]||u.role):'Désactivé';

  const modsHtml=Object.entries(MODULES_DROITS).map(([k,label])=>{
    const storedVal=u.modules&&u.modules[k]!=null?String(u.modules[k]):'';
    const isDefault=storedVal==='';
    const defLabel=NIVEAUX[niveauParDefaut(u.role,k)];
    const opts=`<option value="" ${isDefault?'selected':''}>Défaut (${esc(defLabel)})</option>`
      +NIVEAUX.map((l,i)=>`<option value="${i}" ${storedVal===String(i)?'selected':''}>${l}</option>`).join('');
    return `<div class="mrow">
      <span class="mlab">${esc(label)}</span>
      <select class="msel${isDefault?' def':''}" id="m_${u.user_id}_${k}"
        ${moi?'disabled':''}
        onchange="this.classList.toggle('def',this.value==='');majDefNiv('${esc(u.user_id)}')">
        ${opts}
      </select>
    </div>`;
  }).join('');

  return `<div class="ucard${u.actif?'':' inactive'}" id="card-${u.user_id}">
    <div class="ucard-head">
      <div class="avatar${u.actif?'':' off'}">${inits}</div>
      <div class="uinfo">
        <div class="uname">${(()=>{const n=nomAffiche(u,u.email);return n?esc(n):'<span style="color:var(--mute);font-weight:400;font-style:italic">Sans nom</span>';})()}</div>
        <div class="uemail">${esc(u.email||'')}</div>
      </div>
      <div class="urole">
        <span class="badge ${badgeCls}" id="badge-${u.user_id}">${badgeTxt}</span>
        <select id="r_${u.user_id}" ${moi?'disabled title="Tu ne peux pas modifier ton propre rôle"':''}
          onchange="majRoleBadge('${esc(u.user_id)}',this.value)">
          ${Object.entries(ROLES).map(([k,l])=>`<option value="${k}" ${u.role===k?'selected':''}>${l}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="mods">${modsHtml}</div>
    <div class="ucard-foot">
      <label class="actif-wrap">
        <input type="checkbox" id="a_${u.user_id}" ${u.actif?'checked':''} ${moi?'disabled':''}
          onchange="document.getElementById('card-${u.user_id}').classList.toggle('inactive',!this.checked);document.getElementById('avatar-${u.user_id}')?.classList.toggle('off',!this.checked)">
        Compte actif
      </label>
      <button class="btn-save" onclick="enregistrer('${esc(u.user_id)}')">Enregistrer</button>
    </div>
  </div>`;
}

function majRoleBadge(uid,role){
  const badge=document.getElementById('badge-'+uid);
  if(!badge)return;
  badge.textContent=ROLES[role]||role;
  badge.className='badge '+(BADGE_CLS[role]||'b-consult');
  // Mettre à jour les labels "Défaut (…)" dans les selects modules
  majDefNiv(uid);
}

function majDefNiv(uid){
  const rsel=document.getElementById('r_'+uid);
  if(!rsel)return;
  const role=rsel.value;
  Object.keys(MODULES_DROITS).forEach(k=>{
    const s=document.getElementById('m_'+uid+'_'+k);
    if(!s)return;
    const defLabel=NIVEAUX[niveauParDefaut(role,k)];
    s.options[0].text='Défaut ('+defLabel+')';
  });
}

function pageSansDroitLocal(texte){
  return `<div style="max-width:520px;margin:60px auto;text-align:center;background:#fff;border:1px solid #E7E1D8;border-radius:14px;padding:28px">
    <div style="font-size:2rem">🔒</div><h2 style="margin:8px 0">Accès non autorisé</h2>
    <p style="color:#7A7068">${texte}</p><p style="margin-top:16px"><a href="index.html" style="color:#B84712;font-weight:600">Retour au portail</a></p></div>`;
}

async function start(){
  try{
    const {data:{session}}=await db.auth.getSession();
    if(!session){document.getElementById('login').classList.remove('off');return;}
    user=session.user;
    document.getElementById('login').classList.add('off');
    document.getElementById('who').textContent=prenomDepuisEmail(user.email)||user.email;
    await chargerProfil(db,user);
    montrerMenu('utilisateurs');
    if(!estSuperAdmin()){document.getElementById('view').innerHTML=pageSansDroitLocal('La gestion des utilisateurs est réservée au super admin.');return;}
    await charger();
    afficher();
  }catch(e){
    console.error('[utilisateurs] start() erreur:',e);
    const v=document.getElementById('view');
    if(v)v.innerHTML=`<div class="card loading" style="color:var(--bad)">Erreur de chargement : ${esc(String(e?.message||e))}<br><small>Voir la console (F12) pour le détail.</small><br><br><button class="btn" onclick="location.reload()" style="width:auto;padding:8px 20px">Réessayer</button></div>`;
  }
}

async function login(){
  document.getElementById('er').textContent='';
  document.getElementById('bl').disabled=true;
  const {error}=await db.auth.signInWithPassword({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value});
  document.getElementById('bl').disabled=false;
  if(error){document.getElementById('er').textContent='Email ou mot de passe incorrect.';return;}
  start();
}
async function logout(){await db.auth.signOut();location.reload();}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login();});

async function charger(){
  const {data,error}=await db.from('profils').select('*').order('email');
  if(error){
    document.getElementById('view').innerHTML=`<div class="card loading">Chargement impossible : ${esc(error.message)}<br><small>Le script 17_profils.sql a-t-il été lancé ?</small></div>`;
    throw error;
  }
  U=data;
}

function afficher(){
  const ico=`<svg class="hico" viewBox="0 0 96 96"><rect width="96" height="96" rx="24" fill="url(#tile)"/><g class="ic" style="color:var(--acc);stroke-width:2.6"><use href="#ic-utilisateurs"/></g></svg>`;
  const actifs=U.filter(u=>u.actif).length;
  document.getElementById('view').innerHTML=`
    <div class="crumb"><a href="index.html">Accueil</a> › Utilisateurs</div>
    <div class="head">
      <div class="head-l">${ico}
        <div><h1>Utilisateurs et droits</h1>
        <div class="sub">${U.length} compte${U.length>1?'s':''} · ${actifs} actif${actifs>1?'s':''}</div></div>
      </div>
    </div>
    <div class="card sec" style="background:#FBF8F4"><b>Ajouter quelqu'un</b>
      <p>1. Supabase → Authentication → Users → Add user (email + mot de passe, « Auto Confirm User »).<br>
         2. Recharge cette page : la personne apparaît en <b>Consultant</b>. Attribue-lui son rôle ici.</p>
    </div>
    <div class="ugrid">${U.map(renderCard).join('')}</div>
    <p style="font-size:.8rem;color:var(--mute);margin-top:16px">« Défaut » suit le rôle. Saisie = ajouter des relevés et corriger les siens pendant 30 jours. Gestion = tout modifier. Un compte désactivé ne voit plus rien. Ton propre rôle est verrouillé.</p>`;
}

async function enregistrer(id){
  const btn=document.querySelector(`#card-${id} .btn-save`);
  if(btn)btn.disabled=true;
  const moi=id===user.id;
  const modules={};
  for(const m in MODULES_DROITS){
    const s=document.getElementById('m_'+id+'_'+m);
    if(s&&s.value!=='')modules[m]=+s.value;
  }
  const nomEl=document.querySelector(`#card-${id} .uname input`);
  const maj={};
  if(!moi){
    maj.role=document.getElementById('r_'+id).value;
    maj.modules=modules;
    maj.actif=document.getElementById('a_'+id).checked;
  }
  // Nom non éditable ici (voir page compte.html) — on ne met à jour que rôle/modules/actif
  const {error}=await db.from('profils').update(maj).eq('user_id',id);
  if(btn)btn.disabled=false;
  if(error){toast('Erreur : '+error.message);return;}
  await charger();afficher();
  toast('Droits enregistrés ✓');
}

start();
</script>
</body>
</html>
