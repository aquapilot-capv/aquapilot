<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EC">
<title>Documentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="profil.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#F4F1EC; --card:#FFFFFF; --line:#E7E1D8; --ink:#26221E; --mute:#7A7068;
  --acc:#B84712; --acc-2:#C2410C; --acc-soft:#FBE9DC; --acc-soft2:#F3D0B5;
  --ok:#2F7D4F; --ok-soft:#E3F1E8; --warn:#B7791F; --warn-soft:#FCF1DC; --bad:#B42318; --bad-soft:#FDE7E4;
  --font:'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0)}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;min-height:100%}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ── Charpente ── */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center}
.brand b{font-size:1rem;display:block}.brand small{font-size:.7rem;color:var(--mute);letter-spacing:.02em}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;font-size:.93rem}
.nav a:hover{background:#F7F3EE}
.nav a.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.nav svg{width:28px;height:28px;margin:-4px;flex:none}
.ic{fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.side .who{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;font-size:.82rem;color:var(--mute)}
.side .who button{background:none;border:none;color:var(--acc);font-weight:600;padding:0;margin-top:4px}
main{padding:28px 32px 60px;min-width:0}
.crumb{font-size:.82rem;color:var(--mute);margin-bottom:6px}
.crumb a{color:var(--mute);text-decoration:none}
h1{font-size:1.75rem;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:.9rem;margin-top:4px}
.head{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.head-l{display:flex;gap:14px;align-items:center}
.hico{width:56px;height:56px;border-radius:14px;flex:none}
.bnav{display:none}

/* ── Cartes ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:.85rem;font-weight:500;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.unit-sw{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.unit-sw button{border:none;background:none;padding:8px 12px;font-size:.83rem;font-weight:600;color:var(--mute)}
.unit-sw button.on{background:var(--acc);color:#fff}

/* Tableau bureau */
table{width:100%;border-collapse:collapse}
th{font-size:.75rem;font-weight:600;color:var(--mute);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);background:#FBF9F6}
th:first-child{border-top-left-radius:14px}th:last-child{border-top-right-radius:14px}
td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}tbody tr:hover{background:#FBF8F4}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.site-n{font-weight:600}.site-c{font-size:.8rem;color:var(--mute)}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}.b-mute{background:#EFEBE5;color:var(--mute)}
.list-m{display:none}

/* Détail */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi .l{font-size:.78rem;color:var(--mute);font-weight:500}
.kpi .v{font-size:1.6rem;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.8rem;color:var(--mute);margin-top:2px}
.chart-card{padding:18px 18px 10px;margin-bottom:16px}
.chart-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chart-top h2{font-size:1rem}
.pan{display:inline-flex;gap:6px;align-items:center}
.pan button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:32px}
.pan span{font-size:.85rem;font-weight:600;min-width:110px;text-align:center;font-variant-numeric:tabular-nums}
.chart-box{position:relative;height:340px}
.legend-note{font-size:.78rem;color:var(--mute);padding:6px 2px 4px}
.pts td:first-child{font-weight:500}
.back{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.88rem;margin-bottom:14px}
.note{font-size:.8rem;color:var(--mute);margin-top:12px}
.loading{padding:60px;text-align:center;color:var(--mute)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}

/* Connexion */
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.login.off{display:none}
.login .card{width:100%;max-width:360px;padding:28px}
.login h2{margin-bottom:4px}.login p{color:var(--mute);font-size:.88rem;margin-bottom:16px}
.login label{display:block;font-size:.8rem;font-weight:600;margin:10px 0 4px}
.login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:600;width:100%;margin-top:16px}
.err{color:var(--bad);font-size:.85rem;margin-top:10px;min-height:1.2em}

/* ── Mobile ── */
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  main{padding:calc(16px + env(safe-area-inset-top,0)) 16px calc(90px + env(safe-area-inset-bottom,0))}
  h1{font-size:1.4rem}.hico{width:46px;height:46px}
  .table-d{display:none}
  .list-m{display:flex;flex-direction:column;gap:10px}
  .mcard{padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;cursor:pointer}
  .mcard .big{font-size:1.25rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .mcard .meta{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--mute)}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:12px 14px}.kpi .v{font-size:1.25rem}
  .chart-box{height:260px}
  .pts-wrap{overflow-x:auto}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0));z-index:20}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--mute);text-decoration:none;font-weight:500}
  .bnav a.on{color:var(--acc)}
  .bnav svg{width:32px;height:32px;margin:-4px}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.btn-a{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:600;font-size:.9rem}
.btn-l{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;font-size:.88rem;color:var(--ink)}
.btn-d{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;font-size:.88rem;color:var(--bad)}
.sec{padding:18px 20px;margin-bottom:14px}
.sec h2{font-size:1rem;margin-bottom:12px;color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.fl label{display:block;font-size:.8rem;font-weight:600;margin-bottom:5px}
.fl input,.fl textarea,.fl select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.fl textarea{min-height:76px;resize:vertical}
.fl input:focus,.fl textarea:focus,.fl select:focus{outline:none;border-color:var(--acc)}
.fl{margin-bottom:12px}
.req{color:var(--bad)}
.dt{display:grid;grid-template-columns:200px 1fr;gap:6px 16px;font-size:.92rem}
@media (max-width:860px){.dt{grid-template-columns:1fr}.dt dt{margin-top:8px}}
.dt dt{color:var(--mute);font-weight:500}.dt dd{white-space:pre-wrap}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.photos .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#EFEAE3}
.photos img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.photos .x{position:absolute;top:6px;right:6px;border:none;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:26px;height:26px}
.add{border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;aspect-ratio:1;color:var(--mute);font-weight:600;font-size:.85rem;cursor:pointer;background:#fff;text-align:center;padding:8px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:70}
.lb.on{display:flex}.lb img{max-width:94vw;max-height:90vh;border-radius:8px}
.foot{position:sticky;bottom:0;background:var(--bg);padding:12px 0;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:860px){.foot{bottom:calc(64px + env(safe-area-inset-bottom,0));flex-wrap:nowrap}.foot button{flex:1;padding:12px 8px}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:.9rem;font-weight:500;transition:.2s;z-index:80;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
@media print{.side,.bnav,.back,.head button,.foot{display:none!important}.shell{display:block}main{padding:0}.card{break-inside:avoid;border-color:#ccc}body{background:#fff}}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.layout{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}.tree{display:none}.tree.open{display:block}}
.tree{padding:10px}
.tree button{display:block;width:100%;text-align:left;border:none;background:none;padding:7px 10px;border-radius:8px;font-size:.88rem;color:var(--ink)}
.tree button.sub{padding-left:24px;font-size:.84rem;color:#4b443e}
.tree button.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.tree button small{color:var(--mute);float:right}
.doc{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;margin-bottom:8px}
.pdf{width:44px;height:52px;border-radius:6px;background:#FDE7E4;color:#B42318;display:grid;place-items:center;font-size:.7rem;font-weight:700}
.doc .t{font-weight:600;line-height:1.25}.doc .m{font-size:.8rem;color:var(--mute);margin-top:2px}
.doc .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:620px){.doc{grid-template-columns:40px 1fr}.doc .acts{grid-column:1/-1;justify-content:flex-start}}
.tag{display:inline-block;background:#EFEBE5;color:#5C534C;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:500;margin:3px 4px 0 0}
.tag.s{background:#E3EEF7;color:#2F6F9F}
.up{padding:16px;margin-bottom:12px}
.up .row2{display:grid;grid-template-columns:2fr 1fr 1.4fr;gap:10px}
.up .row3{display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px;margin-top:10px}
@media (max-width:860px){.up .row2,.up .row3{grid-template-columns:1fr}}
.up .fl{margin:0}.sugg{font-size:.76rem;color:var(--ok);margin-top:6px}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--mute);background:#fff;cursor:pointer;margin-bottom:14px}
.drop.over{border-color:var(--acc);background:var(--acc-soft)}
.fam-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.fam-row input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
.fam-row select{padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;max-width:180px}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-size:.8rem;font-weight:600}
</style>
</head>

<script>
const db=supabase.createClient('https://xvdryqptuejenspbypvy.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2ZHJ5cXB0dWVqZW5zcGJ5cHZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NDU0ODEsImV4cCI6MjEwNjUyMTQ4MX0.PuHAhD1ipYXQeXDFsJfoxIu1AhciTk5qwU0WU5wKIhs');
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const ADMIN='jeremy.bellec@paysvoironnais.com';
const CATS={technique:'Documentation technique',procedure:'Procédures',plan:'Schémas et plans'};
const TYPES={captage:'captage',reservoir:'réservoir',station:'station',forage:'forage',puits:'puits',surpresseur:'surpresseur',secto:'sectorisation',regard:'regard',vanne:'vanne',comptage:'achat / vente',chambre:'chambre de vannes',dioxyde:'point dioxyde',piezometre:'piézomètres',autre:'autre ouvrage'};
const TYPES_NOUV=['captage','reservoir','station','forage','puits','surpresseur','secto','regard','chambre','vanne','comptage','autre'];
let UD=[],udSel=null;
let user=null,admin=false,DOCS=[],FAM=[],SITES=[],LIENS=[],cat=localStorage.getItem('doc-cat')||'plan',SEL=new Set(),famSel=null,siteSel=null,rech='',file=[],treeOpen=false;
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
const taille=o=>o==null?'':o>1048576?(o/1048576).toFixed(1).replace('.',',')+' Mo':Math.max(1,Math.round(o/1024))+' Ko';
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2800);}

async function start(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){document.getElementById('login').classList.remove('off');return;}
  user=session.user;await chargerProfil(db,user);admin=niv('documentation')>=3;
  if(niv('documentation')<1){view.innerHTML=pageSansDroit('Ton profil ne donne pas accès à la documentation.');return;}
  document.getElementById('login').classList.add('off');document.getElementById('who').textContent=user.email;
  await charger();route();
}
async function login(){er.textContent='';bl.disabled=true;const {error}=await db.auth.signInWithPassword({email:em.value.trim(),password:pw.value});bl.disabled=false;if(error){er.textContent='Email ou mot de passe incorrect.';return;}start();}
async function logout(){await db.auth.signOut();location.reload();}
pw.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
async function toutes(q){let o=[],a=0;while(true){const {data,error}=await q().range(a,a+999);if(error)throw error;o=o.concat(data);if(data.length<1000)break;a+=1000;}return o;}
async function charger(){
  try{[DOCS,FAM,SITES,LIENS]=await Promise.all([toutes(()=>db.from('documents').select('*').order('titre')),toutes(()=>db.from('doc_familles').select('*').order('ordre')),
      toutes(()=>db.from('sites').select('id,commune,nom,type,actif,alias,zone,ud_id').order('nom')),toutes(()=>db.from('document_sites').select('*'))]);
    UD=(await db.from('unites_distribution').select('*').order('nom')).data||[];}
  catch(e){view.innerHTML=`<div class="card loading">Chargement impossible : ${esc(e.message)}<br><small>${/alias/.test(e.message)?'Lance le script 12_ouvrages_alias.sql':/categorie/.test(e.message)?'Lance le script 13_familles_par_categorie.sql':'Vérifie que les scripts 11, 12 et 13 ont été lancés'} dans le SQL Editor.</small></div>`;throw e;}
}
const famNom=id=>{const f=FAM.find(x=>x.id===id);if(!f)return '';const p=FAM.find(x=>x.id===f.parent_id);return p?p.nom+' › '+f.nom:f.nom;};
const sousFam=id=>[id,...FAM.filter(f=>f.parent_id===id).map(f=>f.id)];
const famCat=c=>FAM.filter(f=>(f.categorie||'technique')===c);
const siteLab=s=>`${s.nom} (${TYPES[s.type]||s.type}${s.commune&&s.commune!=='À préciser'?', '+s.commune:''})`;
const udNom=id=>UD.find(u=>u.id===id)?.nom||'Sans UD';
function optSites(L,sel){const g={};L.forEach(s=>(g[s.ud_id||0]??=[]).push(s));return Object.keys(g).sort((a,b)=>udNom(+a).localeCompare(udNom(+b))).map(k=>`<optgroup label="${esc(udNom(+k))}">${g[k].map(s=>`<option value="${s.id}" ${sel===s.id?'selected':''}>${esc(siteLab(s))}</option>`).join('')}</optgroup>`).join('');}
const sitesDoc=d=>LIENS.filter(l=>l.document_id===d.id).map(l=>SITES.find(s=>s.id===l.site_id)).filter(Boolean);

window.addEventListener('hashchange',route);
function route(){const h=location.hash;
  if(h==='#deposer'&&admin)return deposer();
  if(h==='#familles'&&admin)return familles();
  if(h==='#ouvrages'&&estGestionnaire())return ouvrages();
  let m;if(m=h.match(/^#modifier=(\d+)/))return admin?modifier(+m[1]):liste();
  liste();}
const ico=`<svg class="hico" viewBox="0 0 96 96"><rect width="96" height="96" rx="24" fill="url(#tile)"/><use href="#i-doc" style="color:var(--acc)"/></svg>`;

/* ── Consultation ── */
function liste(){
  let L=DOCS.filter(d=>d.categorie===cat);
  if(famSel===-1)L=L.filter(d=>!d.famille_id);else if(famSel)L=L.filter(d=>sousFam(famSel).includes(d.famille_id));
  if(siteSel)L=L.filter(d=>LIENS.some(l=>l.document_id===d.id&&l.site_id===siteSel));
  if(cat==='plan'&&udSel===-1)L=L.filter(d=>!LIENS.some(l=>l.document_id===d.id));
  else if(cat==='plan'&&udSel)L=L.filter(d=>sitesDoc(d).some(s=>s.ud_id===udSel));
  if(rech){const r=norm(rech);L=L.filter(d=>norm([d.titre,d.fabricant,d.modele,d.description,famNom(d.famille_id),...sitesDoc(d).map(s=>s.nom+' '+s.commune)].join(' ')).includes(r));}
  const nb=c=>DOCS.filter(d=>d.categorie===c).length;
  const sitesAvec=[...new Set(LIENS.map(l=>l.site_id))].map(id=>SITES.find(s=>s.id===id)).filter(Boolean).sort((a,b)=>a.nom.localeCompare(b.nom));
  const vol=DOCS.reduce((a,d)=>a+(d.taille||0),0);
  const racines=famCat(cat).filter(f=>!f.parent_id);
  const cpt=id=>DOCS.filter(d=>sousFam(id).includes(d.famille_id)&&d.categorie===cat).length;
  const sansFam=DOCS.filter(d=>d.categorie===cat&&!d.famille_id).length;
  view.innerHTML=`<div class="crumb"><a href="index.html">Accueil</a> › Documentation</div>
  <div class="head"><div class="head-l">${ico}<div><h1>Documentation</h1><div class="sub">${DOCS.length} document${DOCS.length>1?'s':''}${admin?' · '+taille(vol)+' utilisés sur 1 Go':''}</div></div></div>
    ${admin?`<div style="display:flex;gap:8px;flex-wrap:wrap">${estGestionnaire()?`<button class="btn-l" onclick="location.hash='ouvrages'">Gérer les ouvrages</button>`:''}<button class="btn-l" onclick="location.hash='familles'">Gérer les familles</button><button class="btn-a" onclick="location.hash='deposer'">+ Déposer des documents</button></div>`:''}</div>
  <div class="cats">${Object.entries(CATS).map(([k,l])=>`<button class="chip ${cat===k?'on':''}" onclick="cat='${k}';famSel=null;udSel=null;siteSel=null;SEL.clear();localStorage.setItem('doc-cat','${k}');liste()">${l} (${nb(k)})</button>`).join('')}</div>
  <div class="tools"><input class="search" id="rch" placeholder="Rechercher : titre, fabricant, modèle, ouvrage…" value="${esc(rech)}" oninput="rech=this.value;liste();const i=document.getElementById('rch');i.focus();i.setSelectionRange(i.value.length,i.value.length)">
    <select class="search" style="flex:0 1 280px" onchange="siteSel=+this.value||null;liste()"><option value="">Tous les ouvrages</option>${optSites(sitesAvec,siteSel)}</select>
    <button class="chip" style="display:none" id="tb" onclick="treeOpen=!treeOpen;document.querySelector('.tree').classList.toggle('open')">Familles</button></div>
  <div class="layout">
    ${cat==='plan'?arbreUD():`<div class="card tree ${treeOpen?'open':''}"><button class="${!famSel?'on':''}" onclick="famSel=null;liste()">Toutes les familles</button>${sansFam?`<button class="${famSel===-1?'on':''}" onclick="famSel=-1;liste()">Sans famille <small>${sansFam}</small></button>`:''}
      ${!racines.length?`<div class="site-c" style="padding:8px 10px">Aucune famille dans cette catégorie${admin?' : crée-les dans « Gérer les familles »':''}.</div>`:''}
      ${racines.map(r=>`<button class="${famSel===r.id?'on':''}" onclick="famSel=${r.id};liste()">${esc(r.nom)} <small>${cpt(r.id)}</small></button>`+
        FAM.filter(f=>f.parent_id===r.id).map(f=>`<button class="sub ${famSel===f.id?'on':''}" onclick="famSel=${f.id};liste()">${esc(f.nom)} <small>${cpt(f.id)}</small></button>`).join('')).join('')}</div>`}
    <div>${admin&&L.length?barreSel(L):''}${L.length?L.map(d=>{const S=sitesDoc(d);return `<div class="card doc" style="${admin?'grid-template-columns:22px 44px 1fr auto':''}">${admin?`<input type="checkbox" ${SEL.has(d.id)?'checked':''} onchange="this.checked?SEL.add(${d.id}):SEL.delete(${d.id});majBarre()" aria-label="Sélectionner" style="width:18px;height:18px">`:''}<div class="pdf">PDF</div>
      <div><div class="t">${esc(d.titre)}</div><div class="m">${CATS[d.categorie]}${d.famille_id?' · '+esc(famNom(d.famille_id)):''}${d.fabricant||d.modele?' · '+esc([d.fabricant,d.modele].filter(Boolean).join(' ')):''} · ${taille(d.taille)}</div>
        <div>${S.map(s=>`<span class="tag s">${esc(s.nom)}</span>`).join('')}</div></div>
      <div class="acts"><button class="btn-a" onclick="ouvrir(${d.id},false)">Ouvrir</button><button class="btn-l" onclick="ouvrir(${d.id},true)">Télécharger</button>${admin?`<button class="btn-l" onclick="location.hash='modifier=${d.id}'">Modifier</button>`:''}</div></div>`;}).join('')
      :`<div class="card loading">${DOCS.length?'Aucun document pour ces critères.':admin?'Aucun document pour l\'instant. Clique sur « Déposer des documents ».':'Aucun document pour l\'instant.'}</div>`}</div>
  </div>`;
  L_courante=L;majBarre();
  if(matchMedia('(max-width:860px)').matches)document.getElementById('tb').style.display='';
}
function barreSel(L){
  return `<div class="card" id="bsel" style="padding:10px 14px;margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <label style="display:flex;gap:8px;align-items:center;font-weight:600;font-size:.88rem"><input type="checkbox" id="tous" style="width:18px;height:18px" onchange="L_courante.forEach(d=>this.checked?SEL.add(d.id):SEL.delete(d.id));liste()"> Tout sélectionner</label>
    <span id="nsel" class="site-c"></span><span style="flex:1"></span>
    <span id="acts" style="display:none;gap:6px;flex-wrap:wrap">
      <select class="mini" onchange="grouper('categorie',this.value);this.value=''"><option value="">Changer de catégorie…</option>${Object.entries(CATS).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select>
      <select class="mini" onchange="grouper('famille_id',this.value);this.value=''"><option value="">Changer de famille…</option><option value="0">(aucune famille)</option>${famCat(cat).map(f=>`<option value="${f.id}">${esc(famNom(f.id))}</option>`).join('')}</select>
      <select class="mini" onchange="grouperSite(+this.value);this.value=''"><option value="">Ajouter un ouvrage…</option>${optSites(SITES)}</select>
      <button class="mini" onclick="retirerSites()">Retirer les ouvrages</button>
      <button class="mini" style="color:var(--bad)" onclick="supprimerSel()">Supprimer</button></span></div>`;
}
let L_courante=[];
function majBarre(){const n=SEL.size,a=document.getElementById('acts');if(!a)return;a.style.display=n?'flex':'none';document.getElementById('nsel').textContent=n?n+' sélectionné'+(n>1?'s':''):'';
  const t=document.getElementById('tous');if(t)t.checked=L_courante.length&&L_courante.every(d=>SEL.has(d.id));}
async function grouper(champ,v){
  if(!v||!SEL.size)return;const ids=[...SEL];
  const maj=champ==='categorie'?{categorie:v,famille_id:null}:{famille_id:+v||null};
  if(!confirm(`Modifier ${ids.length} document(s) ?`))return;
  const {error}=await db.from('documents').update({...maj,updated_at:new Date().toISOString()}).in('id',ids);
  if(error)return toast('Erreur : '+error.message);
  SEL.clear();await charger();toast(ids.length+' document(s) modifié(s) ✓');liste();
}
async function grouperSite(sid){
  if(!sid||!SEL.size)return;const rows=[...SEL].filter(id=>!LIENS.some(l=>l.document_id===id&&l.site_id===sid)).map(id=>({document_id:id,site_id:sid}));
  if(rows.length){const {error}=await db.from('document_sites').insert(rows);if(error)return toast('Erreur : '+error.message);}
  await charger();toast('Ouvrage ajouté à '+SEL.size+' document(s) ✓');liste();
}
async function retirerSites(){
  if(!SEL.size||!confirm(`Retirer tous les ouvrages de ${SEL.size} document(s) ?`))return;
  const {error}=await db.from('document_sites').delete().in('document_id',[...SEL]);if(error)return toast('Erreur : '+error.message);
  await charger();toast('Ouvrages retirés ✓');liste();
}
async function supprimerSel(){
  const D=DOCS.filter(d=>SEL.has(d.id));if(!D.length)return;
  if(!confirm(`Supprimer définitivement ${D.length} document(s) ?\nLes PDF seront effacés du stockage.`))return;
  const r=await db.storage.from('documents').remove(D.map(d=>d.fichier));if(r.error)return toast('Erreur : '+r.error.message);
  const {error}=await db.from('documents').delete().in('id',D.map(d=>d.id));if(error)return toast('Erreur : '+error.message);
  SEL.clear();await charger();toast(D.length+' document(s) supprimé(s)');liste();
}
function arbreUD(){
  const P=DOCS.filter(d=>d.categorie==='plan'),nUD=id=>P.filter(d=>sitesDoc(d).some(s=>s.ud_id===id)).length,sans=P.filter(d=>!LIENS.some(l=>l.document_id===d.id)).length;
  return `<div class="card tree ${treeOpen?'open':''}"><button class="${!udSel&&!siteSel?'on':''}" onclick="udSel=null;siteSel=null;liste()">Toutes les UDI</button>
    ${sans?`<button class="${udSel===-1?'on':''}" onclick="udSel=-1;siteSel=null;liste()">Sans ouvrage <small>${sans}</small></button>`:''}
    ${UD.map(u=>{const n=nUD(u.id);if(!n&&!admin)return '';
      const S=SITES.filter(s=>s.ud_id===u.id&&LIENS.some(l=>l.site_id===s.id&&P.some(d=>d.id===l.document_id)));
      return `<button class="${udSel===u.id&&!siteSel?'on':''}" onclick="udSel=${u.id};siteSel=null;liste()">${esc(u.nom)} <small>${n}</small></button>`+

/* ── Proposition automatique de classement ── */
const MOTS=[['STAB','STAB / robinets altimétriques'],['ALTIMETRIQUE','STAB / robinets altimétriques'],['REDUCTEUR','Réducteurs de pression'],['POMPE DOSEUSE','Pompes doseuses'],['DOSEUSE','Pompes doseuses'],
 ['CHLOROMETRE','Chloromètres et analyseurs'],['ANALYSEUR','Chloromètres et analyseurs'],['TURBIDIMETRE','Chloromètres et analyseurs'],[' UV ','UV'],['ULTRAVIOLET','UV'],
 ['VENTOUSE','Ventouses'],['VANNE','Vannes'],['ROBINET VANNE','Vannes'],['VIDANGE','Vidanges'],['COMPTEUR','Compteurs'],['WOLT','Compteurs'],['DEBITMETRE','Débitmètres'],
 ['ARMOIRE','Armoires électriques'],['SCHEMA ELECTRIQUE','Armoires électriques'],['SOFREL','Télégestion (Sofrel…)'],['TELEGESTION','Télégestion (Sofrel…)'],['POTEAU INCENDIE','Poteaux incendie'],['HYDRANT','Poteaux incendie']];
const FABS=['Bayard','Savy','Cla-Val','Prominent','Grundfos','Seko','Dosatron','Itron','Sensus','Diehl','Sofrel','Lacroix','Endress','Hach','Krohne','Siemens','Pont-à-Mousson','Talis','Socla'];
async function lirePdf(f){
  if(!window.pdfjsLib)return '';
  try{const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';
    for(let i=1;i<=Math.min(pdf.numPages,2);i++){const c=await(await pdf.getPage(i)).getTextContent();t+=' '+c.items.map(x=>x.str).join(' ');}return t;}catch(e){return '';}
}
async function proposer(f){
  const nomF=f.name.replace(/\.[^.]+$/,''),texte=await lirePdf(f),N=' '+norm(nomF+' '+texte)+' ',NF=' '+norm(nomF)+' ';
  const p={titre:'',categorie:'technique',famille_id:null,fabricant:'',modele:'',sites:[],why:[]};
  // ouvrages : nom ou nom alternatif présent ; la commune et le type d'ouvrage départagent
  // le nom du fichier prime ; le texte du PDF ne sert que si le nom ne donne rien. Les noms génériques sont ignorés.
  const GEN=new Set(['RESERVOIR','CAPTAGE','STATION','SOURCE','RESEAU','FORAGE','PUITS','CHAMBRE','REGARD','DISTRIBUTION','ADDUCTION']);
  const trouve=T=>SITES.filter(s=>[s.nom,...(s.alias||[])].some(n=>{const k=norm(n);return k.length>=4&&!GEN.has(k)&&T.includes(' '+k+' ');}));
  let cand=trouve(NF);if(!cand.length&&!/RESERVOIR|CAPTAGE|STATION|CHAMBRE|FORAGE|PUITS|SOURCE/.test(NF))cand=trouve(N);   // si le nom annonce un ouvrage inconnu, on ne devine pas à partir du texte
  if(cand.length){
    const typeVoulu=/RESERVOIR/.test(NF)?'reservoir':/CAPTAGE|SOURCE/.test(NF)?'captage':/STATION/.test(NF)?'station':/CHAMBRE|REGARD/.test(NF)?'chambre':/FORAGE|PUITS/.test(NF)?'forage':null;
    let best=cand;
    if(typeVoulu){const t=best.filter(s=>s.type===typeVoulu);if(t.length)best=t;else p.why.push('⚠ aucun '+(TYPES[typeVoulu]||typeVoulu)+' de ce nom : vérifie ou crée l\'ouvrage');}
    const c=best.filter(s=>communeDans(N,s.commune));if(c.length)best=c;
    p.sites=best.slice(0,3).map(s=>s.id);p.why.unshift('ouvrage reconnu');}
  else if(/RESERVOIR|CAPTAGE|STATION|CHAMBRE|FORAGE|PUITS/.test(NF))p.why.push('⚠ ouvrage non trouvé dans la base : crée-le avec « + Nouvel ouvrage »');
  for(const [m,fam] of MOTS)if(N.includes(m.startsWith(' ')?m:' '+m)||N.includes(m)){const fa=FAM.find(x=>x.nom===fam);if(fa){p.famille_id=fa.id;p.why.push('famille « '+fam+' »');break;}}
  const fab=FABS.find(x=>N.includes(norm(x)));if(fab){p.fabricant=fab;}
  const ouvrageDansNom=/RESERVOIR|CAPTAGE|STATION|CHAMBRE|REGARD|FORAGE|PUITS/.test(NF);
  if(/PROCEDURE|MODE OPERATOIRE|CONSIGNE|FICHE REFLEXE|INSTRUCTION/.test(N))p.categorie='procedure';
  else if(/SCHEMA|PLAN|SYNOPTIQUE|IMPLANTATION/.test(NF)||ouvrageDansNom||(p.sites.length&&!fab&&!/NOTICE|MANUEL|FICHE TECHNIQUE|DOCUMENTATION/.test(N)))p.categorie='plan';
  if(/ARMOIRE|SCHEMA ELECTRIQUE/.test(N))p.categorie='plan';
  // un plan d'ouvrage cite des équipements sans en être la notice : on ne garde ni famille ni fabricant
  if(p.categorie==='plan'&&!/ARMOIRE|SCHEMA ELECTRIQUE/.test(N)){p.famille_id=null;p.fabricant='';p.why=p.why.filter(w=>!w.startsWith('famille'));p.why.push('plan d\'ouvrage');}
  if(p.famille_id&&(FAM.find(f=>f.id===p.famille_id)?.categorie||'technique')!==p.categorie)p.famille_id=null;
  const s0=SITES.find(s=>s.id===p.sites[0]);
  p.titre=p.categorie==='plan'&&s0?`${s0.type==='reservoir'?'Réservoir':s0.type==='captage'?'Captage':''} ${s0.nom} – ${s0.commune}`.trim()
    :nomF.replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim().replace(/^./,c=>c.toUpperCase());
  return p;
}

/* ── Dépôt (administrateur) ── */
const VIDES=new Set(['DE','DU','DES','LA','LE','LES','L','D','SUR','EN']);
const tok=c=>norm(c).replace(/\bSAINTE?\b/g,'ST').split(' ').filter(w=>w&&!VIDES.has(w));
function communeDans(N,commune){const n=' '+N.replace(/\bSAINTE?\b/g,'ST')+' ';const t=tok(commune);return t.length&&t.every(w=>n.includes(' '+w+' '));}
function selFam(v,on,c){return `<select onchange="${on}"><option value="">—</option>${famCat(c||'technique').filter(f=>!f.parent_id).map(r=>`<optgroup label="${esc(r.nom)}"><option value="${r.id}" ${v===r.id?'selected':''}>${esc(r.nom)} (général)</option>${FAM.filter(f=>f.parent_id===r.id).map(f=>`<option value="${f.id}" ${v===f.id?'selected':''}>${esc(f.nom)}</option>`).join('')}</optgroup>`).join('')}</select>`;}
function selSites(ids,i){return `<div>${ids.map(id=>{const s=SITES.find(x=>x.id===id);return `<span class="tag s">${esc(s.nom)} <a href="#" onclick="event.preventDefault();file[${i}].p.sites=file[${i}].p.sites.filter(x=>x!==${id});file[${i}].edit=1;dessinerDepot()" aria-label="Retirer" style="color:inherit">✕</a></span>`;}).join('')}</div>
  <select onchange="if(+this.value){file[${i}].p.sites.push(+this.value);file[${i}].edit=1;dessinerDepot()}"><option value="">+ Ajouter un ouvrage</option>${optSites(SITES.filter(s=>!ids.includes(s.id)))}</select>`;}
function deposer(){
  file=[];
  view.innerHTML=`<button class="back" onclick="location.hash=''">‹ Documentation</button>
  <div class="head"><div class="head-l">${ico}<div><h1>Déposer des documents</h1><div class="sub">PDF de 50 Mo maximum. Un classement est proposé pour chaque fichier : vérifie-le avant d'enregistrer.</div></div></div></div>
  <label class="drop" id="drop" for="fin">Glisse tes PDF ici, ou clique pour les choisir</label><input type="file" id="fin" accept="application/pdf,.pdf" multiple style="display:none" onchange="ajouter(this.files)">
  <div class="card sec" id="outils" style="display:none"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <button class="btn-l" onclick="document.getElementById('nouv').style.display='grid'">+ Nouvel ouvrage</button>
    <button class="btn-l" onclick="relancer()">Relancer les propositions</button>
    <span class="site-c">Crée les ouvrages manquants, puis relance : les fichiers que tu as déjà corrigés à la main ne sont pas modifiés.</span></div>
    <div id="nouv" style="display:none;grid-template-columns:1.2fr 1.2fr 1fr 1.6fr auto;gap:8px;margin-top:12px;align-items:end">
      <div class="fl" style="margin:0"><label>Commune</label><input id="nc" list="communes"></div>
      <div class="fl" style="margin:0"><label>Nom de l'ouvrage</label><input id="nn"></div>
      <div class="fl" style="margin:0"><label>Type</label><select id="nt">${TYPES_NOUV.map(t=>`<option value="${t}">${TYPES[t]}</option>`).join('')}</select></div>
      <div class="fl" style="margin:0"><label>Autres noms (séparés par des virgules)</label><input id="na" placeholder="facultatif"></div>
      <button class="btn-a" onclick="creerOuvrage()">Créer</button></div>
    <datalist id="communes">${[...new Set(SITES.map(s=>s.commune))].sort().map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
  <div id="liste"></div><div class="foot" id="ft" style="display:none"><button class="btn-l" onclick="location.hash=''">Annuler</button><button class="btn-a" id="bgo" onclick="envoyer()">Enregistrer</button></div>`;
  const dr=document.getElementById('drop');
  ['dragover','dragenter'].forEach(e=>dr.addEventListener(e,ev=>{ev.preventDefault();dr.classList.add('over')}));
  ['dragleave','drop'].forEach(e=>dr.addEventListener(e,ev=>{ev.preventDefault();dr.classList.remove('over')}));
  dr.addEventListener('drop',ev=>ajouter(ev.dataTransfer.files));
}
async function ajouter(fs){
  for(const f of fs){
    if(!/pdf$/i.test(f.name)){toast(f.name+' : seuls les PDF sont acceptés');continue;}
    if(f.size>52428800){toast(f.name+' : plus de 50 Mo');continue;}
    const i=file.push({f,p:null})-1;dessinerDepot();file[i].p=await proposer(f);dessinerDepot();
  }
}
function dessinerDepot(){
  document.getElementById('ft').style.display=file.length?'flex':'none';
  const o=document.getElementById('outils');if(o)o.style.display=file.length?'block':'none';
  document.getElementById('bgo').textContent=`Enregistrer ${file.length} document${file.length>1?'s':''}`;
  document.getElementById('liste').innerHTML=file.map(({f,p},i)=>`<div class="card up"><div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:10px"><b>${esc(f.name)}</b><span class="site-c">${taille(f.size)} <a href="#" onclick="event.preventDefault();file.splice(${i},1);dessinerDepot()" style="color:var(--bad)">retirer</a></span></div>
   ${!p?'<div class="site-c">Lecture du document…</div>':`
   <div class="row2"><div class="fl"><label>Titre</label><input value="${esc(p.titre)}" oninput="file[${i}].p.titre=this.value;file[${i}].edit=1"></div>
     <div class="fl"><label>Catégorie</label><select onchange="file[${i}].p.categorie=this.value;file[${i}].p.famille_id=null;file[${i}].edit=1;dessinerDepot()">${Object.entries(CATS).map(([k,l])=>`<option value="${k}" ${p.categorie===k?'selected':''}>${l}</option>`).join('')}</select></div>
     <div class="fl"><label>Famille</label>${selFam(p.famille_id,`file[${i}].p.famille_id=+this.value||null;file[${i}].edit=1`,p.categorie)}</div></div>
   <div class="row3"><div class="fl"><label>Fabricant</label><input value="${esc(p.fabricant)}" oninput="file[${i}].p.fabricant=this.value"></div>
     <div class="fl"><label>Modèle</label><input value="${esc(p.modele)}" oninput="file[${i}].p.modele=this.value"></div>
     <div class="fl"><label>Ouvrages concernés</label>${selSites(p.sites,i)}</div></div>
   ${p.why.length?`<div class="sugg">✓ Proposé automatiquement : ${p.why.join(', ')}</div>`:''}`}</div>`).join('');
}
async function envoyer(){
  if(file.some(x=>!x.p)){toast('Lecture des fichiers en cours, patiente un instant');return;}
  if(file.some(x=>!x.p.titre.trim())){toast('Chaque document doit avoir un titre');return;}
  const b=document.getElementById('bgo');b.disabled=true;let ok=0;
  for(const x of [...file]){
    b.textContent=`Envoi ${ok+1} / ${file.length}…`;
    const chemin=`${x.p.categorie}/${Date.now()}_${x.f.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9._-]+/g,'_')}`;
    const up=await db.storage.from('documents').upload(chemin,x.f,{contentType:'application/pdf'});
    if(up.error){toast(x.f.name+' : '+up.error.message);continue;}
    const {data,error}=await db.from('documents').insert({titre:x.p.titre.trim(),categorie:x.p.categorie,famille_id:x.p.famille_id,fabricant:x.p.fabricant||null,modele:x.p.modele||null,
      fichier:chemin,nom_fichier:x.f.name,taille:x.f.size}).select().single();
    if(error){await db.storage.from('documents').remove([chemin]);toast(x.f.name+' : '+error.message);continue;}
    if(x.p.sites.length)await db.from('document_sites').insert(x.p.sites.map(s=>({document_id:data.id,site_id:s})));
    ok++;file=file.filter(y=>y!==x);
  }
  await charger();toast(ok+' document(s) enregistré(s)');
  if(file.length){b.disabled=false;dessinerDepot();}else location.hash='';
}

async function relancer(){
  let n=0;for(const x of file){if(x.edit||x.id)continue;x.p=await proposer(x.f);n++;}
  dessinerDepot();toast(n+' proposition(s) recalculée(s)');
}
async function creerOuvrage(){
  const c=nc.value.trim(),n=nn.value.trim(),t=nt.value,al=na.value.split(',').map(x=>x.trim()).filter(Boolean);
  if(!c||!n){toast('Indique la commune et le nom');return;}
  const {data,error}=await db.from('sites').insert({commune:c,nom:n,type:t,alias:al,actif:true}).select().single();
  if(error){toast(error.message.includes('duplicate')?'Cet ouvrage existe déjà':'Erreur : '+error.message);return;}
  SITES.push(data);SITES.sort((a,b)=>a.nom.localeCompare(b.nom));nn.value='';na.value='';
  toast(`« ${n} » créé ✓ — clique sur « Relancer les propositions »`);dessinerDepot();
}

async function majOuvrage(id){
  const nom=document.getElementById('on'+id).value.trim(),commune=document.getElementById('oc'+id).value.trim(),alias=document.getElementById('oa'+id).value.split(',').map(x=>x.trim()).filter(Boolean),ud_id=+document.getElementById('ou'+id).value||null;

async function majDoc(id){

async function supprimerDoc(id){

  <p class="note">Une famille ne peut être supprimée que si elle ne contient ni document ni sous-famille.</p>`;
}
async function renommer(id,v){v=v.trim();if(!v)return familles();const {error}=await db.from('doc_familles').update({nom:v}).eq('id',id);if(error)return toast('Erreur : '+error.message);await charger();toast('Renommée ✓');}
async function deplacer(id,p){const {error}=await db.from('doc_familles').update({parent_id:p}).eq('id',id);if(error)return toast('Erreur : '+error.message);await charger();familles();}
async function creer(parent){const n=prompt(parent?'Nom de la sous-famille :':'Nom de la nouvelle famille :');if(!n||!n.trim())return;
  const {error}=await db.from('doc_familles').insert({nom:n.trim(),parent_id:parent,ordre:99,categorie:famCatSel});if(error)return toast('Erreur : '+error.message);await charger();familles();}
async function supprFam(id){if(!confirm('Supprimer cette famille ?'))return;const {error}=await db.from('doc_familles').delete().eq('id',id);if(error)return toast('Erreur : '+error.message);await charger();familles();}
start();
</script>
