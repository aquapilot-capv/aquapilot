<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Qualité de l'eau – Données</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="profil.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F4F1EC; --card:#FFFFFF; --line:#E7E1D8; --ink:#26221E; --mute:#7A7068;
  --acc:#B84712; --acc-2:#C2410C; --acc-soft:#FBE9DC; --acc-soft2:#F3D0B5;
  --ok:#2F7D4F; --ok-soft:#E3F1E8; --warn:#B7791F; --warn-soft:#FCF1DC; --bad:#B42318; --bad-soft:#FDE7E4;
  --font:'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0)}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;min-height:100%}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ── Charpente ── */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center}
.brand b{font-size:1rem;display:block}.brand small{font-size:.7rem;color:var(--mute);letter-spacing:.02em}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;font-size:.93rem}
.nav a:hover{background:#F7F3EE}
.nav a.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.nav svg{width:28px;height:28px;margin:-4px;flex:none}
.ic{fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.side .who{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;font-size:.82rem;color:var(--mute)}
.side .who button{background:none;border:none;color:var(--acc);font-weight:600;padding:0;margin-top:4px}
main{padding:28px 32px 60px;min-width:0}
.crumb{font-size:.82rem;color:var(--mute);margin-bottom:6px}
.crumb a{color:var(--mute);text-decoration:none}
h1{font-size:1.75rem;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:.9rem;margin-top:4px}
.head{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.head-l{display:flex;gap:14px;align-items:center}
.hico{width:56px;height:56px;border-radius:14px;flex:none}
.bnav{display:none}

/* ── Cartes ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:.85rem;font-weight:500;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.unit-sw{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.unit-sw button{border:none;background:none;padding:8px 12px;font-size:.83rem;font-weight:600;color:var(--mute)}
.unit-sw button.on{background:var(--acc);color:#fff}

/* Tableau bureau */
table{width:100%;border-collapse:collapse}
th{font-size:.75rem;font-weight:600;color:var(--mute);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);background:#FBF9F6}
th:first-child{border-top-left-radius:14px}th:last-child{border-top-right-radius:14px}
td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}tbody tr:hover{background:#FBF8F4}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.site-n{font-weight:600}.site-c{font-size:.8rem;color:var(--mute)}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}.b-mute{background:#EFEBE5;color:var(--mute)}
.list-m{display:none}

/* Détail */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi .l{font-size:.78rem;color:var(--mute);font-weight:500}
.kpi .v{font-size:1.6rem;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.8rem;color:var(--mute);margin-top:2px}
.chart-card{padding:18px 18px 10px;margin-bottom:16px}
.chart-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chart-top h2{font-size:1rem}
.pan{display:inline-flex;gap:6px;align-items:center}
.pan button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:32px}
.pan span{font-size:.85rem;font-weight:600;min-width:110px;text-align:center;font-variant-numeric:tabular-nums}
.chart-box{position:relative;height:340px}
.legend-note{font-size:.78rem;color:var(--mute);padding:6px 2px 4px}
.pts td:first-child{font-weight:500}
.back{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.88rem;margin-bottom:14px}
.note{font-size:.8rem;color:var(--mute);margin-top:12px}
.loading{padding:60px;text-align:center;color:var(--mute)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}

/* Connexion */
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.login.off{display:none}
.login .card{width:100%;max-width:360px;padding:28px}
.login h2{margin-bottom:4px}.login p{color:var(--mute);font-size:.88rem;margin-bottom:16px}
.login label{display:block;font-size:.8rem;font-weight:600;margin:10px 0 4px}
.login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:600;width:100%;margin-top:16px}
.err{color:var(--bad);font-size:.85rem;margin-top:10px;min-height:1.2em}

/* ── Mobile ── */
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  main{padding:calc(16px + env(safe-area-inset-top,0)) 16px calc(90px + env(safe-area-inset-bottom,0))}
  h1{font-size:1.4rem}.hico{width:46px;height:46px}
  .table-d{display:none}
  .list-m{display:flex;flex-direction:column;gap:10px}
  .mcard{padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;cursor:pointer}
  .mcard .big{font-size:1.25rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .mcard .meta{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--mute)}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:12px 14px}.kpi .v{font-size:1.25rem}
  .chart-box{height:260px}
  .pts-wrap{overflow-x:auto}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0));z-index:20}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--mute);text-decoration:none;font-weight:500}
  .bnav a.on{color:var(--acc)}
  .bnav svg{width:32px;height:32px;margin:-4px}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.b-blue{background:#E3EEF7;color:#2F6F9F}
.cell{display:flex;gap:6px;flex-wrap:wrap}
.lieux{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.lieux button{border:none;background:none;padding:7px 12px;font-size:.83rem;font-weight:600;color:var(--mute)}
.lieux button.on{background:var(--acc);color:#fff}
.recent td,.recent th{font-size:.84rem;padding:9px 10px}
.bars{display:flex;height:10px;border-radius:99px;overflow:hidden;background:#EFEAE3;margin-top:8px}
.bars i{display:block;height:100%}
</style>
</head>

<script>
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const db=supabase.createClient('https://xvdryqptuejenspbypvy.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2ZHJ5cXB0dWVqZW5zcGJ5cHZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NDU0ODEsImV4cCI6MjEwNjUyMTQ4MX0.PuHAhD1ipYXQeXDFsJfoxIu1AhciTk5qwU0WU5wKIhs');
const COL={vert:'#2F7D4F',orange:'#B7791F',rouge:'#B42318',bleu:'#2F6F9F'},FOND={vert:'rgba(47,125,79,.10)',orange:'rgba(183,121,31,.08)',rouge:'rgba(180,35,24,.07)',bleu:'rgba(47,111,159,.08)'};
const BADGE={vert:'b-ok',orange:'b-warn',rouge:'b-bad',bleu:'b-blue'};
let SITES=[],PTS=[],RECENT=[],zoneF=0,histo={},chart=null,win={span:2,end:null,key:null},lieuSel=null;
async function start(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){document.getElementById('login').classList.remove('off');return;}
  document.getElementById('login').classList.add('off');document.getElementById('who').textContent=session.user.email;
  await chargerProfil(db,session.user);if(niv('traitement')<1){view.innerHTML=pageSansDroit('Ton profil ne donne pas accès à ce module.');return;}
  await charger();route();
}
async function login(){er.textContent='';bl.disabled=true;const {error}=await db.auth.signInWithPassword({email:em.value.trim(),password:pw.value});bl.disabled=false;if(error){er.textContent='Email ou mot de passe incorrect.';return;}start();}
async function logout(){await db.auth.signOut();location.reload();}
pw.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
async function toutes(q){let o=[],a=0;while(true){const {data,error}=await q().range(a,a+999);if(error)throw error;o=o.concat(data);if(data.length<1000)break;a+=1000;}return o;}
const rang=n=>n==='Réseau'?2:n==='Station'?1:0;
async function charger(){
  try{
    const [s,p]=await Promise.all([toutes(()=>db.from('sites').select('*').in('type',['reservoir','dioxyde'])),toutes(()=>db.from('points').select('*').in('famille',['chlore','dioxyde']))]);
    SITES=s;PTS=p.sort((a,b)=>rang(a.nom)-rang(b.nom));
    const d0=new Date();d0.setDate(d0.getDate()-120);
    RECENT=await toutes(()=>db.from('releves_traitement').select('*').gte('date_releve',d0.toISOString().slice(0,10)).order('date_releve'));
  }catch(e){view.innerHTML=`<div class="card loading">Impossible de charger : ${esc(e.message)}</div>`;}
}
const val=(p,m)=>p.famille==='dioxyde'?m.clo2:m.chlore_libre;
function palier(p,v){if(v==null)return null;for(const [a,b,c,l] of (p.params.paliers||[]))if(v>=a&&(b==null||v<b))return {c,l};return null;}
const f=(x,d=2)=>x==null||isNaN(x)?'–':Number(x).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const dfr=d=>d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(2,4);
function chipV(p,m){if(!m)return `<span class="badge b-mute">${p.nom} –</span>`;if(m.statut==='arret')return '<span class="badge b-mute">Arrêt</span>';
  const v=val(p,m),pl=palier(p,v);return `<span class="badge ${pl?BADGE[pl.c]:'b-mute'}" title="${pl?pl.l:''}">${p.nom} ${f(v)}</span>`;}
const lastOf=p=>RECENT.filter(m=>m.point_id===p.id&&m.statut!=='douteux').pop();

window.addEventListener('hashchange',route);
function route(){const m=location.hash.match(/site=(\d+)/);m?detail(+m[1]):liste();}
function entete(t,sub,crumb){return `<div class="crumb">${crumb}</div><div class="head"><div class="head-l"><svg class="hico" viewBox="0 0 96 96"><rect width="96" height="96" rx="24" fill="url(#tile)"/><use href="#i-cl" style="color:var(--acc)"/></svg><div><h1>${t}</h1><div class="sub">${sub}</div></div></div></div>`;}

/* ── Liste : dernier relevé et part des 8 dernières semaines dans la cible ── */
function liste(){
  const L=SITES.filter(s=>s.actif&&PTS.some(p=>p.site_id===s.id)&&(!zoneF||s.zone===zoneF)).sort((a,b)=>(a.zone||9)-(b.zone||9)||a.type.localeCompare(b.type)||a.nom.localeCompare(b.nom));
  const d8=new Date();d8.setDate(d8.getDate()-56);const lim=d8.toISOString().slice(0,10);
  const row=s=>{const P=PTS.filter(p=>p.site_id===s.id),la=P.map(lastOf).filter(Boolean),dl=la.map(m=>m.date_releve).sort().pop();
    let n=0,c={vert:0,orange:0,rouge:0,bleu:0};
    for(const p of P)for(const m of RECENT)if(m.point_id===p.id&&m.date_releve>=lim&&m.statut==='mesure'){const pl=palier(p,val(p,m));if(pl){c[pl.c]++;n++;}}
    return {s,P,dl,c,n};};
  const R=L.map(row);
  view.innerHTML=entete('Qualité de l\'eau','Chlore et dioxyde : dernier relevé de chaque site et tendance des 8 dernières semaines','<a href="index.html">Accueil</a> › Données › Qualité de l\'eau')+`
  <div class="tools">${[0,1,2,3].map(z=>`<button class="chip ${zoneF===z?'on':''}" onclick="zoneF=${z};liste()">${z?'Zone '+z:'Toutes les zones'}</button>`).join('')}</div>
  <div class="card table-d"><table><thead><tr><th>Site</th><th>Zone</th><th>Dernier relevé</th><th>Valeurs</th><th style="width:220px">8 dernières semaines</th></tr></thead><tbody>
  ${R.map(({s,P,dl,c,n})=>`<tr onclick="location.hash='site=${s.id}'"><td><div class="site-n">${s.nom}</div><div class="site-c">${s.commune} · ${s.type==='dioxyde'?'dioxyde (ClO₂)':'chlore'}</div></td><td>${s.zone||'–'}</td>
    <td>${dl?dfr(dl):'–'}</td><td><div class="cell">${P.map(p=>chipV(p,lastOf(p))).join('')}</div></td>
    <td>${n?`<div class="site-c">${Math.round(c.vert/n*100)} % dans la cible</div><div class="bars">${['vert','bleu','orange','rouge'].map(k=>`<i style="width:${c[k]/n*100}%;background:${COL[k]}"></i>`).join('')}</div>`:'<span class="site-c">aucun relevé</span>'}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="list-m">${R.map(({s,P,dl,c,n})=>`<div class="card mcard" onclick="location.hash='site=${s.id}'"><div><div class="site-n">${s.nom}</div><div class="site-c">Zone ${s.zone} · ${s.type==='dioxyde'?'ClO₂':'chlore'}</div></div>
    <div class="site-c" style="text-align:right">${dl?dfr(dl):''}</div><div class="meta">${P.map(p=>chipV(p,lastOf(p))).join('')}</div>
    ${n?`<div style="grid-column:1/-1"><div class="bars">${['vert','bleu','orange','rouge'].map(k=>`<i style="width:${c[k]/n*100}%;background:${COL[k]}"></i>`).join('')}</div></div>`:''}</div>`).join('')}</div>
  <p class="note">Couleurs selon les paliers provisoires (à valider avec l'ARS) : vert = cible, bleu = élevé, orange = à surveiller, rouge = à traiter. Pour le dioxyde, la valeur affichée est le ClO₂.</p>`;
}

/* ── Détail d'un site ── */
async function detail(id){
  const s=SITES.find(x=>x.id===id);if(!s)return liste();
  const P=PTS.filter(p=>p.site_id===id);
  if(!histo[id]){view.innerHTML='<div class="loading"><div class="spin"></div>Chargement de l\'historique…</div>';
    histo[id]=await toutes(()=>db.from('releves_traitement').select('*').in('point_id',P.map(p=>p.id)).order('date_releve'));}
  const H=histo[id];
  if(!lieuSel||!P.some(p=>p.id===lieuSel))lieuSel=P[0].id;
  const dx=s.type==='dioxyde',d12=new Date();d12.setFullYear(d12.getFullYear()-1);const lim=d12.toISOString().slice(0,10);
  const stat=p=>{const v=H.filter(m=>m.point_id===p.id&&m.statut==='mesure'&&m.date_releve>=lim).map(m=>val(p,m)).filter(x=>x!=null);
    if(!v.length)return null;const c={};v.forEach(x=>{const pl=palier(p,x);if(pl)c[pl.c]=(c[pl.c]||0)+1;});const so=[...v].sort((a,b)=>a-b);
    return {n:v.length,med:so[Math.floor(so.length/2)],cible:Math.round((c.vert||0)/v.length*100),rouge:c.rouge||0};};
  const kp=(a,b,c)=>`<div class="card kpi"><div class="l">${a}</div><div class="v" style="font-size:1.35rem">${b}</div><div class="s">${c}</div></div>`;
  const recents=[...H].reverse().slice(0,12);
  view.innerHTML=`<button class="back" onclick="location.hash=''">‹ Tous les sites</button>`+
   entete(s.nom,`${s.commune} · zone ${s.zone||'–'} · ${dx?'dioxyde de chlore (ClO₂)':'chlore'} · suivi depuis ${H[0]?H[0].date_releve.slice(0,4):'–'}`,'Données › Qualité de l\'eau')+`
  <div class="kpis">${P.map(p=>{const m=H.filter(x=>x.point_id===p.id&&x.statut!=='douteux').pop(),st=stat(p),pl=m&&palier(p,val(p,m));
    return kp(p.nom+' – dernier relevé',m?(m.statut==='arret'?'Arrêt':f(val(p,m))+' <small style="font-size:.8rem;font-weight:500">mg/l</small>'):'–',m?dfr(m.date_releve)+(pl?' · '+pl.l:''):'')
     +kp(p.nom+' – sur 12 mois',st?st.cible+' % dans la cible':'–',st?`médiane ${f(st.med)} mg/l · ${st.n} relevés${st.rouge?' · '+st.rouge+' en rouge':''}`:'');}).join('')}</div>
  <div class="card chart-card"><div class="chart-top"><h2>${dx?'ClO₂':'Chlore libre'} (mg/l)</h2>
    <div class="tools" style="margin:0">${P.length>1?`<div class="lieux">${P.map(p=>`<button class="${lieuSel===p.id?'on':''}" onclick="lieuSel=${p.id};detail(${id})">Cible ${p.nom.toLowerCase()}</button>`).join('')}</div>`:''}
      ${[1,2,5,'tout'].map(n=>`<button class="chip ${win.span===n?'on':''}" onclick="win.span=${typeof n==='number'?n:"'tout'"};detail(${id})">${n==='tout'?'Tout':n+(n>1?' ans':' an')}</button>`).join('')}
      <div class="pan"><button onclick="if(win.span!=='tout'){win.end-=win.span;detail(${id})}" aria-label="Période précédente">‹</button><span id="per"></span><button onclick="if(win.span!=='tout'){win.end+=win.span;detail(${id})}" aria-label="Période suivante">›</button></div></div></div>
    <div class="chart-box"><canvas id="cv"></canvas></div>
    <div class="legend-note">Bandes de couleur : paliers du lieu sélectionné (provisoires). Les valeurs douteuses de l'historique ne sont pas tracées.</div></div>
  <div class="card pts-wrap"><table class="recent"><thead><tr><th>Date</th><th>Lieu</th><th class="num">${dx?'ClO₂':'Cl libre'}</th>${dx?'':'<th class="num">Cl total</th>'}<th class="num">Turb.</th><th class="num">T °C</th><th>Réglage / %</th><th>Agent</th><th>Observations</th></tr></thead><tbody>
  ${recents.map(m=>{const p=P.find(x=>x.id===m.point_id),pl=palier(p,val(p,m));return `<tr><td>${dfr(m.date_releve)}</td><td>${p.nom}${m.variante?' ('+esc(m.variante)+')':''}</td>
    <td class="num">${m.statut==='arret'?'Arrêt':`<span class="badge ${pl?BADGE[pl.c]:'b-mute'}">${f(val(p,m))}</span>`}</td>${dx?'':`<td class="num">${f(m.chlore_total)}</td>`}
    <td class="num">${f(m.turbidite)}</td><td class="num">${f(m.temperature,1)}</td><td>${[m.reglage,m.pourcentage!=null?m.pourcentage+' %':null].filter(Boolean).join(' · ')||'–'}</td>
    <td>${m.agent?esc(m.agent.split('@')[0]):'–'}</td><td>${m.statut==='douteux'?'<span class="badge b-mute">douteux</span> ':''}${esc(m.observations)}</td></tr>`;}).join('')}
  </tbody></table></div>`;
  dessiner(s,P,H);
}
function dessiner(s,P,H){
  if(chart)chart.destroy();
  const years=H.map(m=>+m.date_releve.slice(0,4)),y1a=Math.max(...years,new Date().getFullYear())+1,y0a=Math.min(...years,y1a-1);
  if(win.key!==s.id){win={span:2,end:Date.now(),key:s.id};}
  let t0,t1;if(win.span==='tout'){t0=Date.UTC(y0a,0,1);t1=Date.UTC(y1a,0,1);}else{t1=win.end;t0=t1-win.span*365.25*864e5;}
  document.getElementById('per').textContent=new Date(t0).toLocaleDateString('fr-FR',{month:'short',year:'numeric'})+' – '+new Date(t1).toLocaleDateString('fr-FR',{month:'short',year:'numeric'});
  const sel=P.find(p=>p.id===lieuSel),pal=sel.params.paliers||[];
  const vals=H.filter(m=>m.statut==='mesure').map(m=>val(P.find(p=>p.id===m.point_id),m)).filter(x=>x!=null);
  const ymax=Math.ceil(Math.min(Math.max(0.5,...vals.slice(-200))*1.1,2)*10)/10;
  const bandes={id:'bandes',beforeDraw(c){const {ctx,chartArea:a,scales:{y}}=c;ctx.save();for(const [lo,hi,col] of pal){const yt=y.getPixelForValue(hi==null?ymax:Math.min(hi,ymax)),yb=y.getPixelForValue(lo);if(yb<a.top)continue;ctx.fillStyle=FOND[col];ctx.fillRect(a.left,Math.max(yt,a.top),a.right-a.left,Math.min(yb,a.bottom)-Math.max(yt,a.top));}ctx.restore();}};
  const ds=P.map((p,i)=>({label:p.nom,data:H.filter(m=>m.point_id===p.id&&m.statut==='mesure'&&val(p,m)!=null).map(m=>({x:Date.parse(m.date_releve),y:Math.min(val(p,m),ymax)})).filter(o=>o.x>=t0&&o.x<t1),
    borderColor:i?'#2F6F9F':'#B84712',backgroundColor:i?'#2F6F9F':'#B84712',borderWidth:p.id===lieuSel?2.2:1.2,pointRadius:p.id===lieuSel?2.5:1.5,tension:.2}));
  chart=new Chart(document.getElementById('cv'),{type:'line',data:{datasets:ds},plugins:[bandes],
    options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'nearest',intersect:false},
      scales:{x:{type:'linear',min:t0,max:t1,grid:{color:'#EFEAE3'},ticks:{maxTicksLimit:8,callback:v=>new Date(v).toLocaleDateString('fr-FR',win.span==='tout'||win.span>2?{year:'numeric'}:{month:'short',year:'2-digit'})}},
        y:{min:0,max:ymax,title:{display:true,text:'mg/l'},grid:{color:'#EFEAE3'},ticks:{callback:v=>v.toLocaleString('fr-FR')}}},
      plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{family:'Public Sans'}}},
        tooltip:{callbacks:{title:it=>new Date(it[0].parsed.x).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}),label:c=>c.dataset.label+' : '+c.parsed.y.toLocaleString('fr-FR',{minimumFractionDigits:2})+' mg/l'}}}}});
}
start();
</script>
