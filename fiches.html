<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EC">
<title>Fiches projets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="profil.js"></script>
<script src="menu.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F4F1EC; --card:#FFFFFF; --line:#E7E1D8; --ink:#26221E; --mute:#7A7068;
  --acc:#B84712; --acc-2:#C2410C; --acc-soft:#FBE9DC; --acc-soft2:#F3D0B5;
  --ok:#2F7D4F; --ok-soft:#E3F1E8; --warn:#B7791F; --warn-soft:#FCF1DC; --bad:#B42318; --bad-soft:#FDE7E4;
  --font:'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0)}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;min-height:100%}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ── Charpente ── */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center}
.brand b{font-size:1rem;display:block}.brand small{font-size:.7rem;color:var(--mute);letter-spacing:.02em}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;font-size:.93rem}
.nav a:hover{background:#F7F3EE}
.nav a.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.nav svg{width:28px;height:28px;margin:-4px;flex:none}
.ic{fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.side .who{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;font-size:.82rem;color:var(--mute)}
.side .who button{background:none;border:none;color:var(--acc);font-weight:600;padding:0;margin-top:4px}
main{padding:28px 32px 60px;min-width:0}
.crumb{font-size:.82rem;color:var(--mute);margin-bottom:6px}
.crumb a{color:var(--mute);text-decoration:none}
h1{font-size:1.75rem;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:.9rem;margin-top:4px}
.head{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.head-l{display:flex;gap:14px;align-items:center}
.hico{width:56px;height:56px;border-radius:14px;flex:none}
.bnav{display:none}

/* ── Cartes ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:.85rem;font-weight:500;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.unit-sw{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.unit-sw button{border:none;background:none;padding:8px 12px;font-size:.83rem;font-weight:600;color:var(--mute)}
.unit-sw button.on{background:var(--acc);color:#fff}

/* Tableau bureau */
table{width:100%;border-collapse:collapse}
th{font-size:.75rem;font-weight:600;color:var(--mute);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);background:#FBF9F6}
th:first-child{border-top-left-radius:14px}th:last-child{border-top-right-radius:14px}
td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}tbody tr:hover{background:#FBF8F4}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.site-n{font-weight:600}.site-c{font-size:.8rem;color:var(--mute)}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}.b-mute{background:#EFEBE5;color:var(--mute)}
.list-m{display:none}

/* Détail */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi .l{font-size:.78rem;color:var(--mute);font-weight:500}
.kpi .v{font-size:1.6rem;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.8rem;color:var(--mute);margin-top:2px}
.chart-card{padding:18px 18px 10px;margin-bottom:16px}
.chart-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chart-top h2{font-size:1rem}
.pan{display:inline-flex;gap:6px;align-items:center}
.pan button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:32px}
.pan span{font-size:.85rem;font-weight:600;min-width:110px;text-align:center;font-variant-numeric:tabular-nums}
.chart-box{position:relative;height:340px}
.legend-note{font-size:.78rem;color:var(--mute);padding:6px 2px 4px}
.pts td:first-child{font-weight:500}
.back{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.88rem;margin-bottom:14px}
.note{font-size:.8rem;color:var(--mute);margin-top:12px}
.loading{padding:60px;text-align:center;color:var(--mute)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}

/* Connexion */
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.login.off{display:none}
.login .card{width:100%;max-width:360px;padding:28px}
.login h2{margin-bottom:4px}.login p{color:var(--mute);font-size:.88rem;margin-bottom:16px}
.login label{display:block;font-size:.8rem;font-weight:600;margin:10px 0 4px}
.login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:600;width:100%;margin-top:16px}
.err{color:var(--bad);font-size:.85rem;margin-top:10px;min-height:1.2em}

/* ── Mobile ── */
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  main{padding:calc(16px + env(safe-area-inset-top,0)) 16px calc(90px + env(safe-area-inset-bottom,0))}
  h1{font-size:1.4rem}.hico{width:46px;height:46px}
  .table-d{display:none}
  .list-m{display:flex;flex-direction:column;gap:10px}
  .mcard{padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;cursor:pointer}
  .mcard .big{font-size:1.25rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .mcard .meta{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--mute)}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:12px 14px}.kpi .v{font-size:1.25rem}
  .chart-box{height:260px}
  .pts-wrap{overflow-x:auto}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0));z-index:20}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--mute);text-decoration:none;font-weight:500}
  .bnav a.on{color:var(--acc)}
  .bnav svg{width:32px;height:32px;margin:-4px}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.btn-a{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:600;font-size:.9rem}
.btn-l{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;font-size:.88rem;color:var(--ink)}
.btn-d{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;font-size:.88rem;color:var(--bad)}
.sec{padding:18px 20px;margin-bottom:14px}
.sec h2{font-size:1rem;margin-bottom:12px;color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.fl label{display:block;font-size:.8rem;font-weight:600;margin-bottom:5px}
.fl input,.fl textarea,.fl select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.fl textarea{min-height:76px;resize:vertical}
.fl input:focus,.fl textarea:focus,.fl select:focus{outline:none;border-color:var(--acc)}
.fl{margin-bottom:12px}
.req{color:var(--bad)}
.dt{display:grid;grid-template-columns:200px 1fr;gap:6px 16px;font-size:.92rem}
@media (max-width:860px){.dt{grid-template-columns:1fr}.dt dt{margin-top:8px}}
.dt dt{color:var(--mute);font-weight:500}.dt dd{white-space:pre-wrap}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.photos .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#EFEAE3}
.photos img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.photos .x{position:absolute;top:6px;right:6px;border:none;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:26px;height:26px}
.add{border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;aspect-ratio:1;color:var(--mute);font-weight:600;font-size:.85rem;cursor:pointer;background:#fff;text-align:center;padding:8px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:70}
.lb.on{display:flex}.lb img{max-width:94vw;max-height:90vh;border-radius:8px}
.foot{position:sticky;bottom:0;background:var(--bg);padding:12px 0;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:860px){.foot{bottom:calc(64px + env(safe-area-inset-bottom,0));flex-wrap:nowrap}.foot button{flex:1;padding:12px 8px}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:.9rem;font-weight:500;transition:.2s;z-index:80;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
@media print{.side,.bnav,.back,.head button,.foot{display:none!important}.shell{display:block}main{padding:0}.card{break-inside:avoid;border-color:#ccc}body{background:#fff}}
</style>
</head>

  <symbol id="i-pz" viewBox="0 0 96 96"><path d="M24 38.6667H42M54 38.6667H72M46.8 28V61.3333M46.8 49.3333H52.8M24 60C28 55.5556 32 55.5556 36 60M57.6 60C61.6 55.5556 66.4 55.5556 72 60M24 72C28.8 67.5556 33.6 67.5556 38.4 72M57.6 72C62.4 67.5556 67.2 67.5556 72 72M42 24H54V68H42V24Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <linearGradient id="tile" x1="0" y1="0" x2="96" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF1E5"/><stop offset="1" stop-color="#F3D0B5"/></linearGradient>
</svg>

<div class="login off" id="login">
  <div class="card">
    <h2>Connexion</h2><p>Accès réservé aux agents du service.</p>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username">
    <label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn" id="bl" onclick="login()">Se connecter</button>
    <div class="err" id="er"></div>
  </div>
</div>

<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 3s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z" fill="none" stroke="#fff" stroke-width="1.8"/></svg></div>
      <div><b>AquaPilot</b><small>Eau potable</small></div>
    </div>
    <nav class="nav" id="sidenav"></nav>
    <div class="who"><span id="who"></span><br><a href="compte.html" style="color:var(--acc);font-weight:600;text-decoration:none">Mon compte</a> · <button onclick="logout()">Se déconnecter</button></div>
  </aside>

  <main>
    <div id="view"><div class="loading"><div class="spin"></div>Chargement des fiches…</div></div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div class="lb" id="lb" onclick="this.classList.remove('on')"><img id="lbi" alt=""></div>
<nav class="bnav" id="bnav"></nav>

<script>
const db=supabase.createClient('https://xvdryqptuejenspbypvy.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2ZHJ5cXB0dWVqZW5zcGJ5cHZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NDU0ODEsImV4cCI6MjEwNjUyMTQ4MX0.PuHAhD1ipYXQeXDFsJfoxIu1AhciTk5qwU0WU5wKIhs');
/* Structure de la fiche : une seule définition pour le formulaire, la fiche et l'export */
const SECTIONS=[
 ['1. Identification',[['nom_projet','Nom du projet','text',1],['ref_interne','Référence interne'],['service','Service / unité'],['responsable','Responsable du projet'],['date_ouverture','Date d\'ouverture','date'],['statut','Statut','statut']]],
 ['2. Contexte',[['origine_demande','Origine de la demande','area'],['probleme','Problème / besoin identifié','area'],['enjeux','Enjeux (qualité, sécurité, conformité, continuité, environnement)','area']]],
 ['3. Objectifs',[['objectif_principal','Objectif principal','area'],['objectifs_secondaires','Objectifs secondaires','area']]],
 ['4. Portée',[['perimetre_inclus','Périmètre inclus','area'],['perimetre_exclu','Périmètre exclu','area'],['contraintes','Contraintes identifiées','area']]],
 ['5. Parties prenantes',[['parties_internes','Internes','area'],['parties_externes','Externes','area'],['utilisateurs','Utilisateurs impactés','area']]],
 ['6. Livrables attendus',[['livrables','Livrables','area']]],
 ['7. Planning prévisionnel',[['etapes_cles','Étapes clés','area'],['date_fin_estimee','Date de fin estimée','date']]],
 ['8. Ressources nécessaires',[['ressources_mat','Matérielles','area'],['ressources_hum','Humaines','area'],['budget','Budget']]],
 ['9. Analyse des risques',[['risques','Risques identifiés','area'],['impact','Impact','choix',0,['Faible','Modéré','Élevé','Critique']],['probabilite','Probabilité','choix',0,['Faible','Moyenne','Élevée']],['mesures_preventives','Mesures préventives','area']]],
 ['10. Indicateurs de suivi',[['indicateurs','Indicateurs de performance','area'],['frequence_suivi','Fréquence de suivi']]],
 ['11. Validation',[['responsable_validation','Responsable de validation'],['date_validation','Date de validation','date']]]];
const CHAMPS=SECTIONS.flatMap(s=>s[1]);
const STATUTS={'En cours':'b-ok','Suspendu':'b-warn','Clôturé':'b-mute'};
let ME=null,FICHES=[],filtre='En cours',rech='',photos=[],saving=false;
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dfr=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'–';
const ph=f=>{try{return f.photos?JSON.parse(f.photos):[]}catch(e){return []}};
const peutEditer=f=>niv('projets')>=3||(niv('projets')>=2&&f.created_by===ME.id);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600);}

async function start(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){document.getElementById('login').classList.remove('off');return;}
  document.getElementById('login').classList.add('off');document.getElementById('who').textContent=session.user.email;
  ME=session.user;await chargerProfil(db,ME);montrerMenu('projets');if(niv('projets')<1){view.innerHTML=pageSansDroit('Ton profil ne donne pas accès aux fiches projets.');return;}
  await charger();route();
}
async function login(){er.textContent='';bl.disabled=true;const {error}=await db.auth.signInWithPassword({email:em.value.trim(),password:pw.value});bl.disabled=false;if(error){er.textContent='Email ou mot de passe incorrect.';return;}start();}
async function logout(){await db.auth.signOut();location.reload();}
pw.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
async function charger(){const {data,error}=await db.from('fiches').select('*').order('date_ouverture',{ascending:false});if(error){view.innerHTML=`<div class="card loading">Chargement impossible : ${esc(error.message)}</div>`;return;}FICHES=data||[];}

window.addEventListener('hashchange',route);
function route(){const h=location.hash;let m;
  if(h==='#nouvelle')return formulaire(null);
  if(m=h.match(/^#modifier=(\d+)/))return formulaire(+m[1]);
  if(m=h.match(/^#fiche=(\d+)/))return fiche(+m[1]);
  liste();}
const ico=`<svg class="hico" viewBox="0 0 96 96"><rect width="96" height="96" rx="24" fill="url(#tile)"/><use href="#i-fp" style="color:var(--acc)"/></svg>`;

/* ── Liste ── */
function liste(){
  let L=FICHES.filter(f=>filtre==='Toutes'||f.statut===filtre);
  if(rech){const r=rech.toLowerCase();L=L.filter(f=>CHAMPS.some(([k])=>String(f[k]??'').toLowerCase().includes(r)));}
  const n=s=>FICHES.filter(f=>s==='Toutes'||f.statut===s).length;
  view.innerHTML=`<div class="crumb"><a href="index.html">Accueil</a> › Fiches projets</div>
  <div class="head"><div class="head-l">${ico}<div><h1>Fiches projets</h1><div class="sub">${FICHES.length} fiche${FICHES.length>1?'s':''} · partagées par l'équipe</div></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn-l" onclick="exporter()">Exporter vers Calc</button>${niv('projets')>=2?`<button class="btn-a" onclick="location.hash='nouvelle'">+ Nouvelle fiche</button>`:''}</div></div>
  <div class="tools"><input class="search" placeholder="Rechercher dans toutes les fiches" value="${esc(rech)}" oninput="rech=this.value;liste();const i=document.querySelector('.search');i.focus();i.setSelectionRange(i.value.length,i.value.length)">
    ${['En cours','Suspendu','Clôturé','Toutes'].map(s=>`<button class="chip ${filtre===s?'on':''}" onclick="filtre='${s}';liste()">${s} (${n(s)})</button>`).join('')}</div>
  ${!L.length?`<div class="card loading">Aucune fiche ${filtre!=='Toutes'?'« '+filtre.toLowerCase()+' »':''}${rech?' pour cette recherche':''}.</div>`:`
  <div class="card table-d"><table><thead><tr><th>Projet</th><th>Responsable</th><th>Ouverture</th><th>Fin estimée</th><th>Statut</th></tr></thead><tbody>
  ${L.map(f=>`<tr onclick="location.hash='fiche=${f.id}'"><td><div class="site-n">${esc(f.nom_projet)}</div><div class="site-c">${esc([f.ref_interne,f.service].filter(Boolean).join(' · '))}</div></td>
    <td>${esc(f.responsable||'–')}</td><td>${dfr(f.date_ouverture)}</td><td>${dfr(f.date_fin_estimee)}</td><td><span class="badge ${STATUTS[f.statut]||'b-mute'}">${esc(f.statut)}</span></td></tr>`).join('')}
  </tbody></table></div>
  <div class="list-m">${L.map(f=>`<div class="card mcard" onclick="location.hash='fiche=${f.id}'"><div><div class="site-n">${esc(f.nom_projet)}</div><div class="site-c">${esc(f.responsable||'')}</div></div>
    <div><span class="badge ${STATUTS[f.statut]||'b-mute'}">${esc(f.statut)}</span></div><div class="meta">${esc(f.ref_interne||'')} ${f.date_ouverture?'· ouvert le '+dfr(f.date_ouverture):''}</div></div>`).join('')}</div>`}`;
}

/* ── Consultation ── */
function fiche(id){
  const f=FICHES.find(x=>x.id===id);if(!f)return liste();
  const P=ph(f);
  view.innerHTML=`<button class="back" onclick="location.hash=''">‹ Toutes les fiches</button>
  <div class="crumb">Fiches projets</div>
  <div class="head"><div class="head-l">${ico}<div><h1>${esc(f.nom_projet)}</h1><div class="sub"><span class="badge ${STATUTS[f.statut]||'b-mute'}">${esc(f.statut)}</span> ${esc(f.ref_interne||'')} · mise à jour le ${dfr((f.updated_at||'').slice(0,10))}</div></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${peutEditer(f)?`<button class="btn-d" onclick="supprimer(${f.id})">Supprimer</button>`:''}<button class="btn-l" onclick="window.print()">Imprimer</button>${peutEditer(f)?`<button class="btn-a" onclick="location.hash='modifier=${f.id}'">Modifier</button>`:''}</div></div>
  ${P.length?`<div class="card sec"><h2>Photos</h2><div class="photos">${P.map(p=>`<div class="ph"><img src="${p}" alt="Photo du projet" onclick="lbi.src=this.src;lb.classList.add('on')"></div>`).join('')}</div></div>`:''}
  ${SECTIONS.map(([t,ch])=>{const rows=ch.filter(([k])=>f[k]!=null&&f[k]!=='');if(!rows.length)return '';
    return `<div class="card sec"><h2>${t}</h2><dl class="dt">${rows.map(([k,l,ty])=>`<dt>${l}</dt><dd>${ty==='date'?dfr(f[k]):esc(f[k])}</dd>`).join('')}</dl></div>`;}).join('')}`;
}

/* ── Formulaire ── */
function champ([k,l,ty,req,opts],v){
  const id='f_'+k,val=esc(v??'');
  let inp;
  if(ty==='area')inp=`<textarea id="${id}">${val}</textarea>`;
  else if(ty==='date')inp=`<input id="${id}" type="date" value="${val}">`;
  else if(ty==='statut')inp=`<select id="${id}">${Object.keys(STATUTS).map(s=>`<option ${v===s?'selected':''}>${s}</option>`).join('')}</select>`;
  else if(ty==='choix')inp=`<select id="${id}"><option value="">—</option>${opts.map(s=>`<option ${v===s?'selected':''}>${s}</option>`).join('')}</select>`;
  else inp=`<input id="${id}" value="${val}">`;
  return `<div class="fl"><label for="${id}">${l}${req?' <span class="req">*</span>':''}</label>${inp}</div>`;
}
function formulaire(id){
  if(id?!peutEditer(FICHES.find(x=>x.id===id)||{}):niv('projets')<2){view.innerHTML=pageSansDroit('Tu ne peux pas modifier cette fiche.');return;}
  const f=id?FICHES.find(x=>x.id===id):{statut:'En cours',date_ouverture:new Date().toISOString().slice(0,10)};
  if(id&&!f)return liste();
  photos=ph(f);
  view.innerHTML=`<button class="back" onclick="history.back()">‹ Annuler</button>
  <div class="crumb">Fiches projets</div><div class="head"><div class="head-l">${ico}<div><h1>${id?'Modifier la fiche':'Nouvelle fiche projet'}</h1><div class="sub">${id?esc(f.nom_projet):'Seul le nom du projet est obligatoire'}</div></div></div></div>
  <div class="card sec"><h2>Photos (3 maximum)</h2><div class="photos" id="phs"></div>
    <input type="file" id="pin" accept="image/*" multiple style="display:none" onchange="ajouterPhotos(this)"></div>
  ${SECTIONS.map(([t,ch])=>`<div class="card sec"><h2>${t}</h2><div class="${ch.length>2&&ch.every(c=>c[2]!=='area')?'grid2':''}">${ch.map(c=>champ(c,f[c[0]])).join('')}</div></div>`).join('')}
  <div class="foot"><button class="btn-l" onclick="history.back()">Annuler</button><button class="btn-a" id="bsv" onclick="enregistrer(${id||'null'})">${id?'Enregistrer les modifications':'Créer la fiche'}</button></div>`;
  dessinerPhotos();
}
function dessinerPhotos(){
  phs.innerHTML=photos.map((p,i)=>`<div class="ph"><img src="${p}" alt="Photo ${i+1}" onclick="lbi.src=this.src;lb.classList.add('on')"><button class="x" onclick="photos.splice(${i},1);dessinerPhotos()" aria-label="Retirer la photo">✕</button></div>`).join('')
    +(photos.length<3?`<label class="add" for="pin">+ Ajouter<br>une photo</label>`:'');
}
function ajouterPhotos(inp){
  const fs=[...inp.files].slice(0,3-photos.length);
  fs.forEach(file=>{const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const M=900;let w=im.width,h=im.height;if(w>M||h>M){const k=M/Math.max(w,h);w*=k;h*=k;}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);photos.push(c.toDataURL('image/jpeg',0.7));dessinerPhotos();};im.src=e.target.result;};r.readAsDataURL(file);});
  inp.value='';
}
async function enregistrer(id){
  if(saving)return;
  const d={};for(const [k,,ty] of CHAMPS){let v=document.getElementById('f_'+k).value;v=typeof v==='string'?v.trim():v;d[k]=v===''?null:v;}
  if(!d.nom_projet){toast('Le nom du projet est obligatoire');document.getElementById('f_nom_projet').focus();return;}
  d.photos=JSON.stringify(photos);d.updated_at=new Date().toISOString();
  saving=true;bsv.disabled=true;bsv.textContent='Enregistrement…';
  const r=id?await db.from('fiches').update(d).eq('id',id).select():await db.from('fiches').insert([d]).select();
  saving=false;
  if(r.error){bsv.disabled=false;bsv.textContent='Réessayer';toast('Erreur : '+r.error.message);return;}
  await charger();toast(id?'Fiche mise à jour ✓':'Fiche créée ✓');location.hash='fiche='+(id||r.data[0].id);
}
async function supprimer(id){
  const f=FICHES.find(x=>x.id===id);
  if(!confirm(`Supprimer définitivement la fiche « ${f.nom_projet} » ?`))return;
  const {error}=await db.from('fiches').delete().eq('id',id);
  if(error){toast('Erreur : '+error.message);return;}
  await charger();toast('Fiche supprimée');location.hash='';
}
/* ── Export Calc : une ligne par projet, une colonne par rubrique ── */
function exporter(){
  if(!FICHES.length){toast('Aucune fiche à exporter');return;}
  const rows=FICHES.map(f=>{const o={};for(const [k,l,ty] of CHAMPS)o[l]=ty==='date'?(f[k]||''):(f[k]??'');o['Nombre de photos']=ph(f).length;o['Mise à jour']=(f.updated_at||'').slice(0,10);return o;});
  const wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=Object.keys(rows[0]).map(k=>({wch:Math.min(40,Math.max(12,k.length+2))}));
  XLSX.utils.book_append_sheet(wb,ws,'Fiches projets');
  XLSX.writeFile(wb,`fiches-projets-${new Date().toISOString().slice(0,10)}.ods`,{bookType:'ods'});
  toast(FICHES.length+' fiche(s) exportée(s)');
}
start();
</script>
</body>
</html>
