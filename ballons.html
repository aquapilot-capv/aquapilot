<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EC">
<title>Ballons – Maintenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="profil.js"></script>

<style>
:root{
  --bg:#F4F1EC; --card:#FFFFFF; --line:#E7E1D8; --ink:#26221E; --mute:#7A7068;
  --acc:#B84712; --acc-2:#C2410C; --acc-soft:#FBE9DC; --acc-soft2:#F3D0B5;
  --ok:#2F7D4F; --ok-soft:#E3F1E8; --warn:#B7791F; --warn-soft:#FCF1DC; --bad:#B42318; --bad-soft:#FDE7E4;
  --font:'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0)}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;min-height:100%}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ── Charpente ── */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center}
.brand b{font-size:1rem;display:block}.brand small{font-size:.7rem;color:var(--mute);letter-spacing:.02em}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;font-size:.93rem}
.nav a:hover{background:#F7F3EE}
.nav a.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.nav svg{width:28px;height:28px;margin:-4px;flex:none}
.ic{fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.side .who{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;font-size:.82rem;color:var(--mute)}
.side .who button{background:none;border:none;color:var(--acc);font-weight:600;padding:0;margin-top:4px}
main{padding:28px 32px 60px;min-width:0}
.crumb{font-size:.82rem;color:var(--mute);margin-bottom:6px}
.crumb a{color:var(--mute);text-decoration:none}
h1{font-size:1.75rem;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:.9rem;margin-top:4px}
.head{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.head-l{display:flex;gap:14px;align-items:center}
.hico{width:56px;height:56px;border-radius:14px;flex:none}
.bnav{display:none}

/* ── Cartes ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:inherit}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:.85rem;font-weight:500;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.unit-sw{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.unit-sw button{border:none;background:none;padding:8px 12px;font-size:.83rem;font-weight:600;color:var(--mute)}
.unit-sw button.on{background:var(--acc);color:#fff}

/* Tableau bureau */
table{width:100%;border-collapse:collapse}
th{font-size:.75rem;font-weight:600;color:var(--mute);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);background:#FBF9F6}
th:first-child{border-top-left-radius:14px}th:last-child{border-top-right-radius:14px}
td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}tbody tr:hover{background:#FBF8F4}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.site-n{font-weight:600}.site-c{font-size:.8rem;color:var(--mute)}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}.b-mute{background:#EFEBE5;color:var(--mute)}
.list-m{display:none}

/* Détail */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi .l{font-size:.78rem;color:var(--mute);font-weight:500}
.kpi .v{font-size:1.6rem;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.8rem;color:var(--mute);margin-top:2px}
.chart-card{padding:18px 18px 10px;margin-bottom:16px}
.chart-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chart-top h2{font-size:1rem}
.pan{display:inline-flex;gap:6px;align-items:center}
.pan button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:32px}
.pan span{font-size:.85rem;font-weight:600;min-width:110px;text-align:center;font-variant-numeric:tabular-nums}
.chart-box{position:relative;height:340px}
.legend-note{font-size:.78rem;color:var(--mute);padding:6px 2px 4px}
.pts td:first-child{font-weight:500}
.back{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.88rem;margin-bottom:14px}
.note{font-size:.8rem;color:var(--mute);margin-top:12px}
.loading{padding:60px;text-align:center;color:var(--mute)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}

/* Connexion */
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.login.off{display:none}
.login .card{width:100%;max-width:360px;padding:28px}
.login h2{margin-bottom:4px}.login p{color:var(--mute);font-size:.88rem;margin-bottom:16px}
.login label{display:block;font-size:.8rem;font-weight:600;margin:10px 0 4px}
.login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:600;width:100%;margin-top:16px}
.err{color:var(--bad);font-size:.85rem;margin-top:10px;min-height:1.2em}

/* ── Mobile ── */
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  main{padding:calc(16px + env(safe-area-inset-top,0)) 16px calc(90px + env(safe-area-inset-bottom,0))}
  h1{font-size:1.4rem}.hico{width:46px;height:46px}
  .table-d{display:none}
  .list-m{display:flex;flex-direction:column;gap:10px}
  .mcard{padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;cursor:pointer}
  .mcard .big{font-size:1.25rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .mcard .meta{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--mute)}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:12px 14px}.kpi .v{font-size:1.25rem}
  .chart-box{height:260px}
  .pts-wrap{overflow-x:auto}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0));z-index:20}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--mute);text-decoration:none;font-weight:500}
  .bnav a.on{color:var(--acc)}
  .bnav svg{width:32px;height:32px;margin:-4px}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.btn-a{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:600;font-size:.9rem}
.btn-l{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;font-size:.88rem;color:var(--ink)}
.btn-d{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;font-size:.88rem;color:var(--bad)}
.sec{padding:18px 20px;margin-bottom:14px}
.sec h2{font-size:1rem;margin-bottom:12px;color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.fl label{display:block;font-size:.8rem;font-weight:600;margin-bottom:5px}
.fl input,.fl textarea,.fl select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.fl textarea{min-height:76px;resize:vertical}
.fl input:focus,.fl textarea:focus,.fl select:focus{outline:none;border-color:var(--acc)}
.fl{margin-bottom:12px}
.req{color:var(--bad)}
.dt{display:grid;grid-template-columns:200px 1fr;gap:6px 16px;font-size:.92rem}
@media (max-width:860px){.dt{grid-template-columns:1fr}.dt dt{margin-top:8px}}
.dt dt{color:var(--mute);font-weight:500}.dt dd{white-space:pre-wrap}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.photos .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#EFEAE3}
.photos img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.photos .x{position:absolute;top:6px;right:6px;border:none;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:26px;height:26px}
.add{border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;aspect-ratio:1;color:var(--mute);font-weight:600;font-size:.85rem;cursor:pointer;background:#fff;text-align:center;padding:8px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:70}
.lb.on{display:flex}.lb img{max-width:94vw;max-height:90vh;border-radius:8px}
.foot{position:sticky;bottom:0;background:var(--bg);padding:12px 0;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:860px){.foot{bottom:calc(64px + env(safe-area-inset-bottom,0));flex-wrap:nowrap}.foot button{flex:1;padding:12px 8px}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:.9rem;font-weight:500;transition:.2s;z-index:80;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
@media print{.side,.bnav,.back,.head button,.foot{display:none!important}.shell{display:block}main{padding:0}.card{break-inside:avoid;border-color:#ccc}body{background:#fff}}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kv div{background:#FBF8F4;border-radius:10px;padding:10px 12px}.kv small{display:block;color:var(--mute);font-size:.74rem}.kv b{font-size:1.05rem}
.calc{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.res{background:var(--acc-soft);border-radius:12px;padding:14px 16px;margin:6px 0 10px}.res b{font-size:1.5rem;color:var(--acc)}
.b-blue{background:#E3EEF7;color:#2F6F9F}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gal .ph{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#EFEAE3}
.gal img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.gal .x{position:absolute;top:6px;right:6px;border:none;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:26px;height:26px}
.warn2{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.86rem;margin:8px 0}
</style>
</head>

<script>
const db=supabase.createClient('https://xvdryqptuejenspbypvy.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2ZHJ5cXB0dWVqZW5zcGJ5cHZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NDU0ODEsImV4cCI6MjEwNjUyMTQ4MX0.PuHAhD1ipYXQeXDFsJfoxIu1AhciTk5qwU0WU5wKIhs');

async function charger(){
  const r=await Promise.all([db.from('ballons').select('*').order('site_libelle'),db.from('ballon_controles').select('*').order('date_controle'),
    db.from('ballon_photos').select('*').order('created_at'),db.from('sites').select('id,nom,commune,type').order('nom')]);
  const e=r.find(x=>x.error);if(e){view.innerHTML=`<div class="card loading">Chargement impossible : ${esc(e.error.message)}<br><small>Le script 19_ballons.sql a-t-il été lancé ?</small></div>`;throw e.error;}
  [B,C,PH,SITES]=r.map(x=>x.data||[]);
}

/* ── Conformité : tolérance ±10 % avec un minimum de 0,2 bar ── */
const tol=ref=>Math.max(0.2,0.1*ref);
function conformite(mes,ref){
  if(mes==null||ref==null)return {c:'b-mute',l:'Pas de référence'};
  const d=mes-ref,t=tol(ref);
  if(Math.abs(d)<=t)return {c:'b-ok',l:'Conforme'};
  return d<0?{c:'b-bad',l:`Sous-gonflé (${f(d,2)} bar)`}:{c:'b-warn',l:`Sur-gonflé (+${f(d,2)} bar)`};
}
const dernier=id=>C.filter(c=>c.ballon_id===id).slice(-1)[0];
function aControler(b){const d=dernier(b.id);if(!d)return true;if((Date.now()-Date.parse(d.date_controle))>365*864e5)return true;
  const v=d.regonfle&&d.pression_apres!=null?d.pression_apres:d.pression_mesuree;return conformite(v,d.pression_reference??b.pression_preconisee).c==='b-bad';}

window.addEventListener('hashchange',route);
function route(){const m=location.hash.match(/b=(\d+)/);m?fiche(+m[1]):liste();}
const ico=`<svg class="hico" viewBox="0 0 96 96"><rect width="96" height="96" rx="24" fill="url(#tile)"/><g class="ic" style="color:var(--acc);stroke-width:2.6"><use href="#ic-antibelier"/></g></svg>`;

/* ── Liste ── */
function liste(){
  let L=B.filter(b=>b.actif!==false&&(filtre==='tous'||b.fonction===filtre));
  if(aCtrl)L=L.filter(aControler);
  if(rech){const r=rech.toLowerCase();L=L.filter(b=>[b.site_libelle,b.commune,b.marque,b.numero_serie].join(' ').toLowerCase().includes(r));}
  const n=k=>B.filter(b=>k==='tous'||b.fonction===k).length;
  view.innerHTML=`<div class="crumb"><a href="index.html">Accueil</a> › <a href="index.html#maintenance">Maintenance</a> › Ballons</div>
  <div class="head"><div class="head-l">${ico}<div><h1>Ballons</h1><div class="sub">${B.length} ballons · anti-béliers et hydrophores · ${B.filter(aControler).length} à contrôler</div></div></div></div>
  <div class="tools"><input class="search" id="rch" placeholder="Rechercher un site, une commune, un n° de série" value="${esc(rech)}" oninput="rech=this.value;liste();const i=document.getElementById('rch');i.focus();i.setSelectionRange(i.value.length,i.value.length)">
    <button class="chip ${aCtrl?'on':''}" onclick="aCtrl=!aCtrl;liste()">À contrôler</button></div>
  <div class="tools">${[['tous','Tous'],...Object.entries(FONCTIONS)].map(([k,l])=>`<button class="chip ${filtre===k?'on':''}" onclick="filtre='${k}';liste()">${l} (${n(k)})</button>`).join('')}</div>
  <div class="card table-d"><table><thead><tr><th>Site</th><th>Fonction</th><th class="num">Volume</th><th class="num">Gonflage préconisé</th><th>Dernier contrôle</th><th class="num">Photos</th></tr></thead><tbody>
  ${L.map(b=>{const d=dernier(b.id),v=d?(d.regonfle&&d.pression_apres!=null?d.pression_apres:d.pression_mesuree):null,co=d?conformite(d.pression_mesuree,d.pression_reference??b.pression_preconisee):null;
    return `<tr onclick="location.hash='b=${b.id}'"><td><div class="site-n">${esc(b.site_libelle)}${b.repere&&b.repere!=='1'?' · '+esc(b.repere):''}</div><div class="site-c">${esc(b.commune||'')} · ${esc(b.marque||'')} ${esc(b.numero_serie||'')}</div></td>
    <td><span class="badge ${b.fonction==='a_preciser'?'b-warn':'b-mute'}">${FONCTIONS[b.fonction]}</span></td><td class="num">${f(b.volume_l,0)} l</td>
    <td class="num">${b.pression_preconisee!=null?'<b>'+f(b.pression_preconisee)+' bar</b><div class="site-c">'+(b.source_preconisation==='fabricant'?'fabricant':b.source_preconisation==='formation'?'estimation':SOURCES[b.source_preconisation]||'')+'</div>':'<span class="site-c">à définir</span>'}</td>
    <td>${d?`${dfr(d.date_controle)} · ${f(d.pression_mesuree)} bar <span class="badge ${co.c}">${co.l}</span>`:'<span class="badge b-warn">Jamais contrôlé</span>'}</td>
    <td class="num">${PH.filter(p=>p.ballon_id===b.id).length||'–'}</td></tr>`;}).join('')}
  </tbody></table></div>
  <div class="list-m">${L.map(b=>{const d=dernier(b.id),co=d?conformite(d.pression_mesuree,d.pression_reference??b.pression_preconisee):null;
    return `<div class="card mcard" onclick="location.hash='b=${b.id}'"><div><div class="site-n">${esc(b.site_libelle)}</div><div class="site-c">${esc(b.commune||'')} · ${f(b.volume_l,0)} l</div></div>
    <div class="big" style="font-size:1rem">${b.pression_preconisee!=null?f(b.pression_preconisee)+' bar':'–'}</div>
    <div class="meta">${d?dfr(d.date_controle)+' <span class="badge '+co.c+'">'+co.l+'</span>':'<span class="badge b-warn">Jamais contrôlé</span>'}</div></div>`;}).join('')}</div>
  <p class="note">« À contrôler » : jamais contrôlé, dernier contrôle de plus d'un an, ou ballon trouvé sous-gonflé. Tolérance : ± 10 % de la pression préconisée, avec un minimum de 0,2 bar.</p>`;
}

/* ── Fiche d'un ballon ── */
async function fiche(id){
  const b=B.find(x=>x.id===id);if(!b)return liste();
  const site=SITES.find(s=>s.id===b.site_id),gest=niv('maintenance')>=3,saisie=niv('maintenance')>=2;
  const H=C.filter(c=>c.ballon_id===id).slice().reverse(),P=PH.filter(p=>p.ballon_id===id);
  const psv=b.ps_bar&&b.volume_l?b.ps_bar*b.volume_l:null;
  view.innerHTML=`<button class="back" onclick="location.hash=''">‹ Tous les ballons</button>
  <div class="crumb">Maintenance › Ballons</div>
  <div class="head"><div class="head-l">${ico}<div><h1>${esc(b.site_libelle)}${b.repere&&b.repere!=='1'?' · '+esc(b.repere):''}</h1><div class="sub">${esc(b.commune||'')}${site?' · ouvrage : '+esc(site.nom):''} · <span class="badge ${b.fonction==='a_preciser'?'b-warn':'b-mute'}">${FONCTIONS[b.fonction]}</span></div></div></div>
    ${gest?`<button class="btn-l" onclick="editer(${id})">Modifier la fiche</button>`:''}</div>

  <div class="card sec"><h2>Identité</h2><div class="kv">
    ${[['Marque',b.marque],['N° de série',b.numero_serie],['Volume',b.volume_l!=null?f(b.volume_l,0)+' l':null],['Pression maxi (PS)',b.ps_bar!=null?f(b.ps_bar)+' bar':null],['Pression d\'épreuve',b.pt_bar!=null?f(b.pt_bar)+' bar':null],
      ['Pression de service',b.pression_service!=null?f(b.pression_service)+' bar':null],...(b.fonction==='hydrophore'?[['Pressostat bas / haut',b.pressostat_bas!=null?f(b.pressostat_bas)+' / '+f(b.pressostat_haut)+' bar':null]]:[]),
      ['Gaz',b.gaz],['Mise en service',b.annee_service],['Épreuve',dfr(b.date_epreuve)],['Catégorie',b.categorie_desp],['PS × V',psv?f(psv,0)+' bar·l':null],['Prochaine échéance',b.prochaine_echeance?dfr(b.prochaine_echeance):null]]
      .map(([k,v])=>`<div><small>${k}</small><b>${v==null||v===''||v==='–'?'<span class="site-c">non renseigné</span>':esc(v)}</b></div>`).join('')}</div>
    ${b.commentaires?`<p class="note">${esc(b.commentaires)}</p>`:''}
    ${b.fonction==='a_preciser'?'<div class="warn2">La fonction de ce ballon est à préciser : elle détermine la façon de calculer son gonflage.</div>':''}</div>

  <div class="card sec"><h2>Gonflage préconisé</h2>
    <div class="res"><small class="site-c">À mesurer ballon vidé côté eau</small><br><b>${b.pression_preconisee!=null?f(b.pression_preconisee)+' bar':'non défini'}</b>
      ${b.source_preconisation?`<span class="badge ${b.source_preconisation==='fabricant'?'b-ok':'b-warn'}" style="margin-left:8px">${SOURCES[b.source_preconisation]}</span>`:''}
      ${b.pression_preconisee!=null?`<div class="site-c">Conforme entre ${f(b.pression_preconisee-tol(b.pression_preconisee))} et ${f(b.pression_preconisee+tol(b.pression_preconisee))} bar</div>`:''}</div>
    ${outilCalcul(b,gest)}</div>

  ${saisie?`<div class="card sec"><h2>Nouveau contrôle</h2><div class="grid2">
    <div class="fl"><label for="c_d">Date</label><input id="c_d" type="date" value="${today()}" max="${today()}"></div>
    <div class="fl"><label for="c_m">Pression mesurée (bar), ballon vidé</label><input id="c_m" inputmode="decimal" oninput="apercu(${id})"></div>
    <div class="fl"><label><input type="checkbox" id="c_r" style="width:auto;margin-right:6px" onchange="document.getElementById('c_ap').style.display=this.checked?'block':'none'"> Ballon regonflé</label><div id="c_ap" style="display:none;margin-top:6px"><input id="c_a" inputmode="decimal" placeholder="Pression après regonflage"></div></div>
    <div class="fl"><label for="c_v">État de la vessie</label><select id="c_v"><option value="">—</option><option value="ok">Bon</option><option value="a_surveiller">À surveiller</option><option value="hs">Hors service</option></select></div></div>
    <div id="c_ok"></div>
    <div class="fl"><label for="c_o">Observations</label><textarea id="c_o" placeholder="Fuite à la valve, manomètre HS…"></textarea></div>
    <button class="btn-a" id="c_b" onclick="controler(${id})">Enregistrer le contrôle</button></div>`:''}

  <div class="card sec"><h2>Historique des contrôles</h2>${H.length?`<div class="pts-wrap"><table><thead><tr><th>Date</th><th class="num">Mesurée</th><th>Résultat</th><th class="num">Après</th><th>Vessie</th><th>Agent</th><th>Observations</th><th></th></tr></thead><tbody>
    ${H.map(c=>{const co=conformite(c.pression_mesuree,c.pression_reference??b.pression_preconisee);return `<tr><td>${dfr(c.date_controle)}</td><td class="num">${f(c.pression_mesuree)} bar</td><td><span class="badge ${co.c}">${co.l}</span></td>
      <td class="num">${c.regonfle?f(c.pression_apres)+' bar':'–'}</td><td>${{ok:'Bon',a_surveiller:'À surveiller',hs:'HS'}[c.etat_vessie]||'–'}</td><td>${esc((c.agent||'').split('@')[0])}</td><td>${esc(c.observations||'')}</td>
      <td>${peutModifier('maintenance',c,user)?`<button class="mini" onclick="supprCtrl(${c.id},${id})" aria-label="Supprimer">✕</button>`:''}</td></tr>`;}).join('')}</tbody></table></div>`:'<p class="site-c">Aucun contrôle enregistré.</p>'}</div>

  <div class="card sec"><h2>Photos</h2>
    ${saisie?`<input type="file" id="pin" accept="image/*" multiple style="display:none" onchange="ajouterPhotos(this,${id})"><label class="btn-l" for="pin" style="display:inline-block;margin-bottom:12px;cursor:pointer">+ Ajouter des photos</label><span class="site-c" id="pst" style="margin-left:10px">Compressées automatiquement (environ 300 Ko chacune)</span>`:''}
    <div class="gal" id="gal">${P.length?'<span class="site-c">Chargement…</span>':'<span class="site-c">Aucune photo.</span>'}</div></div>`;
  if(P.length)galerie(P,gest);
  if(document.getElementById('k_s'))calcA();else if(document.getElementById('k_b'))calcH();
}

/* ── Outil de calcul ── */
function outilCalcul(b,gest){
  if(b.fonction==='hydrophore')return `<p class="site-c" style="margin-bottom:10px">Hydrophore : gonflage = pression de démarrage de la pompe − 0,2 bar (ballon vide d'eau).</p>
    <div class="calc"><div class="fl"><label>Démarrage pompe (bar)</label><input id="k_b" inputmode="decimal" value="${b.pressostat_bas??''}" oninput="calcH(${b.volume_l||0})"></div>
    <div class="fl"><label>Arrêt pompe (bar)</label><input id="k_h" inputmode="decimal" value="${b.pressostat_haut??''}" oninput="calcH(${b.volume_l||0})"></div>
    <div class="fl"><label>Volume du ballon (l)</label><input id="k_v" inputmode="decimal" value="${b.volume_l??''}" oninput="calcH()"></div></div>
    <div id="k_r"></div>${gest?`<button class="btn-l" onclick="retenir(${b.id},'calcul_hydrophore')">Retenir comme gonflage préconisé</button>`:''}`;
  return `<p class="site-c" style="margin-bottom:10px">Anti-bélier : la valeur de référence est celle de l'étude du fabricant. À défaut, règle de formation : (pression de service + 1) / 3.</p>
    <div class="calc"><div class="fl"><label>Pression de service (bar)</label><input id="k_s" inputmode="decimal" value="${b.pression_service??''}" oninput="calcA()"></div>
    <div class="fl"><label>Volume du ballon (l)</label><input id="k_v" inputmode="decimal" value="${b.volume_l??''}" oninput="calcA()"></div></div>
    <div id="k_r"></div>
    ${gest?`<div class="tools"><button class="btn-l" onclick="retenir(${b.id},'formation')">Retenir l'estimation</button><input id="k_f" class="search" style="max-width:160px" inputmode="decimal" placeholder="Valeur fabricant"><button class="btn-l" onclick="retenir(${b.id},'fabricant')">Retenir la valeur fabricant</button></div>`:''}`;
}
let calcVal=null;
function calcH(){const bas=nb(k_b.value),haut=nb(k_h.value),V=nb(k_v.value);calcVal=null;
  if(bas==null){k_r.innerHTML='';return;}
  const p0=Math.max(0,bas-0.2);calcVal=Math.round(p0*100)/100;
  let vu='';if(haut!=null&&V&&haut>bas){const v=V*(p0+1)*(1/(bas+1)-1/(haut+1));vu=`<div class="site-c">Volume d'eau utilisable entre démarrage et arrêt : <b>${f(v,1)} l</b> (loi de Mariotte, pressions absolues)</div>`;}
  k_r.innerHTML=`<div class="res"><small class="site-c">Gonflage calculé</small><br><b>${f(calcVal)} bar</b>${vu}</div>`;}
function calcA(){const ps=nb(k_s.value),V=nb(k_v.value);calcVal=null;
  if(ps==null||ps<=0){k_r.innerHTML='<div class="warn2">Renseigne la pression de service pour obtenir une estimation.</div>';return;}
  calcVal=Math.round((ps+1)/3*100)/100;
  let w='';if(V){const air=V*(calcVal+1)/(ps+1);w=`<div class="site-c">À la pression de service, le ballon contient environ <b>${f(V-air,0)} l d'eau</b> et ${f(air,0)} l de gaz (loi de Mariotte).</div>`;}
  k_r.innerHTML=`<div class="res"><small class="site-c">Estimation, règle de formation</small><br><b>${f(calcVal)} bar</b>${w}</div><div class="warn2">Estimation à confirmer : seule l'étude de coup de bélier du fabricant fait référence.</div>`;}
async function retenir(id,src){
  let v=src==='fabricant'?nb(k_f.value):calcVal;
  if(v==null||isNaN(v)){toast(src==='fabricant'?'Saisis la valeur du fabricant':'Fais d\'abord le calcul');return;}
  const maj={pression_preconisee:v,source_preconisation:src};
  if(src!=='fabricant'){const s=document.getElementById('k_s'),b=document.getElementById('k_b'),h=document.getElementById('k_h');
    if(s&&nb(s.value)!=null)maj.pression_service=nb(s.value);if(b&&nb(b.value)!=null)maj.pressostat_bas=nb(b.value);if(h&&nb(h.value)!=null)maj.pressostat_haut=nb(h.value);}
  const {error}=await db.from('ballons').update(maj).eq('id',id);if(error)return toast('Erreur : '+error.message);
  Object.assign(B.find(x=>x.id===id),maj);toast('Gonflage préconisé enregistré ✓');fiche(id);
}

/* ── Contrôle ── */
function apercu(id){const b=B.find(x=>x.id===id),m=nb(c_m.value);if(m==null||isNaN(m)){c_ok.innerHTML='';return;}
  const co=conformite(m,b.pression_preconisee);c_ok.innerHTML=`<p style="margin-bottom:10px"><span class="badge ${co.c}">${co.l}</span>${b.pression_preconisee!=null&&co.c!=='b-ok'?` <span class="site-c">préconisé : ${f(b.pression_preconisee)} bar</span>`:''}</p>`;}
async function controler(id){
  const b=B.find(x=>x.id===id),m=nb(c_m.value),reg=c_r.checked,a=nb(c_a.value);
  if(!c_d.value||c_d.value>today())return toast('Date invalide');
  if(m==null||isNaN(m))return toast('Saisis la pression mesurée');
  if(b.ps_bar&&m>b.ps_bar)return toast('Pression supérieure à la pression maxi du ballon : vérifie la saisie');
  if(reg&&(a==null||isNaN(a)))return toast('Saisis la pression après regonflage');
  c_b.disabled=true;
  const {data,error}=await db.from('ballon_controles').insert({ballon_id:id,date_controle:c_d.value,pression_mesuree:m,pression_reference:b.pression_preconisee,regonfle:reg,pression_apres:reg?a:null,
    etat_vessie:c_v.value||null,observations:c_o.value.trim()||null,agent:user.email}).select().single();
  c_b.disabled=false;
  if(error)return toast(refusDroits(error)?'Tes droits ne permettent pas cette saisie':'Erreur : '+error.message);
  C.push(data);toast('Contrôle enregistré ✓');fiche(id);
}
async function supprCtrl(cid,id){if(!confirm('Supprimer ce contrôle ?'))return;const {error}=await db.from('ballon_controles').delete().eq('id',cid);
  if(error)return toast('Erreur : '+error.message);C=C.filter(c=>c.id!==cid);fiche(id);}

/* ── Photos : compression avant envoi ── */
function compresser(file){return new Promise((ok,ko)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const M=1600,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):ko(new Error('compression')),'image/jpeg',0.75);};
  im.onerror=()=>ko(new Error('image illisible'));im.src=u;});}
async function ajouterPhotos(inp,id){
  const fs=[...inp.files];inp.value='';let ok=0,av=0,ap=0;
  for(const [i,fl] of fs.entries()){
    pst.textContent=`Compression et envoi ${i+1} / ${fs.length}…`;
    try{const blob=await compresser(fl);av+=fl.size;ap+=blob.size;
      const chemin=`ballons/${id}/${Date.now()}_${i}.jpg`;
      const up=await db.storage.from('photos').upload(chemin,blob,{contentType:'image/jpeg'});if(up.error)throw up.error;
      const {data,error}=await db.from('ballon_photos').insert({ballon_id:id,chemin,taille:blob.size,legende:fl.name}).select().single();if(error)throw error;
      PH.push(data);ok++;
    }catch(e){toast(fl.name+' : '+(e.message||e));}
  }
  toast(`${ok} photo(s) ajoutée(s) · ${(av/1048576).toFixed(1).replace('.',',')} Mo réduits à ${(ap/1048576).toFixed(1).replace('.',',')} Mo`);fiche(id);
}
async function galerie(P,gest){
  const {data,error}=await db.storage.from('photos').createSignedUrls(P.map(p=>p.chemin),3600);
  if(error){gal.innerHTML='<span class="site-c">Photos indisponibles : '+esc(error.message)+'</span>';return;}
  gal.innerHTML=P.map((p,i)=>`<div class="ph"><img src="${data[i].signedUrl}" alt="${esc(p.legende||'Photo du ballon')}" loading="lazy" onclick="lbi.src=this.src;lb.classList.add('on')">${gest?`<button class="x" onclick="supprPhoto(${p.id})" aria-label="Supprimer la photo">✕</button>`:''}</div>`).join('');
}
async function supprPhoto(pid){const p=PH.find(x=>x.id===pid);if(!confirm('Supprimer cette photo ?'))return;
  const r=await db.storage.from('photos').remove([p.chemin]);if(r.error)return toast('Erreur : '+r.error.message);
  await db.from('ballon_photos').delete().eq('id',pid);PH=PH.filter(x=>x.id!==pid);fiche(p.ballon_id);}

/* ── Modification de la fiche (gestion) ── */
function editer(id){
  const b=B.find(x=>x.id===id);
  const champ=(k,l,t='text')=>`<div class="fl"><label for="e_${k}">${l}</label><input id="e_${k}" ${t==='date'?'type="date"':t==='num'?'inputmode="decimal"':''} value="${esc(b[k]??'')}"></div>`;
  view.innerHTML=`<button class="back" onclick="fiche(${id})">‹ Annuler</button><div class="head"><div class="head-l">${ico}<div><h1>Modifier la fiche</h1><div class="sub">${esc(b.site_libelle)}</div></div></div></div>
  <div class="card sec"><div class="grid2">
    ${champ('site_libelle','Site')}${champ('commune','Commune')}${champ('repere','Repère (1, Amont, Gauche…)')}
    <div class="fl"><label for="e_fonction">Fonction</label><select id="e_fonction">${Object.entries(FONCTIONS).map(([k,l])=>`<option value="${k}" ${b.fonction===k?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="fl"><label for="e_site_id">Ouvrage rattaché</label><select id="e_site_id"><option value="">—</option>${SITES.map(s=>`<option value="${s.id}" ${b.site_id===s.id?'selected':''}>${esc(s.nom)} (${esc(s.commune)})</option>`).join('')}</select></div>
    ${champ('marque','Marque')}${champ('numero_serie','N° de série')}${champ('volume_l','Volume (l)','num')}${champ('ps_bar','Pression maxi PS (bar)','num')}${champ('pt_bar','Pression d\'épreuve (bar)','num')}
    ${champ('pression_service','Pression de service (bar)','num')}${champ('pressostat_bas','Pressostat bas (hydrophore)','num')}${champ('pressostat_haut','Pressostat haut (hydrophore)','num')}
    ${champ('gaz','Gaz')}${champ('categorie_desp','Catégorie (I à IV)')}${champ('annee_service','Année de mise en service','num')}${champ('date_epreuve','Date d\'épreuve','date')}${champ('prochaine_echeance','Prochaine échéance réglementaire','date')}
  </div><div class="fl"><label for="e_commentaires">Commentaires</label><textarea id="e_commentaires">${esc(b.commentaires||'')}</textarea></div>
  <label class="site-c"><input type="checkbox" id="e_actif" style="width:auto" ${b.actif!==false?'checked':''}> Ballon en service</label></div>
  <div class="foot"><button class="btn-l" onclick="fiche(${id})">Annuler</button><button class="btn-a" onclick="sauver(${id})">Enregistrer</button></div>`;
}
async function sauver(id){
  const NUM=['volume_l','ps_bar','pt_bar','pression_service','pressostat_bas','pressostat_haut','annee_service'],TXT=['site_libelle','commune','repere','marque','numero_serie','gaz','categorie_desp','commentaires','date_epreuve','prochaine_echeance','fonction'];
  const m={};for(const k of NUM){const v=nb(document.getElementById('e_'+k).value);if(v!=null&&isNaN(v))return toast('Valeur non numérique : '+k);m[k]=v;}
  for(const k of TXT){const v=document.getElementById('e_'+k).value.trim();m[k]=v||null;}
  if(!m.site_libelle)return toast('Le site est obligatoire');
  m.site_id=+e_site_id.value||null;m.actif=e_actif.checked;if(m.annee_service!=null)m.annee_service=Math.round(m.annee_service);
  const {error}=await db.from('ballons').update(m).eq('id',id);if(error)return toast('Erreur : '+error.message);
  Object.assign(B.find(x=>x.id===id),m);toast('Fiche enregistrée ✓');location.hash='b='+id;fiche(id);
}
start();
</script>
