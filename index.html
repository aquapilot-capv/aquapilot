<style>
:root{
  --bg:#F4F1EC; --card:#FFFFFF; --line:#E7E1D8; --ink:#26221E; --mute:#7A7068;
  --acc:#B84712; --acc-soft:#FBE9DC;
  --ok:#2F7D4F; --ok-soft:#E3F1E8; --warn:#B7791F; --warn-soft:#FCF1DC; --bad:#B42318; --bad-soft:#FDE7E4;
  --font:'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ic{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}

/* Charpente (identique à jaugeages.html) */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center;flex:none}
.brand b{font-size:1rem;display:block}.brand small{font-size:.7rem;color:var(--mute)}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;font-size:.93rem}
.nav a:hover{background:#F7F3EE}
.nav a.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.nav .ic{width:28px;height:28px;margin:-4px;stroke-width:4.5;flex:none}
.who{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;font-size:.82rem;color:var(--mute)}
.who button{background:none;border:none;color:var(--acc);font-weight:600;padding:0;margin-top:4px}
main{padding:28px 32px 60px;min-width:0;max-width:1180px}
.crumb{font-size:.82rem;color:var(--mute);margin-bottom:6px}
h1{font-size:1.75rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:700}
.sub{color:var(--mute);font-size:.9rem;margin-top:4px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.btn-l{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;font-size:.88rem;color:var(--ink)}
.btn-l.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px}
.sec-h a{color:var(--acc);font-weight:600;font-size:.88rem;text-decoration:none}

/* Alertes ressource */
.alerts{padding:6px 0}
.al{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.al:last-child{border-bottom:none}.al:hover{background:#FBF8F4}
.al b{font-weight:600}.al small{color:var(--mute);font-size:.8rem;display:block}
.al .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}
.empty{padding:18px;color:var(--mute);font-size:.9rem}

/* Grille de modules */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:left;color:inherit;text-decoration:none}
.tile:hover{border-color:#D9C9B8}
.icw{position:relative;display:block;width:52px;height:52px;flex:none}
.icw .ico{width:100%;height:100%;display:block;border-radius:14px}
.pastille{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#D92D20;color:#fff;font-size:.74rem;font-weight:700;line-height:1;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3);font-variant-numeric:tabular-nums}
.tile .ico{flex:none}
.tile .ico .ic{stroke-width:2.6;color:var(--acc)}
.tile b{font-size:.95rem;font-weight:600;line-height:1.2}
.tile small{font-size:.78rem;color:var(--mute);line-height:1.3}
.tile.hid{opacity:.4}
.soon{position:absolute;top:12px;right:12px;font-size:.68rem;font-weight:600;color:var(--mute);background:#EFEBE5;padding:2px 8px;border-radius:999px}
.ctrl{display:none;gap:4px;margin-top:2px}
.editing .ctrl{display:flex}
.ctrl button{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:28px;font-size:.8rem;color:var(--ink)}
.editing .tile .ico{animation:w .35s ease-in-out infinite alternate}
@keyframes w{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.editing .tile .ico{animation:none}}

/* Mobile */
.mtop,.bnav,.dens{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}.side{display:none}
  main{padding:0 16px calc(96px + env(safe-area-inset-bottom,0))}
  .mtop{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0)) 0 12px;border-bottom:2px solid var(--acc);margin:0 -16px 18px;padding-left:16px;padding-right:16px;background:var(--card)}
  .avatar{width:40px;height:40px;border-radius:50%;background:#EFEBE5;display:grid;place-items:center;font-weight:700;font-size:.85rem;border:none;color:var(--ink)}
  h1{font-size:1.6rem}
  .dens{display:block;margin:4px 0 16px}
  .dens p{font-size:.78rem;font-weight:600;margin-bottom:6px}
  .dens button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:600;margin-right:6px}
  .dens button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .grid{grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:20px 12px}
  .tile{background:none;border:none;padding:0;align-items:center;text-align:center;gap:8px}
  .tile .icw{width:100%;height:auto}
  .tile .ico{width:100%;height:auto;aspect-ratio:1;border-radius:24%}
  .pastille{top:-6px;right:-6px}
  .tile small{display:none}
  .tile b{font-size:var(--fs,.85rem)}
  .soon{top:-6px;right:-2px;background:#fff;border:1px solid var(--line)}
  .al{grid-template-columns:1fr auto;padding:12px 14px}
  .al .v{display:none}
  .tile b{word-break:break-word;hyphens:auto}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0));z-index:20}
  .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--mute);text-decoration:none;font-weight:500}
  .bnav a.on{color:var(--acc)}
  .bnav .ic{width:32px;height:32px;margin:-4px;stroke-width:4.5}
}

/* Connexion */
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.login.off{display:none}
.login .card{width:100%;max-width:360px;padding:28px}
.login p{color:var(--mute);font-size:.88rem;margin:4px 0 16px}
.login label{display:block;font-size:.8rem;font-weight:600;margin:10px 0 4px}
.login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:600;width:100%;margin-top:16px}
.err{color:var(--bad);font-size:.85rem;margin-top:10px;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0));transform:translate(-50%,40px);opacity:0;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:.88rem;font-weight:500;transition:.2s;z-index:60;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
</style>
</head>

/* Droits nécessaires pour voir chaque tuile (les dossiers apparaissent s'ils contiennent au moins une tuile visible) */
const DROIT={alertes:['jaugeages',1],m_antibelier:['maintenance',1],r_compteur:['compteurs',2],d_conso:['compteurs',1],r_uv:['traitement',2],r_chlore:['traitement',2],r_jaugeage:['jaugeages',2],r_piezo:['piezos',2],d_jaugeages:['jaugeages',1],d_nappes:['piezos',1],d_qualite:['traitement',1],
  docs:['documentation',1],projets:['projets',1],d_sauvegarde:['gestion'],utilisateurs:['super']};
function visible(id){const m=M[id];if(!m)return false;if(m.items)return m.items.some(visible);const d=DROIT[id];if(!d)return true;
  if(d[0]==='super')return estSuperAdmin();if(d[0]==='gestion')return estGestionnaire();return niv(d[0])>=d[1];}

const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,cfg={order:{},hidden:[],density:9},level='root',editing=false,alertes=null,saveT;
const ic=(n,cls='')=>`<svg class="ic ${cls}" viewBox="0 0 96 96"><use href="#ic-${n}"/></svg>`;

/* ── Connexion ── */
async function start(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){document.getElementById('login').classList.remove('off');return;}
  user=session.user; document.getElementById('login').classList.add('off');
  await chargerProfil(db,user);
  document.getElementById('who').textContent=user.email;
  const n=prenom(); document.getElementById('avatar').textContent=n.slice(0,2).toUpperCase();
  await loadCfg(); route(); if(niv('jaugeages')>=1)chargerAlertes();
}
function prenom(){const p=(user.email.split('@')[0].split(/[._-]/)[0]||'');return p.charAt(0).toUpperCase()+p.slice(1);}
async function login(){er.textContent='';bl.disabled=true;
  const {error}=await db.auth.signInWithPassword({email:em.value.trim(),password:pw.value});bl.disabled=false;
  if(error){er.textContent='Email ou mot de passe incorrect.';return;} start();}
async function logout(){if(!confirm('Se déconnecter ?'))return;await db.auth.signOut();location.hash='';location.reload();}
pw.addEventListener('keydown',e=>{if(e.key==='Enter')login()});

/* ── Préférences (même table qu'avant) ── */
async function loadCfg(){
  try{const c=localStorage.getItem('portail-cfg-'+user.id);if(c)cfg={...cfg,...JSON.parse(c)};}catch(e){}
  try{const {data}=await db.from('preferences').select('config').eq('user_id',user.id).maybeSingle();if(data&&data.config)cfg={...cfg,...data.config};}catch(e){}
  if(![9,12,15].includes(cfg.density))cfg.density=9;
}
function saveCfg(){
  try{localStorage.setItem('portail-cfg-'+user.id,JSON.stringify(cfg));}catch(e){}
  clearTimeout(saveT);saveT=setTimeout(()=>db.from('preferences').upsert({user_id:user.id,config:cfg,updated_at:new Date().toISOString()}),600);
}

/* ── Navigation ── */
window.addEventListener('hashchange',route);
function route(){const h=location.hash.slice(1);level=h==='alertes'&&visible('alertes')?'alertes':(M[h]&&M[h].items&&visible(h))?h:'root';render();}
function itemsOf(lv){const b=M[lv].items,s=cfg.order[lv]||[],nv=b.filter(i=>!s.includes(i));
  return [...(lv==='root'&&nv.includes('alertes')?['alertes']:[]),...s.filter(i=>b.includes(i)),...nv.filter(i=>!(lv==='root'&&i==='alertes'))];}   // un module nouveau passe en tête pour les agents qui ont déjà une disposition
function go(id){
  const m=M[id]; if(editing&&!m.items)return;
  if(m.items||id==='alertes'){location.hash=id;return;}
  if(m.url){location.href=m.url;return;}
  toast(m.label+' : bientôt disponible');
}

/* ── Rendu ── */
function render(){
  montrerMenu(level,true);   // menu commun (menu.js)
  if(level==='alertes'){
    view.innerHTML=`<div class="crumb"><a href="#" style="color:inherit">Accueil</a> › Alertes</div>
    <div class="head"><div><h1>Alertes</h1><div class="sub">Ce qui demande ton attention</div></div></div>
    <div class="sec-h" style="margin-top:0"><h2>Ressource</h2><a href="jaugeages.html">Tous les captages ›</a></div>
    <div class="card alerts" id="alertes">${alertesHTML()}</div>`;return;}
  const isRoot=level==='root', d=cfg.density;
  const nAl=alertes&&!alertes.err?alertes.length:0;
  const cols={9:3,12:4,15:5}[d], fs={9:'.85rem',12:'.74rem',15:'.66rem'}[d];
  const ids=itemsOf(level).filter(visible).filter(i=>editing||!cfg.hidden.includes(i));
  const tiles=ids.map(id=>{const m=M[id],hid=cfg.hidden.includes(id),ready=m.url||m.items||id==='alertes';
    return `<div class="tile ${hid?'hid':''}" role="button" tabindex="0" onclick="go('${id}')" onkeydown="if(event.key==='Enter')go('${id}')">
      <span class="icw"><svg class="ico" viewBox="0 0 96 96"><rect width="96" height="96" rx="24" fill="url(#tile)"/><g class="ic"><use href="#ic-${m.ic}"/></g></svg>${id==='alertes'&&nAl?`<span class="pastille" role="img" aria-label="${nAl} alerte${nAl>1?'s':''}">${nAl}</span>`:''}</span>
      <div><b>${m.label}</b><br><small>${m.desc||''}</small></div>
      ${!ready&&!editing?'<span class="soon">bientôt</span>':''}
      <div class="ctrl" onclick="event.stopPropagation()"><button onclick="move('${id}',-1)" aria-label="Avancer">‹</button><button onclick="hide('${id}')" aria-label="Masquer ou afficher">${hid?'○':'●'}</button><button onclick="move('${id}',1)" aria-label="Reculer">›</button></div>
    </div>`;}).join('');
  const date=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  view.innerHTML=`
  <div class="crumb">${isRoot?date.charAt(0).toUpperCase()+date.slice(1):'<a href="#" style="color:inherit">Accueil</a> › '+M[level].label}</div>
  <div class="head"><div><h1>${isRoot?'Bonjour '+prenom():M[level].label}</h1>
    <div class="sub">${isRoot?'Le terrain et la ressource, en un coup d\'œil':M[level].desc}</div></div>
    <button class="btn-l ${editing?'on':''}" onclick="toggleEdit()">${editing?'Terminer':'Personnaliser'}</button></div>
  <div class="dens"><p>Icônes par écran</p>${[9,12,15].map(n=>`<button class="${d===n?'on':''}" onclick="setDens(${n})">${n}</button>`).join('')}</div>
  <div class="grid ${editing?'editing':''}" style="--cols:${cols};--fs:${fs}">${tiles}</div>
  ${editing?'<p class="sub" style="margin-top:14px">‹ › pour déplacer, ● / ○ pour afficher ou masquer. Chaque agent a sa propre disposition.</p>':''}`;
}
function toggleEdit(){editing=!editing;render();}
function setDens(n){cfg.density=n;saveCfg();render();}
function move(id,d){const l=itemsOf(level),i=l.indexOf(id),j=i+d;if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];cfg.order[level]=l;saveCfg();render();}
function hide(id){cfg.hidden=cfg.hidden.includes(id)?cfg.hidden.filter(x=>x!==id):[...cfg.hidden,id];saveCfg();render();}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200);}

/* ── Alertes ressource : même calcul que l'écran Jaugeages ── */
function alertesHTML(){
  if(alertes===null)return '<div class="empty">Analyse des derniers jaugeages…</div>';
  if(alertes.err)return `<div class="empty">Alertes indisponibles : ${esc(alertes.err)}</div>`;
  if(!alertes.length)return '<div class="empty">Aucun captage suivi n\'est sous −30 % de sa normale. ✓</div>';
  return alertes.map(a=>`<a class="al" href="jaugeages.html#site=${a.id}"><div><b>${esc(a.nom)}</b><small>${esc(a.commune)} · ${a.mois}</small></div>
    <div class="v">${Math.round(a.val).toLocaleString('fr-FR')} l/min</div>${a.badge}</a>`).join('');
}
async function toutes(q){let o=[],f=0;while(true){const {data,error}=await q().range(f,f+999);if(error)throw error;o=o.concat(data);if(data.length<1000)break;f+=1000;}return o;}
async function chargerAlertes(){
  try{
    const [sites,points]=await Promise.all([toutes(()=>db.from('sites').select('id,commune,nom,actif').eq('actif',true)),
      toutes(()=>db.from('points').select('id,site_id,dans_total').eq('famille','jaugeage').eq('dans_total',true))]);
    const mes=await toutes(()=>db.from('mesures').select('point_id,date_mesure,valeur,statut').in('point_id',points.map(p=>p.id)));
    const P=Object.fromEntries(points.map(p=>[p.id,p])),acc={};
    for(const m of mes){const p=P[m.point_id];let v=m.statut==='mesure'?m.valeur:m.statut==='sec'?0:m.statut==='plafond'?m.valeur:null;
      if(v==null)continue;const k=p.site_id+'|'+m.date_mesure.slice(0,7);const a=acc[k]??={pts:{},plaf:false};
      (a.pts[p.id]??=[]).push(+v);if(m.statut==='plafond')a.plaf=true;}
    const MO=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    const out=[];
    for(const s of sites){
      const ser=Object.keys(acc).filter(k=>+k.split('|')[0]===s.id).map(k=>{const a=acc[k];const vals=Object.values(a.pts).map(l=>l.reduce((x,y)=>x+y,0)/l.length);
        return {ym:k.split('|')[1],n:vals.length,tot:vals.reduce((x,y)=>x+y,0),plaf:a.plaf};}).sort((a,b)=>a.ym<b.ym?-1:1);
      if(!ser.length)continue;
      const yr={};ser.forEach(x=>{yr[x.ym.slice(0,4)]=Math.max(yr[x.ym.slice(0,4)]||0,x.n)});
      ser.forEach(x=>x.partiel=x.n<yr[x.ym.slice(0,4)]);
      const ok=ser.filter(x=>!x.partiel&&!x.plaf),last=ser[ser.length-1];
      if(last.partiel||last.plaf||+last.ym.slice(0,4)<new Date().getFullYear()-1)continue;
      const same=ok.filter(x=>x.ym.slice(5)===last.ym.slice(5)&&x.ym!==last.ym).map(x=>x.tot);
      if(same.length<3)continue;
      const norm=same.reduce((a,b)=>a+b,0)/same.length,ec=(last.tot-norm)/norm*100,minT=Math.min(...ok.map(x=>x.tot));
      const record=last.tot<=minT;
      if(ec>-30&&!record)continue;
      out.push({id:s.id,nom:s.nom,commune:s.commune,val:last.tot,ec,mois:MO[+last.ym.slice(5)-1]+' '+last.ym.slice(0,4),
        badge:record?'<span class="badge b-bad">Plus bas historique</span>':`<span class="badge b-bad">${Math.round(ec)} % vs normale</span>`,rec:record});
    }
    out.sort((a,b)=>(b.rec-a.rec)||(a.ec-b.ec)); alertes=out;
  }catch(e){alertes={err:e.message};}
  render();   // met à jour la pastille et, sur l'écran Alertes, la liste
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
start();
</script>
