<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EC">
<title>Tournée chlore / dioxyde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#F4F1EC;--card:#fff;--line:#E7E1D8;--ink:#26221E;--mute:#7A7068;--acc:#B84712;--acc-soft:#FBE9DC;
  --ok:#2F7D4F;--ok-soft:#E3F1E8;--warn:#B7791F;--warn-soft:#FCF1DC;--bad:#B42318;--bad-soft:#FDE7E4;--blue:#2F6F9F;--blue-soft:#E3EEF7;
  --font:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
button,input,textarea{font:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0)) 16px calc(110px + env(safe-area-inset-bottom,0))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top a,.top button.back{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink);text-decoration:none;font-size:1.3rem;flex:none}
.top h1{font-size:1.35rem;font-weight:700;line-height:1.2}.top .sub{font-size:.85rem;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.net{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;font-size:.88rem;font-weight:500;margin-bottom:12px}
.net.off{background:var(--warn-soft);color:var(--warn)}.net.wait{background:var(--acc-soft);color:var(--acc)}
.net button{margin-left:auto;border:none;background:var(--acc);color:#fff;border-radius:8px;padding:6px 12px;font-weight:600;font-size:.82rem}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.zone{padding:12px;text-align:center;color:inherit}
.zone img{width:100%;border-radius:8px;display:block;margin-bottom:8px;mix-blend-mode:multiply}
.zone b{font-size:1.05rem}.zone small{display:block;color:var(--mute);font-size:.78rem}
.prog{padding:14px 16px;margin-bottom:14px}
.prog .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.prog b{font-size:1.4rem}.bar{height:8px;background:#EFEAE3;border-radius:99px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.sem{display:flex;gap:6px;align-items:center}
.sem button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:32px}
.sem span{font-weight:600;font-size:.9rem;min-width:130px;text-align:center}
.grp{font-size:.78rem;font-weight:700;color:var(--mute);margin:18px 2px 8px;text-transform:uppercase;letter-spacing:.03em}
.site{display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:8px;width:100%;text-align:left;color:inherit}
.site .n{font-weight:600}.site .m{font-size:.8rem;color:var(--mute)}.site .st{margin-left:auto;flex:none;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.c-todo{background:#EFEBE5;color:var(--mute)}.c-wait{background:var(--acc-soft);color:var(--acc)}
.c-vert{background:var(--ok-soft);color:var(--ok)}.c-orange{background:var(--warn-soft);color:var(--warn)}.c-rouge{background:var(--bad-soft);color:var(--bad)}.c-bleu{background:var(--blue-soft);color:var(--blue)}
.fld{margin-bottom:14px}.fld>label,.lab{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px}
.inp{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:1rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:.88rem;font-weight:500;color:var(--ink)}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pt{padding:16px;margin-bottom:12px}
.pt h3{font-size:1.05rem;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
@media (max-width:620px){.g4{grid-template-columns:1fr 1fr}.g5{grid-template-columns:1fr 1fr}}
.f label{display:block;font-size:.75rem;color:var(--mute);font-weight:600;margin-bottom:4px}
.f input{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.f input:focus{border-color:var(--acc);outline:none}
.f input.bad{border-color:var(--bad);background:var(--bad-soft)}
.f .u{font-size:.72rem;color:var(--mute);margin-top:3px;min-height:1em}
.clo2{margin-top:8px;font-size:.92rem;font-weight:600}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.85rem;font-weight:500;margin-top:8px}
.skip{font-size:.78rem;color:var(--mute);font-weight:500}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0));z-index:10}
.foot .in{max-width:820px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;background:var(--acc);color:#fff;border:none;border-radius:12px;padding:14px;font-weight:700;font-size:1rem}
.btn:disabled{opacity:.5}
.btn2{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;font-weight:600;color:var(--bad)}
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.login.off{display:none}.login .card{width:100%;max-width:360px;padding:28px}.login label{display:block;font-size:.8rem;font-weight:600;margin:10px 0 4px}
.err{color:var(--bad);font-size:.85rem;margin-top:10px;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0));transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:.9rem;font-weight:500;transition:.2s;z-index:60;max-width:92vw;text-align:center;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.loading{padding:50px;text-align:center;color:var(--mute)}
.note{font-size:.8rem;color:var(--mute);margin-top:14px}
</style>
</head>
<body>
<div class="login off" id="login"><div class="card">
  <h2>Connexion</h2><p style="color:var(--mute);font-size:.88rem;margin:4px 0 12px">Accès réservé aux agents du service.</p>
  <label for="em">Email</label><input class="inp" id="em" type="email" autocomplete="username">
  <label for="pw">Mot de passe</label><input class="inp" id="pw" type="password" autocomplete="current-password">
  <button class="btn" style="width:100%;margin-top:16px" id="bl" onclick="login()">Se connecter</button><div class="err" id="er"></div>
</div></div>
<div class="wrap"><div id="net"></div><div id="view"><div class="loading">Chargement…</div></div></div>
<div class="foot" id="foot" style="display:none"></div>
<div class="toast" id="toast"></div>

/* Semaine ISO */
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();return {y,w:Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)};}
function lundi(y,w){const j4=new Date(Date.UTC(y,0,4));const d=j4.getUTCDay()||7;const m=new Date(j4);m.setUTCDate(j4.getUTCDate()-d+1+(w-1)*7);return m;}
function semBornes(s){const a=lundi(s.y,s.w),b=new Date(a);b.setUTCDate(a.getUTCDate()+6);return [a.toISOString().slice(0,10),b.toISOString().slice(0,10)];}
function semDecal(s,n){const a=lundi(s.y,s.w);a.setUTCDate(a.getUTCDate()+7*n);return isoWeek(new Date(a.getUTCFullYear(),a.getUTCMonth(),a.getUTCDate()));}

/* ── Paliers (couleur + libellé) ── */
function palier(p,v){
  if(v==null||isNaN(v))return null;
  for(const [a,b,c,l] of (p.params.paliers||[]))if(v>=a&&(b==null||v<b))return {c,l};
  return null;
}
function etatMesures(p,m){ // couleur la plus grave d'un relevé
  const v=p.famille==='dioxyde'?m.clo2:m.chlore_libre,pl=palier(p,v);let c=pl?pl.c:null;
  if(m.turbidite!=null&&m.turbidite>2)c='rouge';if(m.temperature!=null&&m.temperature>25&&c!=='rouge')c='orange';
  return {c,l:pl?pl.l:''};
}

/* ── Connexion ── */
async function start(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){document.getElementById('login').classList.remove('off');return;}
  user=session.user;document.getElementById('login').classList.add('off');
  await chargerRef();sync();route();
}
async function login(){er.textContent='';bl.disabled=true;const {error}=await db.auth.signInWithPassword({email:em.value.trim(),password:pw.value});bl.disabled=false;
  if(error){er.textContent=navigator.onLine?'Email ou mot de passe incorrect.':'Pas de réseau : connecte-toi une première fois avec du réseau.';return;}start();}
pw.addEventListener('keydown',e=>{if(e.key==='Enter')login()});

/* ── Référentiel, gardé sur le téléphone ── */
async function toutes(q){let o=[],a=0;while(true){const {data,error}=await q().range(a,a+999);if(error)throw error;o=o.concat(data);if(data.length<1000)break;a+=1000;}return o;}
async function chargerRef(){
  if(!navigator.onLine&&REF)return;
  try{
    const [sites,points]=await Promise.all([toutes(()=>db.from('sites').select('id,commune,nom,type,zone,actif').in('type',['reservoir','dioxyde']).eq('actif',true)),
      toutes(()=>db.from('points').select('id,site_id,nom,famille,params,ordre').in('famille',['chlore','dioxyde']).eq('actif',true).order('ordre'))]);
    const d0=new Date();d0.setDate(d0.getDate()-28);
    const recent=await toutes(()=>db.from('releves_traitement').select('*').in('point_id',points.map(p=>p.id)).gte('date_releve',d0.toISOString().slice(0,10)));
    const rang=n=>n==='Réseau'?2:n==='Station'?1:0;points.sort((a,b)=>rang(a.nom)-rang(b.nom));
    REF={sites,points,recent,maj:Date.now()};LS.set('tr-ref',REF);
  }catch(e){if(!REF)throw e;}
}

/* ── File hors connexion ── */
const queue=()=>LS.get('tr-queue',[]);
function enqueue(op){const q=queue();q.push(op);LS.set('tr-queue',q);}
async function sync(){
  banner();if(!queue().length||sending||!navigator.onLine)return;
  sending=true;banner();
  try{while(queue().length){const op=queue()[0];
      if(op.del&&op.del.length){const {error}=await db.from('releves_traitement').delete().in('id',op.del);if(error)throw error;}
      if(op.rows.length){const {error}=await db.from('releves_traitement').insert(op.rows);if(error)throw error;}
      LS.set('tr-queue',queue().slice(1));}
    toast('Relevés envoyés ✓');await chargerRef();if(!FS)route();
  }catch(e){console.warn(e);}
  sending=false;banner();
}
window.addEventListener('online',()=>chargerRef().then(()=>{sync();if(!FS)route();}));
window.addEventListener('offline',banner);
function banner(){const n=queue().length,el=document.getElementById('net');
  if(!navigator.onLine)el.innerHTML=`<div class="net off">Pas de réseau. ${n?n+' relevé(s) gardé(s) sur le téléphone, envoi au retour du réseau.':'Tu peux saisir, l\'envoi se fera au retour du réseau.'}</div>`;
  else if(n)el.innerHTML=`<div class="net wait">${sending?'Envoi en cours…':n+' relevé(s) en attente d\'envoi'}${sending?'':'<button onclick="sync()">Envoyer</button>'}</div>`;
  else el.innerHTML='';}
function relevesSemaine(s){const [a,b]=semBornes(s);
  const pend=queue().flatMap(op=>op.rows.map(r=>({...r,_wait:true}))),del=new Set(queue().flatMap(op=>op.del||[]));
  return [...REF.recent.filter(m=>!del.has(m.id)),...pend].filter(m=>m.date_releve>=a&&m.date_releve<=b);}

/* ── Routage ── */
window.addEventListener('hashchange',route);
function route(){
  if(!REF){view.innerHTML='<div class="loading">Données indisponibles : connecte-toi une première fois avec du réseau.</div>';return;}
  const m=location.hash.match(/site=(\d+)/);
  if(m)return ouvrir(+m[1]);
  if(!zone)return choixZone();
  liste();
}
const sitesZone=z=>REF.sites.filter(s=>s.zone===z).sort((a,b)=>(ORDRE.indexOf(a.nom)+999*(ORDRE.indexOf(a.nom)<0))-(ORDRE.indexOf(b.nom)+999*(ORDRE.indexOf(b.nom)<0)));
function choixZone(){
  FS=null;foot.style.display='none';
  view.innerHTML=`<div class="top"><a href="index.html" aria-label="Retour au portail">‹</a><div><h1>Tournée chlore / dioxyde</h1><div class="sub">Choisis ta zone</div></div></div>
  <div class="zones">${[1,2,3].map(z=>`<button class="card zone" onclick="setZone(${z})"><img src="${ZIMG[z]}" alt="Carte de la zone ${z}"><b>Zone ${z}</b><small>${sitesZone(z).length} sites</small></button>`).join('')}</div>`;banner();
}
function setZone(z){zone=z;LS.set('tr-zone',z);liste();}

/* ── Liste de la semaine ── */
function liste(){
  FS=null;foot.style.display='none';
  sem??=isoWeek(new Date());
  const S=sitesZone(zone),rs=relevesSemaine(sem),P=Object.fromEntries(REF.points.map(p=>[p.id,p]));
  const etat={};for(const m of rs){const p=P[m.point_id];if(!p)continue;(etat[p.site_id]??=[]).push(m);}
  const fait=S.filter(s=>etat[s.id]).length,[a,b]=semBornes(sem);
  let h=`<div class="top"><a href="index.html" aria-label="Retour au portail">‹</a><div><h1>Tournée zone ${zone}</h1><div class="sub"><a href="#" onclick="event.preventDefault();zone=null;LS.set('tr-zone',null);choixZone()" style="color:var(--acc)">Changer de zone</a></div></div></div>
  <div class="card prog"><div class="row"><div><b>${fait}</b> / ${S.length} sites relevés</div>
    <div class="sem"><button onclick="sem=semDecal(sem,-1);liste()" aria-label="Semaine précédente">‹</button><span>Semaine ${sem.w}<br><small style="font-weight:500;color:var(--mute)">${a.slice(8)}/${a.slice(5,7)} – ${b.slice(8)}/${b.slice(5,7)}</small></span><button onclick="sem=semDecal(sem,1);liste()" aria-label="Semaine suivante">›</button></div></div>
    <div class="bar"><i style="width:${S.length?fait/S.length*100:0}%"></i></div></div>`;
  for(const [fam,titre] of [['reservoir','Chlore'],['dioxyde','Dioxyde de chlore']]){
    const L=S.filter(s=>s.type===fam);if(!L.length)continue;
    h+=`<div class="grp">${titre}</div>`;
    for(const s of L){
      const e=etat[s.id],pts=REF.points.filter(p=>p.site_id===s.id);
      let st='<span class="chip c-todo">À faire</span>';
      if(e){const w=e.some(m=>m._wait);st=e.map(m=>{const p=P[m.point_id],x=etatMesures(p,m);return `<span class="chip c-${x.c||'todo'}">${p.nom} ${f(p.famille==='dioxyde'?m.clo2:m.chlore_libre)}</span>`;}).join('')+(w?'<span class="chip c-wait">En attente</span>':'');}
      h+=`<button class="card site" onclick="location.hash='site=${s.id}'"><div><div class="n">${s.nom}</div><div class="m">${s.commune} · ${pts.map(p=>p.nom).join(' + ')}</div></div><div class="st">${st}</div></button>`;
    }
  }
  h+=`<p class="note">Couleurs provisoires (paliers à valider avec l'ARS). Rouge : à traiter, orange : à surveiller, vert : cible, bleu : élevé.</p>`;
  view.innerHTML=h;banner();
}

/* ── Fiche d'un site ── */
const CH=[['chlore_libre','Chlore libre','mg/l'],['chlore_total','Chlore total','mg/l'],['turbidite','Turbidité','NTU'],['temperature','Température','°C']];
const RG=[['reglage','Réglage',''],['pourcentage','%',''],['frequence','Fréquence',''],['vol_eau','Vol. eau','l'],['vol_javel','Vol. javel','l']];
function ouvrir(sid){
  const s=REF.sites.find(x=>x.id===sid);if(!s){location.hash='';return;}
  sem??=isoWeek(new Date());zone??=s.zone;
  const pts=REF.points.filter(p=>p.site_id===sid);
  const ex=relevesSemaine(sem).filter(m=>pts.some(p=>p.id===m.point_id));
  const [a,b]=semBornes(sem),t=today();
  FS={sid,variante:ex[0]?.variante||'',date:ex[0]?.date_releve||(t>=a&&t<=b?t:a),obs:ex[0]?.observations||'',del:ex.filter(m=>m.id).map(m=>m.id),edit:ex.length>0,
    v:Object.fromEntries(pts.map(p=>{const e=ex.find(m=>m.point_id===p.id)||{};const o={statut:e.statut==='arret'?'arret':'mesure',variante:e.variante||'',ok:false};
      for(const [k] of [...CH,...RG])o[k]=e[k]!=null?String(e[k]).replace('.',','):'';return [p.id,o];}))};
  drawForm();
}
function drawForm(){
  const s=REF.sites.find(x=>x.id===FS.sid),pts=REF.points.filter(p=>p.site_id===FS.sid);
  view.innerHTML=`<div class="top"><button class="back" onclick="history.back()" aria-label="Retour">‹</button><div><h1>${s.nom}</h1><div class="sub">${s.commune} · ${s.type==='dioxyde'?'dioxyde de chlore':'chlore'}${FS.edit?' · modification':''}</div></div></div>
  <div class="fld"><label for="dt">Date du relevé</label><input class="inp" id="dt" type="date" value="${FS.date}" max="${today()}" onchange="FS.date=this.value"></div>
  ${(()=>{const vs=varSite(pts);return vs?`<div class="fld"><span class="lab">Lieu de prélèvement</span><div class="seg">${vs.map(x=>`<button class="${FS.variante===x?'on':''}" onclick="FS.variante=FS.variante==='${x}'?'':'${x}';drawForm()">${x}</button>`).join('')}</div></div>`:''})()}
  ${pts.map(bloc).join('')}
  <div class="fld"><label for="ob">Observations</label><textarea class="inp" id="ob" rows="2" oninput="FS.obs=this.value" placeholder="Ex : PID sur stop, 4 contacts…">${FS.obs}</textarea></div>
  <p class="note">Laisse un lieu vide s'il n'a pas été relevé cette semaine : il ne sera pas enregistré.</p>`;
  foot.style.display='block';
  foot.innerHTML=`<div class="in">${FS.edit?'<button class="btn2" onclick="supprimer()">Supprimer</button>':''}<button class="btn" id="bs" onclick="enregistrer()">${FS.edit?'Mettre à jour':'Enregistrer'}</button></div>`;
  pts.forEach(p=>calc(p.id));
}
function varSite(pts){const v=pts.find(p=>p.params.variantes)?.params.variantes;if(!v)return null;if(v.join()==='Réservoir,Réseau'&&pts.length>1)return null;return v;}
function bloc(p){
  const v=FS.v[p.id],dx=p.famille==='dioxyde',vars=null;
  const champs=dx?CH.filter(([k])=>k!=='chlore_total'):CH;
  return `<div class="card pt"><h3>${p.nom}<span class="seg"><button class="${v.statut==='mesure'?'on':''}" onclick="FS.v[${p.id}].statut='mesure';drawForm()">Relevé</button><button class="${v.statut==='arret'?'on':''}" onclick="FS.v[${p.id}].statut='arret';drawForm()">Arrêt</button></span></h3>
    ${vars?`<div class="seg" style="margin-bottom:10px">${vars.map(x=>`<button class="${v.variante===x?'on':''}" onclick="FS.v[${p.id}].variante=FS.v[${p.id}].variante==='${x}'?'':'${x}';drawForm()">${x}</button>`).join('')}</div>`:''}
    ${v.statut==='arret'?'<div class="skip">Traitement à l\'arrêt : le relevé sera enregistré comme tel.</div>':`
    <div class="g4">${champs.map(([k,l,u])=>`<div class="f"><label for="i${p.id}${k}">${dx&&k==='chlore_libre'?'Chlore libre mesuré':l}</label><input id="i${p.id}${k}" inputmode="decimal" value="${v[k]}" placeholder="–" oninput="FS.v[${p.id}]['${k}']=this.value;FS.v[${p.id}].ok=false;calc(${p.id})"><div class="u" id="u${p.id}${k}">${u}</div></div>`).join('')}</div>
    ${dx?`<div class="clo2" id="cl${p.id}"></div>`:''}
    ${p.params.reglages?`<div class="g5">${RG.map(([k,l,u])=>`<div class="f"><label for="i${p.id}${k}">${l}</label><input id="i${p.id}${k}" ${k==='reglage'?'':'inputmode="decimal"'} value="${v[k]}" placeholder="–" oninput="FS.v[${p.id}]['${k}']=this.value"><div class="u">${u}</div></div>`).join('')}</div>`:''}
    <div id="w${p.id}"></div>`}
  </div>`;
}
function calc(id){
  const p=REF.points.find(x=>x.id===id),v=FS.v[id];if(v.statut!=='mesure')return;
  const cl=nb(v.chlore_libre),ct=nb(v.chlore_total),tu=nb(v.turbidite),te=nb(v.temperature),dx=p.famille==='dioxyde';
  const ref=dx?(cl==null?null:cl*2):cl,pl=palier(p,ref);
  const mark=(k,bad)=>{const el=document.getElementById('i'+id+k);if(el)el.classList.toggle('bad',!!bad);};
  const u=document.getElementById('u'+id+'chlore_libre');
  if(dx){const c=document.getElementById('cl'+id);if(c)c.innerHTML=cl==null?'':`ClO₂ = ${f(cl*2)} mg/l ${pl?`<span class="chip c-${pl.c}">${pl.l}</span>`:''}`;}
  else if(u)u.innerHTML=pl?`<span class="chip c-${pl.c}" style="padding:1px 7px">${pl.l}</span>`:'mg/l';
  mark('chlore_libre',pl&&pl.c==='rouge');mark('turbidite',tu!=null&&tu>2);mark('temperature',te!=null&&te>25);
  const w=[];
  if(cl!=null&&cl>2)w.push('chlore libre supérieur à 2 mg/l : vérifie la virgule');
  if(!dx&&cl!=null&&ct!=null&&ct<cl-0.02)w.push('le chlore total est inférieur au chlore libre');
  if(tu!=null&&tu>2)w.push('turbidité au-dessus de 2 NTU');
  if(te!=null&&(te>25||te<0))w.push(te>25?'température au-dessus de 25 °C':'température négative');
  if(te!=null&&te>40)w.push('température improbable : vérifie la saisie');
  v.alerte=w.length?w.join(' · '):null;
  const el=document.getElementById('w'+id);if(el)el.innerHTML=v.alerte?`<div class="warn">${v.alerte.charAt(0).toUpperCase()+v.alerte.slice(1)}</div>`:'';
}

/* ── Enregistrement ── */
function enregistrer(){
  if(!FS.date||FS.date>today()){toast('Date invalide');return;}
  const pts=REF.points.filter(p=>p.site_id===FS.sid),rows=[];
  for(const p of pts){
    const v=FS.v[p.id],dx=p.famille==='dioxyde';
    const r={point_id:p.id,date_releve:FS.date,statut:v.statut,variante:FS.variante||null,observations:FS.obs.trim()||null,agent:user.email,source:'terrain'};
    if(v.statut==='mesure'){
      for(const [k] of CH)r[k]=nb(v[k]);
      if(p.params.reglages){r.reglage=v.reglage.trim()||null;for(const k of ['pourcentage','frequence','vol_eau','vol_javel'])r[k]=nb(v[k]);}
      const vide=CH.every(([k])=>r[k]==null);if(vide)continue;
      if([...CH,...RG].some(([k])=>k!=='reglage'&&r[k]!=null&&isNaN(r[k]))){toast(p.nom+' : une valeur n\'est pas un nombre');return;}
      if(dx&&r.chlore_libre!=null)r.clo2=Math.round(r.chlore_libre*2*1000)/1000;

      if(v.alerte&&!v.ok){if(!confirm(p.nom+' — '+v.alerte+'\n\nEnregistrer quand même ?'))return;v.ok=true;}
    }
    rows.push(r);
  }
  if(!rows.length){toast('Aucune valeur saisie');return;}
  const vs=varSite(pts);if(vs&&!FS.variante){toast('Précise le lieu : '+vs.join(' ou '));return;}
  document.getElementById('bs').disabled=true;
  enqueue({del:FS.del,rows});
  toast(navigator.onLine?'Enregistré ✓':'Enregistré sur le téléphone, envoi au retour du réseau');
  FS=null;history.back();sync();
}
function supprimer(){
  if(!confirm('Supprimer le relevé de ce site pour cette semaine ?'))return;
  const ids=new Set(REF.points.filter(p=>p.site_id===FS.sid).map(p=>p.id)),[a,b]=semBornes(sem);
  LS.set('tr-queue',queue().map(op=>({...op,rows:op.rows.filter(r=>!(ids.has(r.point_id)&&r.date_releve>=a&&r.date_releve<=b))})).filter(op=>op.rows.length||(op.del&&op.del.length)));
  if(FS.del.length)enqueue({del:FS.del,rows:[]});
  REF.recent=REF.recent.filter(m=>!FS.del.includes(m.id));LS.set('tr-ref',REF);
  toast('Relevé supprimé');FS=null;history.back();sync();
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2800);}
start().catch(e=>{view.innerHTML=`<div class="loading">Chargement impossible : ${e.message}</div>`;});
</script>
</body>
</html>
